- id: 773f6061-9b5b-5295-9d9d-90f5b4573838
  name: Soumaia ART Tests - New shim database files created in the default shim database directory
  description: 'Upon execution, check the "C:\Windows\apppatch\Custom\" folder for the new shim database


    https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html (requires elevation)'
  tactic: privilege-escalation
  technique:
    attack_id: T1546.011
    name: 'Event Triggered Execution: Application Shimming'
  platforms:
    windows:
      psh:
        command: |-
          Copy-Item "$.\T1546.011CompatDatabase.sdb" C:\Windows\apppatch\Custom\T1546.011CompatDatabase.sdb
          Copy-Item "$.\T1546.011CompatDatabase.sdb" C:\Windows\apppatch\Custom\Custom64\T1546.011CompatDatabase.sdb
        cleanup: |-
          Remove-Item C:\Windows\apppatch\Custom\T1546.011CompatDatabase.sdb -ErrorAction Ignore
          Remove-Item C:\Windows\apppatch\Custom\Custom64\T1546.011CompatDatabase.sdb -ErrorAction Ignore
        payloads:
        - T1546.011CompatDatabase.sdb
