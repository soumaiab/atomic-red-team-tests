- requirements: []
  name: Soumaia ART Tests - Netsh Helper DLL Registration
  description: 'You can register a "helper dll" with Netsh as a persistance mechanism. The code in the dll is executed every time netsh.exe is called.

    The NetshHelper.dll provided with the atomic will simply launch notepad when netsh.exe is run.


    [Blog](https://htmlpreview.github.io/?https://github.com/MatthewDemaske/blogbackup/blob/master/netshell.html)

    [Sample DLL code](https://github.com/outflanknl/NetshHelperBeacon) (requires elevation)'
  tactic: privilege-escalation
  technique_id: T1546.007
  technique_name: 'Event Triggered Execution: Netsh Helper DLL'
  executors:
  - cleanup:
    - netsh.exe delete helper ".\NetshHelper.dll"
    timeout: 60
    platform: windows
    name: cmd
    payloads:
    - NetshHelper.dll
    parsers: []
    command: powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAE4AZQB0AHMAaABIAGUAbABwAGUAcgAuAGQAbABsACIAKQAgAHsAIABlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAIABlAHgAaQB0ACAAMQB9AAoA & if not "%ERRORLEVEL%"=="0" ( powershell -NoProfile -EncodedCommand  ) & netsh.exe add helper ".\NetshHelper.dll" & taskkill /im notepad.exe /t /f > NUL 2>&1
  id: dbf26dc7-9927-50ff-b141-20548c028421
