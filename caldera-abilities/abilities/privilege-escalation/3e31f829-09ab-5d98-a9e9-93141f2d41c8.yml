- requirements: []
  name: 'Soumaia ART Tests - Domain Password Policy Check: No Uppercase Character in Password'
  description: 'Attempt to change the password of the current domain user in order to check password policy. Ideally, you would only run this atomic test to verify that your password policy is blocking the use of the new password.

    If the password is succesfully changed to the new password, the credential file will be updated to reflect the new password. You can then run the atomic manually and specify a new password of your choosing, however the

    password policy will likely prevent you from setting the password back to what it was.'
  tactic: privilege-escalation
  technique_id: T1098
  technique_name: Account Manipulation
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: 'powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACQAZQBuAHYAOgBMAE8AQwBBAEwAQQBQAFAARABBAFQAQQBcAEEAdABvAG0AaQBjAFIAZQBkAFQAZQBhAG0AXAAkAGUAbgB2ADoAVQBTAEUAUgBOAEEATQBFAC4AdAB4AHQAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $credFile = "$env:LOCALAPPDATA\AtomicRedTeam\$env:USERNAME.txt"; if (Test-Path $credFile) { $cred = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList $env:USERNAME, (Get-Content $credFile | ConvertTo-SecureString); if($cred.GetNetworkCredential().Password -eq "lower-long-special-333"){ Write-Host -ForegroundColor Yellow "The new password is the same as the password stored in the credential file. Please specify a different new password."; exit -1 }; try { $newPassword = ConvertTo-SecureString lower-long-special-333 -AsPlainText -Force; Set-ADAccountPassword -Identity $env:USERNAME -OldPassword $cred.password -NewPassword $newPassword } catch { $_.Exception; $errCode = $_.Exception.ErrorCode; Write-Host "Error code: $errCode"; if ($errCode -eq 86) { Write-Host -ForegroundColor Yellow "The stored password for the current user is incorrect. Please run the prereq commands to set the correct credentials"; Remove-Item $credFile }; exit $errCode }; Write-Host -ForegroundColor Cyan "Successfully changed the password to lower-long-special-333"; $newCred = New-Object System.Management.Automation.PSCredential ($env:USERNAME, $(ConvertTo-SecureString "lower-long-special-333" -AsPlainText -Force)); $newCred.Password | ConvertFrom-SecureString | Out-File $credFile } else { Write-Host -ForegroundColor Yellow "You must store the password of the current user by running the prerequisite commands first" }'
  id: 3e31f829-09ab-5d98-a9e9-93141f2d41c8
