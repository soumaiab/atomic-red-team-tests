- requirements: []
  name: Soumaia ART Tests - Winlogon Userinit Key Persistence - PowerShell
  description: 'PowerShell code to set Winlogon userinit key to execute a binary at logon along with userinit.exe.


    Upon successful execution, PowerShell will modify a registry value to execute cmd.exe upon logon/logoff.'
  tactic: privilege-escalation
  technique_id: T1547.004
  technique_name: 'Boot or Logon Autostart Execution: Winlogon Helper DLL'
  executors:
  - cleanup:
    - Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\" -Name "Userinit" -Force -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Set-ItemProperty "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\" "Userinit" "Userinit.exe, C:\Windows\System32\cmd.exe" -Force
  id: b8a141d7-d629-54e4-b5fe-92a04b44549a
