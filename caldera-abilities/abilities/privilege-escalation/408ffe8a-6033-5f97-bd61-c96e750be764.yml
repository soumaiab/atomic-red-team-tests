- requirements: []
  name: Soumaia ART Tests - Persistence using automatic execution of custom DLL during RDP session
  description: "When remote desktop session is accepted, the system queries the key it queries the Registry key:HKLM\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\AddIns\\TestDVCPlugin. \nIf such key exists, the OS will attempt to read the Path value underneath.Once the Path is read, the DLL that it points to will be loaded via LoadLibrary. (requires elevation)"
  tactic: privilege-escalation
  technique_id: T1546
  technique_name: Event Triggered Execution
  executors:
  - cleanup:
    - reg delete "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\AddIns\TestDVCPlugin" /f
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\AddIns\TestDVCPlugin" /v Path /t REG_SZ /d "C:\Windows\System32\amsi.dll" /f
  id: 408ffe8a-6033-5f97-bd61-c96e750be764
