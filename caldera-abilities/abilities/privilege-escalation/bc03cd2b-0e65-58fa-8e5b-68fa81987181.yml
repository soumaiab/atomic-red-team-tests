- requirements: []
  name: Soumaia ART Tests - HKLM - Add atomic_test key to launch executable as part of user setup
  description: "This test will create an \"atomic_test\" key under 'HKLM:\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components' to launch calc by configuring an active setup executable and \nforcing to run active setup using the \"runonce.exe /AlternateShellStartup\" command. \nWithout the \"runonce.exe /AlternateShellStartup\" command it would run during the next logon for each user.\n\nNote: If you logout before running the cleanup command, you will be required to go through the OOBE (out-of-box experience) setup sequence to log back in. \nThe payload will only run once unless the cleanup command is run in between tests.\n\n[Active Setup Explained](https://helgeklein.com/blog/active-setup-explained/) (requires elevation)"
  tactic: privilege-escalation
  technique_id: T1547.014
  technique_name: Active Setup
  executors:
  - cleanup:
    - Remove-Item "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\atomic_test" -Force -ErrorAction Ignore; Remove-Item "HKCU:\SOFTWARE\Microsoft\Active Setup\Installed Components\atomic_test" -Force -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: New-Item "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components" -Name "atomic_test" -Force; Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\atomic_test" "(Default)" "ART TEST" -Force; Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\atomic_test" "StubPath" "C:\Windows\System32\calc.exe" -Force; & $env:SYSTEMROOT\system32\runonce.exe /AlternateShellStartup
  id: bc03cd2b-0e65-58fa-8e5b-68fa81987181
