- requirements: []
  name: Soumaia ART Tests - HKLM - Persistence using CommandProcessor AutoRun key (With Elevation)
  description: 'An adversary may abuse the CommandProcessor AutoRun registry key to persist. Every time cmd.exe is executed, the command defined in the AutoRun key also gets executed.

    [reference](https://devblogs.microsoft.com/oldnewthing/20071121-00/?p=24433) (requires elevation)'
  tactic: privilege-escalation
  technique_id: T1546
  technique_name: Event Triggered Execution
  executors:
  - cleanup:
    - Remove-ItemProperty -Path "HKLM:\Software\Microsoft\Command Processor" -Name "AutoRun" -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: New-ItemProperty -Path "HKLM:\Software\Microsoft\Command Processor" -Name "AutoRun" -Value "notepad.exe" -PropertyType "String"
  id: 55d54859-2b94-5571-b55a-05755df63096
