- requirements: []
  name: Soumaia ART Tests - PowerShell Modify A Scheduled Task
  description: "Create a scheduled task with an action and modify the action to do something else. The initial idea is to showcase Microsoft Windows TaskScheduler Operational log modification of an action on a Task already registered. \nIt will first be created to spawn cmd.exe, but modified to run notepad.exe.\n\nUpon successful execution, powershell.exe will create a scheduled task and modify the action."
  tactic: privilege-escalation
  technique_id: T1053.005
  technique_name: 'Scheduled Task/Job: Scheduled Task'
  executors:
  - cleanup:
    - Unregister-ScheduledTask -TaskName "AtomicTaskModifed" -confirm:$false >$null 2>&1
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $Action = New-ScheduledTaskAction -Execute "cmd.exe"; $Trigger = New-ScheduledTaskTrigger -AtLogon; $User = New-ScheduledTaskPrincipal -GroupId "BUILTIN\Administrators" -RunLevel Highest; $Set = New-ScheduledTaskSettingsSet; $object = New-ScheduledTask -Action $Action -Principal $User -Trigger $Trigger -Settings $Set; Register-ScheduledTask AtomicTaskModifed -InputObject $object; $NewAction = New-ScheduledTaskAction -Execute "Notepad.exe"; Set-ScheduledTask "AtomicTaskModifed" -Action $NewAction
  id: 6b6886ea-929e-5476-bbb6-7bfbb52fe9e8
