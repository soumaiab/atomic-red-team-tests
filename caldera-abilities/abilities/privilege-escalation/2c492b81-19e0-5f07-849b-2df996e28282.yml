- requirements: []
  name: Soumaia ART Tests - Winlogon HKLM Shell Key Persistence - PowerShell
  description: 'PowerShell code to set Winlogon shell key to execute a binary at logon along with explorer.exe.


    Upon successful execution, PowerShell will modify a registry value to execute cmd.exe upon logon/logoff.'
  tactic: privilege-escalation
  technique_id: T1547.004
  technique_name: 'Boot or Logon Autostart Execution: Winlogon Helper DLL'
  executors:
  - cleanup:
    - Remove-ItemProperty -Path "HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\" -Name "Shell" -Force -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Set-ItemProperty "HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\" "Shell" "explorer.exe, C:\Windows\System32\cmd.exe" -Force
  id: 2c492b81-19e0-5f07-849b-2df996e28282
