- requirements: []
  name: Soumaia ART Tests - Change Startup Folder - HKCU Modify User Shell Folders Startup Value
  description: "This test will modify the HKEY_CURRENT_USER\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders  -V \"Startup\" value \nto point to a new startup folder where a payload could be stored to launch at boot.  *successful execution requires system restart"
  tactic: privilege-escalation
  technique_id: T1547.001
  technique_name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
  executors:
  - cleanup:
    - Set-ItemProperty -Path  "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders" -Name "Startup" -Value "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"; Remove-Item "$env:TMP\atomictest\" -Recurse -Force
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: New-Item -ItemType Directory -path "$env:TMP\atomictest\"; Copy-Item -path "C:\Windows\System32\calc.exe" -destination "$env:TMP\atomictest\"; Set-ItemProperty -Path  "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders" -Name "Startup" -Value "$env:TMP\atomictest\"
  id: 5b314141-c67c-540c-9008-beec5b5555cc
