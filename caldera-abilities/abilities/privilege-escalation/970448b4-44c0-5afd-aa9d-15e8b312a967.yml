- requirements: []
  name: Soumaia ART Tests - Modify Service to Run Arbitrary Binary (Powershell)
  description: "This test will use PowerShell to temporarily modify a service to run an arbitrary executable by changing its binary path and will then revert the binary path change, restoring the service to its original state.\nThis technique was previously observed through SnapMC's use of Powerspolit's invoke-serviceabuse function. \n[Reference](https://blog.fox-it.com/2021/10/11/snapmc-skips-ransomware-steals-data/) (requires elevation)"
  tactic: privilege-escalation
  technique_id: T1543.003
  technique_name: 'Create or Modify System Process: Windows Service'
  executors:
  - cleanup:
    - Stop-Service -Name "fax" -force -erroraction silentlycontinue | Out-Null; set-servicebinarypath -name "fax" -path "$env:windir\system32\fxssvc.exe" -erroraction silentlycontinue | out-null
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Stop-Service -Name "fax" -force -erroraction silentlycontinue | Out-Null; set-servicebinarypath -name "fax" -path "$env:windir\system32\notepad.exe"; start-service -Name "fax" -erroraction silentlycontinue | out-null
  id: 970448b4-44c0-5afd-aa9d-15e8b312a967
