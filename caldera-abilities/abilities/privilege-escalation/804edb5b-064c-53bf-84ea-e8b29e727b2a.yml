- id: 804edb5b-064c-53bf-84ea-e8b29e727b2a
  name: Soumaia ART Tests - HKLM - re-execute 'Internet Explorer Core Fonts' StubPath payload by decreasing version number
  description: "This test will decrease the version number of the 'Internet Explorer Core Fonts' (UUID {C9E9A340-D1F1-11D0-821E-444553540600}) registry key for the current user, \nwhich will force the StubPath payload (if set) to execute. (requires elevation)"
  tactic: privilege-escalation
  technique:
    attack_id: T1547.014
    name: Active Setup
  platforms:
    windows:
      psh:
        command: |-
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Active Setup\Installed Components\{C9E9A340-D1F1-11D0-821E-444553540600}" -Name "Version" -Value "0,0,0,0"
          & $env:SYSTEMROOT\system32\runonce.exe /AlternateShellStartup
