- requirements: []
  name: Soumaia ART Tests - HKCU - Persistence using CommandProcessor AutoRun key (Without Elevation)
  description: 'An adversary may abuse the CommandProcessor AutoRun registry key to persist. Every time cmd.exe is executed, the command defined in the AutoRun key also gets executed.

    [reference](https://devblogs.microsoft.com/oldnewthing/20071121-00/?p=24433)'
  tactic: privilege-escalation
  technique_id: T1546
  technique_name: Event Triggered Execution
  executors:
  - cleanup:
    - Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Command Processor" -Name "AutoRun" -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $path = "HKCU:\Software\Microsoft\Command Processor"; if (!(Test-Path -path $path)){ New-Item -ItemType Key -Path $path }; New-ItemProperty -Path $path -Name "AutoRun" -Value "notepad.exe" -PropertyType "String"
  id: 6742e87a-6d27-5f48-b35c-336c93ca19ca
