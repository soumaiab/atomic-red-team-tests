- id: 43195991-2e73-521d-a4a8-4dc8682a5938
  name: Soumaia ART Tests - Windows MOFComp.exe Load MOF File
  description: "The following Atomic will utilize MOFComp.exe to load a local MOF file.\nThe Managed Object Format (MOF) compiler parses a file containing MOF statements and adds the classes and class instances defined in the file to the WMI repository. \nTo query for the class:  gwmi __eventfilter -namespace root\\subscription\nA successful execution will add the class to WMI root namespace.\nReference: https://pentestlab.blog/2020/01/21/persistence-wmi-event-subscription/ and https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/."
  tactic: privilege-escalation
  technique:
    attack_id: T1546.003
    name: 'Event Triggered Execution: Windows Management Instrumentation Event Subscription'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAYwA6AFwAdwBpAG4AZABvAHcAcwBcAHMAeQBzAHQAZQBtADMAMgBcAHcAYgBlAG0AXABtAG8AZgBjAG8AbQBwAC4AZQB4AGUAIgApACAAewAgAGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewAgAGUAeABpAHQAIAAxAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand VgBhAGwAaQBkAGEAdABlACAATQBPAEYAQwBvAG0AcAAuAGUAeABlACAAaQBzACAAbwBuACAAZABpAHMAawAgAHMAbwBtAGUAdwBoAGUAcgBlACAAYQBuAGQAIAB1AHAAZABhAHQAZQAgAGkAbgBwAHUAdAAgAGEAcgBnAHUAbQBlAG4AdAAuAAoA
          }
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAFQAMQA1ADQANgAuADAAMAAzAC4AbQBvAGYAIgApACAAewAgAGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewAgAGUAeABpAHQAIAAxAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          c:\windows\system32\wbem\mofcomp.exe ".\T1546.003.mof"
        cleanup: |-
          $EventConsumerToCleanup = Get-WmiObject -Namespace root/subscription -Class CommandLineEventConsumer -Filter "Name = 'AtomicRedTeam_consumer'"
          $EventFilterToCleanup = Get-WmiObject -Namespace root/subscription -Class __EventFilter -Filter "Name = 'AtomicRedTeam_filter'"
          $FilterConsumerBindingToCleanup = Get-WmiObject -Namespace root/subscription -Query "REFERENCES OF {$($EventConsumerToCleanup.__RELPATH)} WHERE ResultClass = __FilterToConsumerBinding" -ErrorAction SilentlyContinue
          $FilterConsumerBindingToCleanup | Remove-WmiObject
          $EventConsumerToCleanup | Remove-WmiObject
          $EventFilterToCleanup | Remove-WmiObject
        payloads:
        - T1546.003.mof
