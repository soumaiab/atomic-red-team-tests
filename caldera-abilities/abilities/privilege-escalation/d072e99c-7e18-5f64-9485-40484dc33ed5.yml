- requirements: []
  name: Soumaia ART Tests - Reg Key Run
  description: 'Run Key Persistence


    Upon successful execution, cmd.exe will modify the registry by adding \"Atomic Red Team\" to the Run key. Output will be via stdout.'
  tactic: privilege-escalation
  technique_id: T1547.001
  technique_name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
  executors:
  - cleanup:
    - REG DELETE "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /V "Atomic Red Team" /f >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: REG ADD "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /V "Atomic Red Team" /t REG_SZ /F /D "C:\Path\AtomicRedTeam.exe"
  id: d072e99c-7e18-5f64-9485-40484dc33ed5
