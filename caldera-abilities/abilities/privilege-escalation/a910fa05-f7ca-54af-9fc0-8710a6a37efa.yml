- requirements: []
  name: Soumaia ART Tests - Domain Account and Group Manipulate
  description: "Create a random atr-nnnnnnnn account and add it to a domain group (by default, Domain Admins). \n\nThe quickest way to run it is against a domain controller, using `-Session` of `Invoke-AtomicTest`. Alternatively,\nyou need to install PS Module ActiveDirectory (in prereqs) and run the script with appropriare AD privileges to \ncreate the user and alter the group. Automatic installation of the dependency requires an elevated session, \nand is unlikely to work with Powershell Core (untested).\n\nIf you consider running this test against a production Active Directory, the good practise is to create a dedicated\nservice account whose delegation is given onto a dedicated OU for user creation and deletion, as well as delegated\nas group manager of the target group.\n\nExample: `Invoke-AtomicTest -Session $session 'T1098' -TestNames \"Domain Account and Group Manipulate\" -InputArgs @{\"group\" = \"DNSAdmins\" }`"
  tactic: privilege-escalation
  technique_id: T1098
  technique_name: Account Manipulation
  executors:
  - cleanup:
    - Get-ADUser -LDAPFilter "(&(samaccountname=atr--*)(givenName=Test))" | Remove-ADUser -Confirm:$False
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand VAByAHkAIAB7AAoAIAAgACAAIABJAG0AcABvAHIAdAAtAE0AbwBkAHUAbABlACAAQQBjAHQAaQB2AGUARABpAHIAZQBjAHQAbwByAHkAIAAtAEUAcgByAG8AcgBBAGMAdABpAG8AbgAgAFMAdABvAHAAIAB8ACAATwB1AHQALQBOAHUAbABsAAoAIAAgACAAIABlAHgAaQB0ACAAMAAKAH0AIAAKAEMAYQB0AGMAaAAgAHsACgAgACAAIAAgAGUAeABpAHQAIAAxAAoAfQAKAA==; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $x = Get-Random -Minimum 2 -Maximum 99; $y = Get-Random -Minimum 2 -Maximum 99; $z = Get-Random -Minimum 2 -Maximum 99; $w = Get-Random -Minimum 2 -Maximum 99; Import-Module ActiveDirectory; $account = "atr--$x$y$z"; New-ADUser -Name $account -GivenName "Test" -DisplayName $account -SamAccountName $account -Surname $account -Enabled:$False; Add-ADGroupMember "Domain Admins" $account
  id: a910fa05-f7ca-54af-9fc0-8710a6a37efa
