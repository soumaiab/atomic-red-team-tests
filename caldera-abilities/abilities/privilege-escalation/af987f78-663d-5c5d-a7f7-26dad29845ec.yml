- id: af987f78-663d-5c5d-a7f7-26dad29845ec
  name: Soumaia ART Tests - Persistence using STARTUP-PATH in MS-WORD
  description: 'When Word starts, it searches for the registry key HKCU\Software\Microsoft\Office\<version>\Word\Options\STARTUP-PATH and if it exists,

    it will treat it as a user specific start-up folder and load the contents of the folder with file extensions of .wll,.lnk,.dotm,.dot,.dotx

    The registry key can be abused to load malware from the mentioned path. Reboot might be required. (requires elevation)'
  tactic: privilege-escalation
  technique:
    attack_id: T1546
    name: Event Triggered Execution
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKCU\Software\Microsoft\Office\16.0\Word\Options" /v STARTUP-PATH /t REG_SZ /d "C:\Users\%USERNAME%\AppData\Roaming\Microsoft\Windows\Recent" /f
        cleanup: |-
          reg delete HKCU\Software\Microsoft\Office\16.0\Word\Options /v STARTUP-PATH /f
