- requirements: []
  name: Soumaia ART Tests - Adding custom debugger for Windows Error Reporting
  description: 'When applications hang, the Windows Error Reporting framework allows us to attach a debugger, if it is set up in the Registry.

    Adding executable of choice will let the executable to auto-execute when during any application crash due to functioning of WER framework (requires elevation)'
  tactic: privilege-escalation
  technique_id: T1546
  technique_name: Event Triggered Execution
  executors:
  - cleanup:
    - reg delete "HKLM\Software\Microsoft\Windows\Windows Error Reporting\Hangs" /v Debugger /f
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKLM\Software\Microsoft\Windows\Windows Error Reporting\Hangs" /v Debugger /t REG_SZ /d "C:\Windows\System32\notepad.exe" /f
  id: 7da7891d-6dc2-5aab-a52b-be9266be419f
