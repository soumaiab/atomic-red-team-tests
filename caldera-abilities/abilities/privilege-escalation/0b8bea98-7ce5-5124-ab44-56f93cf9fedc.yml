- id: 0b8bea98-7ce5-5124-ab44-56f93cf9fedc
  name: Soumaia ART Tests - Create registry persistence via AppCert DLL
  description: "Creates a new 'AtomicTest' value pointing to an AppCert DLL in the AppCertDlls registry key. \nOnce the computer restarted, the DLL will be loaded in multiple processes and write an \n'AtomicTest.txt' file in C:\\Users\\Public\\ to validate that the DLL executed succesfully.\n\nReference: https://skanthak.homepage.t-online.de/appcert.html (requires elevation)"
  tactic: privilege-escalation
  technique:
    attack_id: T1546.009
    name: 'Event Triggered Execution: AppCert DLLs'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAEEAdABvAG0AaQBjAFQAZQBzAHQALgBkAGwAbAAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Copy-Item ".\AtomicTest.dll" C:\Users\Public\AtomicTest.dll -Force
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\AppCertDlls" /v "AtomicTest" /t REG_EXPAND_SZ /d "C:\Users\Public\AtomicTest.dll" /f
          if($false){Restart-Computer}
        cleanup: |-
          reg delete "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\AppCertDlls" /v "AtomicTest" /f
          Remove-Item C:\Users\Public\AtomicTest.dll -Force
          Remove-Item C:\Users\Public\AtomicTest.txt -Force
        payloads:
        - AtomicTest.dll
