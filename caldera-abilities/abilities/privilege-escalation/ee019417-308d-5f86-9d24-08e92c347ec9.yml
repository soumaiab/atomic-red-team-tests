- requirements: []
  name: Soumaia ART Tests - Suspicious vbs file run from startup Folder
  description: "vbs files can be placed in and ran from the startup folder to maintain persistance. Upon execution, \"T1547.001 Hello, World VBS!\" will be displayed twice. \nAdditionally, the new files can be viewed in the \"$env:APPDATA\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\"\nfolder and will also run when the computer is restarted and the user logs in. (requires elevation)"
  tactic: privilege-escalation
  technique_id: T1547.001
  technique_name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
  executors:
  - cleanup:
    - Remove-Item "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\vbsstartup.vbs" -ErrorAction Ignore; Remove-Item "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\vbsstartup.vbs" -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - vbsstartup.vbs
    parsers: []
    command: Copy-Item "$.\vbsstartup.vbs" "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\vbsstartup.vbs"; Copy-Item "$.\vbsstartup.vbs" "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\vbsstartup.vbs"; cscript.exe "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\vbsstartup.vbs"; cscript.exe "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\vbsstartup.vbs"
  id: ee019417-308d-5f86-9d24-08e92c347ec9
