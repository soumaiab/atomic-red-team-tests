- requirements: []
  name: Soumaia ART Tests - MAZE Propagation Script
  description: "This test simulates MAZE ransomware's propogation script that searches through a list of computers, tests connectivity to them, and copies a binary file to the Windows\\Temp directory of each one. \nUpon successful execution, a specified binary file will attempt to be copied to each online machine, a list of the online machines, as well as a list of offline machines will be output to a specified location.\nReference: https://www.fireeye.com/blog/threat-research/2020/05/tactics-techniques-procedures-associated-with-maze-ransomware-incidents.html"
  tactic: command-and-control
  technique_id: T1105
  technique_name: Ingress Tool Transfer
  executors:
  - cleanup:
    - 'if (test-path "$env:TEMP\ART-ExternalPayloads\T1105CompletedHosts.txt"); {foreach ($machine in get-content -path "$env:TEMP\ART-ExternalPayloads\T1105CompletedHosts.txt"); {wmic /node: "$machine" process where name=''"regsvr32.exe"'' call terminate | out-null; Remove-Item -path "\\$machine\C$\Windows\Temp\T1105.exe" -force -erroraction silentlycontinue}}; Remove-Item -path "$env:TEMP\ART-ExternalPayloads\T1105OfflineHosts.txt" -erroraction silentlycontinue; Remove-item -path "$env:TEMP\ART-ExternalPayloads\T1105CompletedHosts.txt" -erroraction silentlycontinue'
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
