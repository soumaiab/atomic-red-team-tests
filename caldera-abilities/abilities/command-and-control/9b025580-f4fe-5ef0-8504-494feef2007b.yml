- id: 9b025580-f4fe-5ef0-8504-494feef2007b
  name: Soumaia ART Tests - Malicious User Agents - Powershell
  description: "This test simulates an infected host beaconing to command and control. Upon execution, no output will be displayed. \nUse an application such as Wireshark to record the session and observe user agent strings and responses.\n\nInspired by APTSimulator - https://github.com/NextronSystems/APTSimulator/blob/master/test-sets/command-and-control/malicious-user-agents.bat"
  tactic: command-and-control
  technique:
    attack_id: T1071.001
    name: 'Application Layer Protocol: Web Protocols'
  platforms:
    windows:
      psh:
        command: |-
          Invoke-WebRequest www.google.com -UserAgent "HttpBrowser/1.0" | out-null
          Invoke-WebRequest www.google.com -UserAgent "Wget/1.9+cvs-stable (Red Hat modified)" | out-null
          Invoke-WebRequest www.google.com -UserAgent "Opera/8.81 (Windows NT 6.0; U; en)" | out-null
          Invoke-WebRequest www.google.com -UserAgent "*<|>*" | out-null
