- id: 947fcfa8-37a0-5fc9-afc3-5433a3fe1af8
  name: Soumaia ART Tests - svchost writing a file to a UNC path
  description: 'svchost.exe writing a non-Microsoft Office file to a file with a UNC path.

    Upon successful execution, this will rename cmd.exe as svchost.exe and move it to `c:\`, then execute svchost.exe with output to a txt file. (requires elevation)'
  tactic: command-and-control
  technique:
    attack_id: T1105
    name: Ingress Tool Transfer
  platforms:
    windows:
      cmd:
        command: |-
          copy C:\Windows\System32\cmd.exe C:\svchost.exe
          C:\svchost.exe /c echo T1105 > \\localhost\c$\T1105.txt
        cleanup: |-
          del C:\T1105.txt >nul 2>&1
          del C:\\svchost.exe >nul 2>&1
