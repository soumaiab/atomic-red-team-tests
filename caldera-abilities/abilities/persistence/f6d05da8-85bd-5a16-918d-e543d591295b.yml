- requirements: []
  name: Soumaia ART Tests - Disable Windows Lock Workstation Feature
  description: 'Modify the registry of the currently logged in user using reg.exe via cmd console to disable the windows Lock workstation feature.

    See how ransomware abuses this technique- https://www.bleepingcomputer.com/news/security/in-dev-ransomware-forces-you-do-to-survey-before-unlocking-computer/ (requires elevation)'
  tactic: persistence
  technique_id: T1112
  technique_name: Modify Registry
  executors:
  - cleanup:
    - reg delete "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\System" /v DisableLockWorkstation /f >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\System" /v DisableLockWorkstation /t REG_DWORD /d 1 /f
  id: f6d05da8-85bd-5a16-918d-e543d591295b
