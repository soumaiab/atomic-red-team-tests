- id: b29d601e-3f0a-5a03-97a9-879c8077d096
  name: Soumaia ART Tests - Requires the BitLocker PIN for Pre-boot authentication
  description: Requires the BitLocker PIN for Pre-boot authentication (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UseAdvancedStartup /t REG_DWORD /d 1 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UseAdvancedStartup /f
