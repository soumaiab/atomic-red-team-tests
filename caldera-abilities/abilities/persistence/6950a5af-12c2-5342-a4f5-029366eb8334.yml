- id: 6950a5af-12c2-5342-a4f5-029366eb8334
  name: Soumaia ART Tests - Modify EnableNonTPM Registry entry
  description: Allow Bitlocker without TPM for Bitlocker tool (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v EnableNonTPM /t REG_DWORD /d 1 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v EnableNonTPM /f
