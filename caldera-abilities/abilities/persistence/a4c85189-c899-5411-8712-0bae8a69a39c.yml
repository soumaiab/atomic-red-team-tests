- id: a4c85189-c899-5411-8712-0bae8a69a39c
  name: Soumaia ART Tests - Disable Windows CMD application
  description: 'Modify the registry of the currently logged in user using reg.exe via cmd console to disable the windows CMD application.

    See example how Agent Tesla malware abuses this technique: https://any.run/report/ea4ea08407d4ee72e009103a3b77e5a09412b722fdef67315ea63f22011152af/a866d7b1-c236-4f26-a391-5ae32213dfc4#registry (requires elevation)'
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      psh:
        command: |-
          New-ItemProperty -Path "HKCU:\Software\Policies\Microsoft\Windows\System" -Name DisableCMD -Value 1
        cleanup: |-
          Remove-ItemProperty -Path "HKCU:\Software\Policies\Microsoft\Windows\System" -Name DisableCMD -ErrorAction Ignore
