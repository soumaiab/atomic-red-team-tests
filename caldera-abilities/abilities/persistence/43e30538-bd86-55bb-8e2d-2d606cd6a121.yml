- id: 43e30538-bd86-55bb-8e2d-2d606cd6a121
  name: Soumaia ART Tests - Disable Windows Remote Desktop Protocol
  description: Modify the registry of the machine to disable remote desktop protocol. (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 1 /f
        cleanup: |-
          reg delete "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /f
