- id: 367c70e9-6386-5762-9a55-fad4d50511e5
  name: Soumaia ART Tests - Enabling Restricted Admin Mode via Command_Prompt
  description: 'Enabling Restricted Admin Mode via Command_Prompt,enables an attacker to perform a pass-the-hash attack using RDP.


    See [Passing the Hash with Remote Desktop](https://www.kali.org/blog/passing-hash-remote-desktop/) (requires elevation)'
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "hklm\system\currentcontrolset\control\lsa" /f /v DisableRestrictedAdmin /t REG_DWORD /d 0
        cleanup: |-
          reg delete "hklm\system\currentcontrolset\control\lsa" /f /v DisableRestrictedAdmin >nul 2>&1
