- id: 1c992325-fb91-5c77-b87a-f0d835510f37
  name: Soumaia ART Tests - Disable Win Defender Notification
  description: Disable Win Defender Notification. Redline is using this to disable this win defender feature. (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\Notifications" /v "DisableNotifications" /t REG_DWORD /d 1 /f
        cleanup: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\Notifications" /v "DisableNotifications" /t REG_DWORD /d 0 /f
