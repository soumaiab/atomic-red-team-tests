- id: 480b31e7-b761-5785-b6bd-7246e4d882b9
  name: Soumaia ART Tests - Modify UseTPM Registry entry
  description: Use Trusted Platform Module (TPM) for Bitlocker tool (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UseTPM /t REG_DWORD /d 2 /f
        cleanup: |-
          reg delete ""HKLM\SOFTWARE\Policies\Microsoft\FVE"" /v UseTPM /f
