- requirements: []
  name: Soumaia ART Tests - Skeleton Key via Mimikatz
  description: 'Injects a Skeleton Key into LSASS on a domain controller using Mimikatz. Once injected, any domain

    user account can be authenticated using the password ''mimikatz'' until the domain controller is rebooted.


    This test must be run on an isolated domain controller and must not be performed on a production DC.

    Cleanup forces a reboot of the domain controller to evict the skeleton key from LSASS memory. (requires elevation)'
  tactic: persistence
  technique_id: T1556.001
  technique_name: 'Modify Authentication Process: Domain Controller Authentication'
  executors:
  - cleanup:
    - Remove-Item -Path "C:\ExternalPayloads\Mimikatz" -Recurse -ErrorAction Ignore; Restart-Computer -Force
