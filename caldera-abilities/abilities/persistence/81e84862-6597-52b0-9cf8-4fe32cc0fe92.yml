- requirements: []
  name: Soumaia ART Tests - Outlook Rules - Enumerate Existing Rules via PowerShell COM Object
  description: 'Enumerates all Outlook rules configured on the local profile using the

    PowerShell COM object. Simulates the discovery phase where an adversary

    audits existing rules before implanting their own, or where a threat actor

    tool such as Ruler lists rules to understand the environment. This

    enumeration should itself generate telemetry - use it to validate that

    your monitoring catches PowerShell spawning Outlook COM for recon purposes.

    NOTE: This test MUST be run from a non-elevated (standard user) PowerShell

    session. Outlook COM fails with 0x80080005 when invoked as Administrator.'
  tactic: persistence
  technique_id: T1137.005
  technique_name: 'Office Application Startup: Outlook Rules'
  executors:
  - cleanup:
    - Write-Host "[*] No cleanup required for enumeration test."
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: 'powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator"); if ($isAdmin) { Write-Host "[-] This test must be run from a non-elevated PowerShell session."; Write-Host "    Outlook COM fails with 0x80080005 when run as Administrator."; exit 1 }; $outlook = New-Object -ComObject Outlook.Application; $rules   = $outlook.GetNamespace("MAPI").DefaultStore.GetRules(); Write-Host "`n[*] Enumerating Outlook rules on local profile..."; Write-Host "    Total rules found: $($rules.Count)`n"; for ($i = 1; $i -le $rules.Count; $i++) { $r = $rules.Item($i); Write-Host "  Rule $i : Name=''$($r.Name)'' | Enabled=$($r.Enabled)" }; if ($rules.Count -eq 0) { Write-Host "  (No rules configured)" }'
  id: 81e84862-6597-52b0-9cf8-4fe32cc0fe92
