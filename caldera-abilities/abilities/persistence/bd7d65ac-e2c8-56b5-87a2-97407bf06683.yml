- id: bd7d65ac-e2c8-56b5-87a2-97407bf06683
  name: Soumaia ART Tests - Disable Windows OS Auto Update
  description: Disable Auto Update Windows OS feature. Redline is using this as part of its defense evasion. (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v "NoAutoUpdate" /t REG_DWORD /d 1 /f
        cleanup: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v "NoAutoUpdate" /t REG_DWORD /d 0 /f
