- id: 04bc385f-50e5-535e-b3d8-bcf368e59cc0
  name: Soumaia ART Tests - Change Powershell Execution Policy to Bypass
  description: 'Attackers need to change the powershell execution policy in order to run their malicious powershell scripts.

    They can either specify it during the execution of the powershell script or change the registry value for it.'
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      psh:
        command: |-
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope LocalMachine
        cleanup: |-
          try { Set-ExecutionPolicy -ExecutionPolicy Default -Scope LocalMachine -Force } catch {}
