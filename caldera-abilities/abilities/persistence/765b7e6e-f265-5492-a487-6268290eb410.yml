- id: 765b7e6e-f265-5492-a487-6268290eb410
  name: Soumaia ART Tests - Abusing MyComputer Disk Fragmentation Path for Persistence
  description: Replacing the registry settings with custom executable will end up with the replacement programs being executed at the time OS will decide to kick off the respective activity (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\DefragPath" /t REG_EXPAND_SZ /d "%systemroot%\system32\notepad.exe" /f
        cleanup: |-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\DefragPath" /t REG_EXPAND_SZ /d "%systemroot%\system32\dfrgui.exe" /f
