- id: 488226de-cd41-5c53-9586-945b8f72654b
  name: Soumaia ART Tests - Disable Remote Desktop Anti-Alias Setting Through Registry
  description: A modification registry to disable RDP anti-alias settings. This technique was seen in DarkGate malware as part of its installation
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v "DisableRemoteDesktopAntiAlias" /t REG_DWORD /d 1 /f
        cleanup: |-
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v "DisableRemoteDesktopAntiAlias" /t REG_DWORD /d 0 /f
