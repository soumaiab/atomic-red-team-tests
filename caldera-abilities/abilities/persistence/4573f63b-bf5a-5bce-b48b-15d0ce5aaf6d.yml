- requirements: []
  name: Soumaia ART Tests - Modify RDP-Tcp Initial Program Registry Entry
  description: 'If the fInheritInitialProgram value is set to 1, the exe indicated in the InitialProgram value is automatically started on RDP connection.

    Once the test commands are run, notepad will execute automatically on new RDP connection (requires elevation)'
  tactic: persistence
  technique_id: T1112
  technique_name: Modify Registry
  executors:
  - cleanup:
    - reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v InitialProgram /t REG_SZ /d "" /f
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fInheritInitialProgram /t REG_DWORD /d 1 /f & reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v InitialProgram /t REG_SZ /d "C:\Windows\System32\notepad.exe" /f
  id: 4573f63b-bf5a-5bce-b48b-15d0ce5aaf6d
