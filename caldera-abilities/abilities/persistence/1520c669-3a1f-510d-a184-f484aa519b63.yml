- id: 1520c669-3a1f-510d-a184-f484aa519b63
  name: Soumaia ART Tests - Modify UseTPMKeyPIN Registry entry
  description: Allow startup key and PIN with TPM for Bitlocker tool (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UseTPMKeyPIN /t REG_DWORD /d 2 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UseTPMKeyPIN /f
