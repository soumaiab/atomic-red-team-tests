- id: 0e442120-c7a9-5cd0-8ae4-cdfd023dca8c
  name: Soumaia ART Tests - Modify EnableBDEWithNoTPM Registry entry
  description: Allow BitLocker without a compatible TPM (requires a password) (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v EnableBDEWithNoTPM /t REG_DWORD /d 1 /f
        cleanup: |-
          reg delete ""HKLM\SOFTWARE\Policies\Microsoft\FVE"" /v EnableBDEWithNoTPM /f
