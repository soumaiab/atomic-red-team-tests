- requirements: []
  name: Soumaia ART Tests - Modify Registry of Current User Profile - cmd
  description: 'Modify the registry of the currently logged in user using reg.exe via cmd console. Upon execution, the message "The operation completed successfully."

    will be displayed. Additionally, open Registry Editor to view the new entry in HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced.'
  tactic: persistence
  technique_id: T1112
  technique_name: Modify Registry
  executors:
  - cleanup:
    - reg delete HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced /v HideFileExt /f >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced /t REG_DWORD /v HideFileExt /d 1 /f
  id: 617468a5-64fb-560f-a815-ea5963280799
