- requirements: []
  name: Soumaia ART Tests - Windows Add Registry Value to Load Service in Safe Mode without Network
  description: 'Modify the registry to allow a driver, service, to persist in Safe Mode.

    see https://redcanary.com/blog/tracking-driver-inventory-to-expose-rootkits/ and https://blog.didierstevens.com/2007/03/26/playing-with-safe-mode/ for further details.

    Adding a subkey to Minimal with the name of your service and a default value set to Service, makes that your service will be started when you boot into Safe Mode without networking. The same applies for the Network subkey. (requires elevation)'
  tactic: persistence
  technique_id: T1112
  technique_name: Modify Registry
  executors:
  - cleanup:
    - reg delete "HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\Minimal\AtomicSafeMode" /f
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: REG ADD "HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\Minimal\AtomicSafeMode" /VE /T REG_SZ /F /D "Service"
  id: b656a042-5b5b-590a-a649-55481f9fca28
