- requirements: []
  name: Soumaia ART Tests - Outlook Rule - Create Rule with Obfuscated Blank Name (MAPI Evasion)
  description: 'Creates an Outlook rule with a zero-width space as its display name,

    making it appear blank and invisible in the standard Outlook Rules UI.

    Simulates the hidden inbox rule technique documented by Damian Pfammatter

    (2018) and referenced in MITRE ATT&CK T1137.005 - adversaries use MAPI

    editors or Ruler to blank PR_RULE_MSG_NAME so the rule does not appear

    during casual rule auditing. Tests whether monitoring catches rules that

    are invisible in the Outlook GUI but detectable via MFCMapi or

    Get-InboxRule on Exchange. Uses PlaySound action as RunApplication

    cannot be created programmatically per Microsoft''s Rules object model.

    NOTE: This test MUST be run from a non-elevated (standard user) PowerShell

    session. Outlook COM fails with 0x80080005 when invoked as Administrator.

    NOTE: Script is written to a temp file before execution to prevent the

    ART executor''s quote-wrapping from mangling the zero-width space bytes.'
  tactic: persistence
  technique_id: T1137.005
  technique_name: 'Office Application Startup: Outlook Rules'
  executors:
  - cleanup:
    - $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator"); if ($isAdmin) { Write-Host "[-] Cleanup must be run from a non-elevated PowerShell session. Skipping."; exit 1 }; $tmpScript = "$env:TEMP\T1137005_hidden_rule_cleanup.ps1"; $lines = @( '$hiddenName = [System.Text.Encoding]::Unicode.GetString([byte[]](0x0B, 0x20))', '$outlook    = New-Object -ComObject Outlook.Application', '$namespace  = $outlook.GetNamespace("MAPI")', '$rules      = $namespace.DefaultStore.GetRules()', '$removed    = $false', 'for ($i = $rules.Count; $i -ge 1; $i--) {', '    if ($rules.Item($i).Name -eq $hiddenName) {', '        $rules.Remove($rules.Item($i).Name)', '        $removed = $true', '    }', '}', 'if ($removed) {', '    $rules.Save()', '    Write-Host "[+] Hidden rule(s) removed."', '} else {', '    Write-Host "[-] Hidden rule not found - may have already been removed."', '}' ); $lines -join "`n" | Set-Content -Path $tmpScript -Encoding UTF8; powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tmpScript; Remove-Item $tmpScript -ErrorAction SilentlyContinue
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAQwA6AFwAVwBpAG4AZABvAHcAcwBcAE0AZQBkAGkAYQBcAG4AbwB0AGkAZgB5AC4AdwBhAHYAIgApACAAewAgAGUAeABpAHQAIAAwACAAfQAgAGUAbABzAGUAIAB7ACAAZQB4AGkAdAAgADEAIAB9AAoA; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator"); if ($isAdmin) { Write-Host "[-] This test must be run from a non-elevated PowerShell session."; Write-Host "    Outlook COM fails with 0x80080005 when run as Administrator."; exit 1 }; $tmpScript = "$env:TEMP\T1137005_hidden_rule_create.ps1"; $lines = @( '$hiddenName = [System.Text.Encoding]::Unicode.GetString([byte[]](0x0B, 0x20))', '$outlook   = New-Object -ComObject Outlook.Application', '$namespace = $outlook.GetNamespace("MAPI")', '$rules     = $namespace.DefaultStore.GetRules()', '$rule      = $rules.Create($hiddenName, 0)', '$cond = $rule.Conditions.Subject', '$cond.Enabled = $true', '$cond.Text    = @("atomic-rt-hidden")', '$action          = $rule.Actions.PlaySound', '$action.Enabled  = $true', '$action.FilePath = "C:\Windows\Media\notify.wav"', '$rule.Enabled = $true', '$rules.Save()', 'Write-Host "[+] Hidden rule created with zero-width space name."', 'Write-Host "[*] Open Outlook via File -> Manage Rules and Alerts - rule name will appear blank."', 'Write-Host "[*] Verify rule exists via PowerShell COM enumeration (Test 4) or Get-InboxRule in Exchange."' ); $lines -join "`n" | Set-Content -Path $tmpScript -Encoding UTF8; powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tmpScript; Remove-Item $tmpScript -ErrorAction SilentlyContinue
  id: 492cd311-5867-5d88-8ad1-59c1522a81aa
