- id: 514a2f5d-e272-5ce3-96d9-9420240a0972
  name: Soumaia ART Tests - Set-Up Proxy Server
  description: A modification registry to setup proxy server. This technique was seen in DarkGate malware as part of its installation.
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v ProxyServer /t REG_SZ /d "proxy.atomic-test.com:8080" /f
        cleanup: |-
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v ProxyServer /f
