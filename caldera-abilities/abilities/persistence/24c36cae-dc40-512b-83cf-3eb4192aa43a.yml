- id: 24c36cae-dc40-512b-83cf-3eb4192aa43a
  name: Soumaia ART Tests - Disable Remote Desktop Security Settings Through Registry
  description: A modification registry to disable RDP security settings. This technique was seen in DarkGate malware as part of its installation
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v "DisableSecuritySettings" /t REG_DWORD /d 1 /f
        cleanup: |-
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v "DisableSecuritySettings" /t REG_DWORD /d 0 /f
