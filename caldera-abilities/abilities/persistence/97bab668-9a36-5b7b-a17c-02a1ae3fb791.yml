- id: 97bab668-9a36-5b7b-a17c-02a1ae3fb791
  name: Soumaia ART Tests - Activate Windows NoControlPanel Group Policy Feature
  description: "Modify the registry of the currently logged in user using reg.exe via cmd console to Disable Control Panel Group Policy. \nTake note that some Group Policy changes might require a restart to take effect.\nSee how Trojan abuses this technique- https://www.sophos.com/de-de/threat-center/threat-analyses/viruses-and-spyware/Troj~Krotten-N/detailed-analysis (requires elevation)"
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" /v NoControlPanel /t REG_DWORD /d 1 /f
        cleanup: |-
          reg delete "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" /v NoControlPanel /f >nul 2>&1
