- id: df0aee3e-ed1a-5dee-8f23-498b49565613
  name: Soumaia ART Tests - Windows Auto Update Option to Notify before download
  description: Windows Auto Update Option to Notify before download. Redline is using this as part of its defense evasion. (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v "AUOptions" /t REG_DWORD /d 2 /f
        cleanup: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" /v "AUOptions" /t REG_DWORD /d 3 /f
