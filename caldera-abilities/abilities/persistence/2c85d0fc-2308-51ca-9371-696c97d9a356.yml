- id: 2c85d0fc-2308-51ca-9371-696c97d9a356
  name: Soumaia ART Tests - Create a new Windows admin user
  description: Creates a new admin user in a command prompt. (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1136.001
    name: 'Create Account: Local Account'
  platforms:
    windows:
      cmd:
        command: |-
          net user /add "T1136.001_Admin" "T1136_pass"
          net localgroup administrators "T1136.001_Admin" /add
        cleanup: |-
          net user /del "T1136.001_Admin" >nul 2>&1
