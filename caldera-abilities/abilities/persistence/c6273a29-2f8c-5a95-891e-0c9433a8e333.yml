- requirements: []
  name: Soumaia ART Tests - Outlook Rule - Subject Trigger with DeletePermanently Action via COM Object
  description: 'Creates a malicious Outlook rule via the COM object that permanently deletes

    emails when an email with a specific subject keyword arrives. Simulates

    adversary persistence via Outlook Rules (T1137.005). Uses DeletePermanently

    action as it does not require a resolved Exchange folder unlike MoveToFolder.

    NOTE: olRuleActionStartApplication cannot be created programmatically per

    Microsoft''s Rules object model - DeletePermanently is used as the supported

    equivalent that generates the same rule-creation artefact.

    NOTE: This test MUST be run from a non-elevated (standard user) PowerShell

    session. Outlook COM fails with 0x80080005 when invoked as Administrator.'
  tactic: persistence
  technique_id: T1137.005
  technique_name: 'Office Application Startup: Outlook Rules'
  executors:
  - cleanup:
    - $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator"); if ($isAdmin) { Write-Host "[-] Cleanup must be run from a non-elevated PowerShell session. Skipping."; exit 1 }; $outlook   = New-Object -ComObject Outlook.Application; $namespace = $outlook.GetNamespace("MAPI"); $rules     = $namespace.DefaultStore.GetRules(); $removed   = $false; for ($i = $rules.Count; $i -ge 1; $i--) { if ($rules.Item($i).Name -eq "AtomicTest_T1137005_SubjectTrigger") { $rules.Remove($rules.Item($i).Name); $removed = $true } }; if ($removed) { $rules.Save(); Write-Host "[+] All instances of rule 'AtomicTest_T1137005_SubjectTrigger' removed." } else { Write-Host "[*] Rule 'AtomicTest_T1137005_SubjectTrigger' not found - already removed." }
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator"); if ($isAdmin) { Write-Host "[-] This test must be run from a non-elevated PowerShell session."; Write-Host "    Outlook COM fails with 0x80080005 when run as Administrator."; exit 1 }; $outlook   = New-Object -ComObject Outlook.Application; $namespace = $outlook.GetNamespace("MAPI"); $rules     = $namespace.DefaultStore.GetRules(); $rule      = $rules.Create("AtomicTest_T1137005_SubjectTrigger", 0); $cond = $rule.Conditions.Subject; $cond.Enabled = $true; $cond.Text    = @("atomic-rt-trigger"); $action         = $rule.Actions.DeletePermanently; $action.Enabled = $true; $rule.Enabled = $true; $rules.Save(); Write-Host "[+] Rule 'AtomicTest_T1137005_SubjectTrigger' created. Emails with subject 'atomic-rt-trigger' will be permanently deleted."
  id: c6273a29-2f8c-5a95-891e-0c9433a8e333
