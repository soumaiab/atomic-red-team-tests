- id: c3e52a22-bc61-53dd-859c-6eb61dadb89c
  name: Soumaia ART Tests - Windows HideSCAHealth Group Policy Feature
  description: "Modify the registry of the currently logged in user using reg.exe via cmd console to remove security and maintenance icon Group Policy. \nTake note that some Group Policy changes might require a restart to take effect.\nSee how ransomware abuses this technique- https://www.virustotal.com/gui/file/2d7855bf6470aa323edf2949b54ce2a04d9e38770f1322c3d0420c2303178d91/details (requires elevation)"
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" /v HideSCAHealth /t REG_DWORD /d 1 /f
        cleanup: |-
          reg delete "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" /v HideSCAHealth /f >nul 2>&1
