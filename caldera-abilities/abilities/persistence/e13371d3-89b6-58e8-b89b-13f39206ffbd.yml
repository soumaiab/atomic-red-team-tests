- id: e13371d3-89b6-58e8-b89b-13f39206ffbd
  name: Soumaia ART Tests - Modify UseTPMKey Registry entry
  description: Allow startup key with TPM for Bitlocker tool (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UseTPMKey /t REG_DWORD /d 2 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UseTPMKey /f
