- id: 4a87a460-e5fb-5722-a297-9326f4c3f9d6
  name: Soumaia ART Tests - Suppress Win Defender Notifications
  description: 'Modify the registry of the currently logged in user using reg.exe via cmd console to suppress the windows defender notification.

    See how azorult malware abuses this technique- https://app.any.run/tasks/a6f2ffe2-e6e2-4396-ae2e-04ea0143f2d8/ (requires elevation)'
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration" /v Notification_Suppress /t REG_DWORD /d 1 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration" /v Notification_Suppress /f >nul 2>&1
