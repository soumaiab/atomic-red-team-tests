- id: 797bf940-dfad-539c-b75b-52aa825d8556
  name: Soumaia ART Tests - Enable Proxy Settings
  description: A modification registry to enable proxy settings. This technique was seen in DarkGate malware as part of its installation.
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v ProxyEnable /t REG_DWORD /d 1 /f
        cleanup: |-
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v ProxyEnable /t REG_DWORD /d 0 /f
