- id: 3e717790-21fe-5d8b-bb2f-d7fdf5f6335e
  name: Soumaia ART Tests - Google Chrome Load Unpacked Extension With Command Line
  description: 'This test loads an unpacked extension in Google Chrome with the `--load-extension` parameter. This technique was previously used by the Grandoreiro malware to load a malicious extension that would capture the browsing history, steal cookies and other user information. Other malwares also leverage this technique to hijack searches, steal passwords, inject ads, and more.


    References:

    https://attack.mitre.org/techniques/T1176/

    https://securityintelligence.com/posts/grandoreiro-malware-now-targeting-banks-in-spain/ (requires elevation)'
  tactic: persistence
  technique:
    attack_id: T1176
    name: Browser Extensions
  platforms:
    windows:
      psh:
        command: |-
          # Chromium
          $chromium =  "https://commondatastorage.googleapis.com/chromium-browser-snapshots/Win_x64/1153778/chrome-win.zip"

          # uBlock Origin Lite to test side-loading
          $extension = "https://github.com/uBlockOrigin/uBOL-home/releases/download/uBOLite_2024.11.25.1376/uBOLite_2024.11.25.1376.chromium.mv3.zip"

          Set-Location "$env:TEMP"

          Set-Variable ProgressPreference SilentlyContinue
          Invoke-WebRequest -URI $chromium -OutFile "$env:TEMP\chrome.zip"
          Invoke-WebRequest -URI $extension -OutFile "$env:TEMP\extension.zip"


          Expand-Archive chrome.zip -DestinationPath "$env:TEMP" -Force
          Expand-Archive extension.zip -Force

          Start-Process .\chrome-win\chrome.exe --load-extension="$env:TEMP\extension\" -PassThru
        cleanup: |-
          Set-Location "$env:TEMP"
          Stop-Process -Name chrome -Force
          Remove-Item .\chrome.zip, .\chrome-win, .\extension, .\extension.zip -Recurse -Force
          Set-Variable ProgressPreference Continue
