- id: b8ae7418-801d-5ccb-b064-8656c882f4c2
  name: Soumaia ART Tests - Modify UsePIN Registry entry
  description: Allow startup PIN with TPM for Bitlocker tool (requires elevation)
  tactic: persistence
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UsePIN /t REG_DWORD /d 2 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\FVE" /v UsePIN /f
