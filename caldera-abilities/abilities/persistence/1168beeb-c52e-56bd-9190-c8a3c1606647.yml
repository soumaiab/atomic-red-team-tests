- id: 1168beeb-c52e-56bd-9190-c8a3c1606647
  name: Soumaia ART Tests - Create a new user in PowerShell
  description: 'Creates a new user in PowerShell. Upon execution, details about the new account will be displayed in the powershell session. To verify the

    new account, run "net user" in powershell or CMD and observe that there is a new user named "T1136.001_PowerShell" (requires elevation)'
  tactic: persistence
  technique:
    attack_id: T1136.001
    name: 'Create Account: Local Account'
  platforms:
    windows:
      psh:
        command: |-
          New-LocalUser -Name "T1136.001_PowerShell" -NoPassword
        cleanup: |-
          Remove-LocalUser -Name "T1136.001_PowerShell" -ErrorAction Ignore
