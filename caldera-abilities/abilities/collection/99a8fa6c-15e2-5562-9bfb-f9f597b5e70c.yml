- id: 99a8fa6c-15e2-5562-9bfb-f9f597b5e70c
  name: Soumaia ART Tests - Stage data from Discovery.bat
  description: 'Utilize powershell to download discovery.bat and save to a local file. This emulates an attacker downloading data collection tools onto the host. Upon execution,

    verify that the file is saved in the temp directory.'
  tactic: collection
  technique:
    attack_id: T1074.001
    name: 'Data Staged: Local Data Staging'
  platforms:
    windows:
      psh:
        command: |-
          Invoke-WebRequest "https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1074.001/src/Discovery.bat" -OutFile $env:TEMP\discovery.bat
        cleanup: |-
          Remove-Item -Force $env:TEMP\discovery.bat -ErrorAction Ignore
