- requirements: []
  name: Soumaia ART Tests - Compress Data for Exfiltration With PowerShell
  description: 'An adversary may compress data (e.g., sensitive documents) that is collected prior to exfiltration.

    When the test completes you should find the files from the $env:USERPROFILE directory compressed in a file called T1560-data-ps.zip in the $env:USERPROFILE directory'
  tactic: collection
  technique_id: T1560
  technique_name: Archive Collected Data
  executors:
  - cleanup:
    - Remove-Item -path $env:USERPROFILE\T1560-data-ps.zip -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: dir $env:USERPROFILE -Recurse | Compress-Archive -DestinationPath $env:USERPROFILE\T1560-data-ps.zip
  id: 7252ca79-9762-54f7-8a03-2f59b37e7d24
