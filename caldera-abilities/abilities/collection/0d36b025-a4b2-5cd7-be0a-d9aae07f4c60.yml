- id: 0d36b025-a4b2-5cd7-be0a-d9aae07f4c60
  name: Soumaia ART Tests - Recon information for export with Command Prompt
  description: 'collect information for exfiltration. Upon execution, check the users temp directory (%temp%) for files T1119_*.txt

    to see what was collected.'
  tactic: collection
  technique:
    attack_id: T1119
    name: Automated Collection
  platforms:
    windows:
      cmd:
        command: |-
          sc query type=service > %TEMP%\T1119_1.txt
          doskey /history > %TEMP%\T1119_2.txt
          wmic process list > %TEMP%\T1119_3.txt
          tree C:\AtomicRedTeam\atomics > %TEMP%\T1119_4.txt
        cleanup: |-
          del %TEMP%\T1119_1.txt >nul 2>&1
          del %TEMP%\T1119_2.txt >nul 2>&1
          del %TEMP%\T1119_3.txt >nul 2>&1
          del %TEMP%\T1119_4.txt >nul 2>&1
