- requirements: []
  name: Soumaia ART Tests - Windows Recall Feature Enabled - DisableAIDataAnalysis Value Deleted
  description: "Detects the enabling of the Windows Recall feature via registry manipulation. Windows Recall can be enabled by deleting the existing \"DisableAIDataAnalysis\" registry value. Adversaries may enable Windows Recall as part of post-exploitation discovery and collection activities. This rule assumes that Recall is already explicitly disabled on the host, and subsequently enabled by the adversary. \n- https://learn.microsoft.com/en-us/windows/client-management/manage-recall\n- https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis (requires elevation)"
  tactic: collection
  technique_id: T1113
  technique_name: Screen Capture
  executors:
  - cleanup:
    - reg add "HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI" /v DisableAIDataAnalysis /t REG_DWORD /d 1 /f
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: reg add "HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI" /v DisableAIDataAnalysis /t REG_DWORD /d 0 /f; reg delete "HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI" /v DisableAIDataAnalysis /f
  id: d6d09aa2-bb9d-50d4-ac69-600b7b4c8ee7
