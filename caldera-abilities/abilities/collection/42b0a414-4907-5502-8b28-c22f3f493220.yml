- requirements: []
  name: Soumaia ART Tests - Automated Collection Command Prompt
  description: 'Automated Collection. Upon execution, check the users temp directory (%temp%) for the folder T1119_command_prompt_collection

    to see what was collected.'
  tactic: collection
  technique_id: T1119
  technique_name: Automated Collection
  executors:
  - cleanup:
    - del %temp%\T1119_command_prompt_collection /F /Q >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: 'mkdir %temp%\T1119_command_prompt_collection >nul 2>&1 & dir c: /b /s .docx | findstr /e .docx & for /R c:\ %f in (*.docx) do copy /Y %f %temp%\T1119_command_prompt_collection'
  id: 42b0a414-4907-5502-8b28-c22f3f493220
