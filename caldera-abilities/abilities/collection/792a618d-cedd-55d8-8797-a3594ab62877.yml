- id: 792a618d-cedd-55d8-8797-a3594ab62877
  name: Soumaia ART Tests - Compress Data for Exfiltration With Rar
  description: 'An adversary may compress data (e.g., sensitive documents) that is collected prior to exfiltration.

    When the test completes you should find the txt files from the %USERPROFILE% directory compressed in a file called T1560.001-data.rar in the %USERPROFILE% directory'
  tactic: collection
  technique:
    attack_id: T1560.001
    name: 'Archive Collected Data: Archive via Utility'
  platforms:
    windows:
      cmd:
        command: |-
          cmd /c "if not exist ""%programfiles%/WinRAR/Rar.exe"" (exit /b 1)"
          if not "%ERRORLEVEL%"=="0" (
              cmd /c "echo Downloading Winrar installer & bitsadmin /transfer myDownloadJob /download /priority normal ""https://www.win-rar.com/fileadmin/winrar-versions/winrar/th/winrar-x64-580.exe"" %TEMP%\winrar.exe & %TEMP%\winrar.exe /S"
          )
          "%programfiles%/WinRAR/Rar.exe" a -r %USERPROFILE%\T1560.001-data.rar %USERPROFILE%\*.txt
        cleanup: |-
          del /f /q /s %USERPROFILE%\T1560.001-data.rar >nul 2>&1
