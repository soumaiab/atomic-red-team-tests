- id: ebc1cf4c-39fc-522e-9e6e-80add4875d84
  name: Soumaia ART Tests - ESXi - Remove Syslog remote IP
  description: An adversary may edit the syslog config to remove the loghost in order to prevent or redirect logs being received by SIEM. (requires elevation)
  tactic: collection
  technique:
    attack_id: T1560.001
    name: 'Archive Collected Data: Archive via Utility'
  platforms:
    windows:
      psh:
        command: "powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXABwAGwAaQBuAGsALgBlAHgAZQAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA\nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand \n}\n# Extract line with IP address from the syslog configuration output\n$env:TEMP\\ART-ExternalPayloads\\plink.exe -ssh atomic.local -l root -pw n/a -m .\\esxi_get_loghost.txt | findstr /r \"[0-9]*\\.[0-9]*\\.[0-9]*\\.\" > c:\\temp\\loghost.txt\n\n# Replace the IP with \"0\"\n$env:TEMP\\ART-ExternalPayloads\\plink.exe -ssh atomic.local -l root -pw n/a -m .\\esxi_remove_loghost.txt\n\n# Extract the IP from the line extracted from findstr\n$inputFilePath = \"c:\\temp\\loghost.txt\"\n$outputFilePath = \"c:\\temp\\loghost_ip.txt\"\n\n$fileContent = Get-Content -Path $inputFilePath -Raw\n\nif ([string]::IsNullOrWhiteSpace($fileContent)) {\n    Write-Host \"The content is $fileContent\"\n    Write-Host \"The file is empty\"\n} else {\n    # Use a regular expression to extract IP addresses\n    $ipAddresses = [regex]::Matches($fileContent, '(udp|tcp):\\/\\/[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}.*').Value\n    \n    $output = \"esxcli system syslog config set --loghost=\" + $ipAddresses\n\n    $output | Out-File -FilePath $outputFilePath -Encoding ascii\n    \n    Write-Host \"IP addresses extracted and saved to $outputFilePath\"\n}"
        cleanup: |-
          # Re-add the initially extracted IP
          $env:TEMP\ART-ExternalPayloads\plink.exe -ssh atomic.local -l root -pw n/a -m c:\temp\loghost_ip.txt

          rm c:\temp\loghost_ip.txt
          rm c:\temp\loghost.txt
        payloads:
        - esxi_get_loghost.txt
        - esxi_remove_loghost.txt
