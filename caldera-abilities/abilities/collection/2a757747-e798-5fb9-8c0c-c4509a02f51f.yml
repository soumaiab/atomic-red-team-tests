- id: 2a757747-e798-5fb9-8c0c-c4509a02f51f
  name: Soumaia ART Tests - Recon information for export with PowerShell
  description: 'collect information for exfiltration. Upon execution, check the users temp directory (%temp%) for files T1119_*.txt

    to see what was collected.'
  tactic: collection
  technique:
    attack_id: T1119
    name: Automated Collection
  platforms:
    windows:
      psh:
        command: |-
          Get-Service > $env:TEMP\T1119_1.txt
          Get-ChildItem Env: > $env:TEMP\T1119_2.txt
          Get-Process > $env:TEMP\T1119_3.txt
        cleanup: |-
          Remove-Item $env:TEMP\T1119_1.txt -ErrorAction Ignore
          Remove-Item $env:TEMP\T1119_2.txt -ErrorAction Ignore
          Remove-Item $env:TEMP\T1119_3.txt -ErrorAction Ignore
