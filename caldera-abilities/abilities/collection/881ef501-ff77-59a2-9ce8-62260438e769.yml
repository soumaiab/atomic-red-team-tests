- requirements: []
  name: Soumaia ART Tests - Search files of interest and save them to a single zip file (Windows)
  description: This test searches for files of certain extensions and saves them to a single zip file prior to extraction.
  tactic: collection
  technique_id: T1005
  technique_name: Data from Local System
  executors:
  - cleanup:
    - Remove-Item -Path  $outputZip\data.zip -Force
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: '$startingDirectory = "C:\Users"; $outputZip = "$env:TEMP\ART-ExternalPayloads\T1005"; $fileExtensionsString = ".doc, .docx, .txt"; $fileExtensions = $fileExtensionsString -split ", "; New-Item -Type Directory $outputZip -ErrorAction Ignore -Force | Out-Null; Function Search-Files { param ( [string]$directory ); $files = Get-ChildItem -Path $directory -File -Recurse | Where-Object { $fileExtensions -contains $_.Extension.ToLower() }; return $files }; $foundFiles = Search-Files -directory $startingDirectory; if ($foundFiles.Count -gt 0) { $foundFilePaths = $foundFiles.FullName; Compress-Archive -Path $foundFilePaths -DestinationPath "$outputZip\data.zip"; Write-Host "Zip file created: $outputZip\data.zip" } else { Write-Host "No files found with the specified extensions." }'
  id: 881ef501-ff77-59a2-9ce8-62260438e769
