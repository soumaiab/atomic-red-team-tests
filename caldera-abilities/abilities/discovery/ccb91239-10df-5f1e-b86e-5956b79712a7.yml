- id: ccb91239-10df-5f1e-b86e-5956b79712a7
  name: Soumaia ART Tests - Device Driver Discovery
  description: "Displays a list of installed device drivers on the local computer and their properties. Threat actors use this command to enumerate the existing drivers on the computer. \nParameters: \n/v /fo list - Displays verbose output in a list format - the /v parameter is not valid for signed drivers\n/si /fo list - Provides information about signed drivers and outputs it in a list format"
  tactic: discovery
  technique:
    attack_id: T1652
    name: Device Driver Discovery
  platforms:
    windows:
      psh:
        command: |-
          driverquery /v /fo list
          driverquery /si /fo list
