- requirements: []
  name: Soumaia ART Tests - Discover System Language with WMIC
  description: "WMIC (Windows Management Instrumentation Command-line) is a command-line tool that provides a simplified interface to query and manage Windows system configurations, processes, and hardware information using WMI. \n\nThe command in this test retrieves information about the system's locale, operating system language, and multilingual user interface (MUI) languages."
  tactic: discovery
  technique_id: T1614.001
  technique_name: 'System Location Discovery: System Language Discovery'
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: wmic /node:localhost os get Locale,OSLanguage,MUILanguages /format:table
  id: 2d5b2101-e54d-5ba0-a7a7-03fb99fcd645
