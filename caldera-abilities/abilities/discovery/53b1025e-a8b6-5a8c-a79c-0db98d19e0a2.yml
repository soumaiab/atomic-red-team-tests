- requirements: []
  name: Soumaia ART Tests - Windows - Discover domain trusts with nltest
  description: 'Uses the nltest command to discover domain trusts.

    Requires the installation of nltest via Windows RSAT or the Windows Server AD DS role.

    This technique has been used by the Trickbot malware family.'
  tactic: discovery
  technique_id: T1482
  technique_name: Domain Trust Discovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: cmd /c "WHERE nltest.exe >NUL 2>&1" & if not "%ERRORLEVEL%"=="0" ( cmd /c "echo Sorry RSAT must be installed manually" ) & nltest /domain_trusts & nltest /trusted_domains
  id: 53b1025e-a8b6-5a8c-a79c-0db98d19e0a2
