- requirements: []
  name: Soumaia ART Tests - System Discovery - SocGholish whoami
  description: "SocGholish performs whoami discovery commands and outputs the results to a tmp file. \nThe test will generate a filename similar to the random one generated during execution and write the file to AppData\\Temp.\n\nReference: https://redcanary.com/threat-detection-report/threats/socgholish/"
  tactic: discovery
  technique_id: T1033
  technique_name: System Owner/User Discovery
  executors:
  - cleanup:
    - Remove-Item -Path $env:temp\rad*.tmp -Force
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $TokenSet = @{ U = [Char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; N = [Char[]]'0123456789' }; $Upper = Get-Random -Count 5 -InputObject $TokenSet.U; $Number = Get-Random -Count 5 -InputObject $TokenSet.N; $StringSet = $Upper + $Number; $rad = (Get-Random -Count 5 -InputObject $StringSet) -join ''; $file = "rad" + $rad + ".tmp"; whoami.exe /all >> $env:temp\$file
  id: e5995bf0-5497-594f-af7a-f7647433c8b8
