- id: a639f6c7-1bbe-51e4-a755-2928531d0ea8
  name: Soumaia ART Tests - Enumerate all accounts via PowerShell (Local)
  description: Enumerate all accounts via PowerShell. Upon execution, lots of user account and group information will be displayed.
  tactic: discovery
  technique:
    attack_id: T1087.001
    name: 'Account Discovery: Local Account'
  platforms:
    windows:
      psh:
        command: |-
          net user
          get-localuser
          get-localgroupmember -group Users
          cmdkey.exe /list
          ls C:/Users
          get-childitem C:\Users\
          dir C:\Users\
          get-localgroup
          net localgroup
