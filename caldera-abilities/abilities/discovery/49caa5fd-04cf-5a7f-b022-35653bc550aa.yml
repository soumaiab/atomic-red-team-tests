- requirements: []
  name: Soumaia ART Tests - List Open Egress Ports
  description: 'This is to test for what ports are open outbound.  The technique used was taken from the following blog:

    https://www.blackhillsinfosec.com/poking-holes-in-the-firewall-egress-testing-with-allports-exposed/


    Upon successful execution, powershell will read top-128.txt (ports) and contact each port to confirm if open or not. Output will be to Desktop\open-ports.txt.'
  tactic: discovery
  technique_id: T1016
  technique_name: System Network Configuration Discovery
  executors:
  - cleanup:
    - Remove-Item -ErrorAction ignore "$env:USERPROFILE\Desktop\open-ports.txt"
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - top-128.txt
    parsers: []
    command: powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAHQAbwBwAC0AMQAyADgALgB0AHgAdAAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $ports = Get-content ".\top-128.txt"; $file = "$env:USERPROFILE\Desktop\open-ports.txt"; $totalopen = 0; $totalports = 0; New-Item $file -Force; foreach ($port in $ports) { $test = new-object system.Net.Sockets.TcpClient; $wait = $test.beginConnect("allports.exposed", $port, $null, $null); $wait.asyncwaithandle.waitone(250, $false) | Out-Null; $totalports++ | Out-Null; if ($test.Connected) { $result = "$port open"; Write-Host -ForegroundColor Green $result; $result | Out-File -Encoding ASCII -append $file; $totalopen++ | Out-Null } else { $result = "$port closed"; Write-Host -ForegroundColor Red $result; $totalclosed++ | Out-Null; $result | Out-File -Encoding ASCII -append $file } }; $results = "There were a total of $totalopen open ports out of $totalports ports tested."; $results | Out-File -Encoding ASCII -append $file; Write-Host $results
  id: 49caa5fd-04cf-5a7f-b022-35653bc550aa
