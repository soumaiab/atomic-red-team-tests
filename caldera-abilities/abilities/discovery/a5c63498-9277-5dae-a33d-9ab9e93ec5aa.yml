- id: a5c63498-9277-5dae-a33d-9ab9e93ec5aa
  name: Soumaia ART Tests - Enumerate Active Directory Computers with ADSISearcher
  description: 'The following Atomic test will utilize ADSISearcher to enumerate computers within Active Directory.

    Upon successful execution a listing of computers will output with their paths in AD.

    Reference: https://devblogs.microsoft.com/scripting/use-the-powershell-adsisearcher-type-accelerator-to-search-active-directory/'
  tactic: discovery
  technique:
    attack_id: T1018
    name: Remote System Discovery
  platforms:
    windows:
      psh:
        command: |-
          ([adsisearcher]"objectcategory=computer").FindAll(); ([adsisearcher]"objectcategory=computer").FindOne()
