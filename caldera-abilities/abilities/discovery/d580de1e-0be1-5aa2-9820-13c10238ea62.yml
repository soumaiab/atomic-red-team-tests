- id: d580de1e-0be1-5aa2-9820-13c10238ea62
  name: Soumaia ART Tests - System Network Connections Discovery via PowerShell (Process Mapping)
  description: Enumerate TCP connections and map to owning process names via PowerShell.
  tactic: discovery
  technique:
    attack_id: T1049
    name: System Network Connections Discovery
  platforms:
    windows:
      psh:
        command: |-
          Get-NetTCPConnection | ForEach-Object {
            $p = Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue
            [pscustomobject]@{
              Local   = "$($_.LocalAddress):$($_.LocalPort)"
              Remote  = "$($_.RemoteAddress):$($_.RemotePort)"
              State   = $_.State
              PID     = $_.OwningProcess
              Process = if ($p) { $p.ProcessName } else { $null }
            }
          } | Sort-Object State,Process | Format-Table -AutoSize
