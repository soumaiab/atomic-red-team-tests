- requirements: []
  name: Soumaia ART Tests - Applications Installed
  description: 'Query the registry to determine software and versions installed on the system. Upon execution a table of

    software name and version information will be displayed.'
  tactic: discovery
  technique_id: T1518
  technique_name: Software Discovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\* | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | Format-Table -Autosize; Get-ItemProperty HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | Format-Table -Autosize
  id: ab7796f0-7c69-5b3e-be06-fb11d2ae8fff
