- requirements: []
  name: Soumaia ART Tests - Recursive Enumerate Files And Directories By Powershell
  description: 'Adversary attempting to discover and collect sensitive documents and archives

    from a user’s system. The test recursively enumerates common user folders

    (Documents, Downloads, Desktop, OneDrive) for file types of interest such as .pdf, .doc,

    .docx, .xls, .xlsx, .txt, .zip, .rar, and .7z.

    This behavior is similar to malware like LOSTKEYS used by COLDRIVER in January 2025,

    where attackers perform targeted file discovery to support strategic intelligence collection https://www.zscaler.com/blogs/security-research/coldriver-updates-arsenal-baitswitch-and-simplefix.'
  tactic: discovery
  technique_id: T1083
  technique_name: File and Directory Discovery
  executors:
  - cleanup:
    - Remove-Item -Path "$env:TEMP\T1083-Enumerate-net.txt" -ErrorAction SilentlyContinue
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: '$out = "$env:TEMP\T1083-Enumerate-net.txt"; $dirsFilter = @(''Documents'',''Downloads'',''Desktop'',''OneDrive''); $exts = @(''.pdf'',''.doc'',''.docx'',''.xls'',''.xlsx'',''.txt'',''.zip'',''.rar'',''.7z''); $userProfile = [Environment]::GetFolderPath(''UserProfile''); $tr = [System.Collections.Generic.List[string]]::new(); function MatchesExtension($path) { try { $e = [System.IO.Path]::GetExtension($path).ToLower(); return $exts -contains $e } catch { return $false } }; function Scan-Dir($root) { try { $match = $false; foreach ($f in $dirsFilter) { if ($root -like "*$f*") { $match = $true; break } }; if (-not $match) { return }; [System.IO.Directory]::EnumerateFiles($root) | ForEach-Object { if (MatchesExtension $_) { $fi = [System.IO.FileInfo]::new($_); $tr.Add("[File] $_ Size:$($fi.Length) LastWrite:$($fi.LastWriteTime)") } }; [System.IO.Directory]::EnumerateDirectories($root) | ForEach-Object { Scan-Dir $_ } } catch [System.UnauthorizedAccessException] { $tr.Add("[AccessDenied] $root") } catch { $tr.Add("[Error] $root => $($_.Exception.Message)") } }; [System.IO.Directory]::EnumerateDirectories($userProfile) | ForEach-Object { Scan-Dir $_ }; $outDir = [System.IO.Path]::GetDirectoryName($out); if (-not [string]::IsNullOrEmpty($outDir) -and -not (Test-Path $outDir)) { New-Item -Path $outDir -ItemType Directory -Force | Out-Null }; $tr | Out-File -FilePath $out -Encoding UTF8; Write-Output "Enumeration complete. Results written to: $out"'
  id: 5b2dbbc5-b7d7-5fe2-91e9-250c2e99a568
