- id: dd005ddc-2266-5756-b57e-31c43c2bf348
  name: Soumaia ART Tests - Extract Edge Browsing History
  description: This test will extract Microsoft Edge browser's history of current user (requires elevation)
  tactic: discovery
  technique:
    attack_id: T1217
    name: Browser Bookmark Discovery
  platforms:
    windows:
      psh:
        command: |-
          $URL_Regex = '(htt(p|s))://([\w-]+\.)+[\w-]+(/[\w- ./?%&=]*)*?'
          $History = Get-Content -Path "$Env:LOCALAPPDATA\Microsoft\Edge\User Data\Default\History" | Select-String -AllMatches $URL_Regex | ForEach-Object { $_.Matches.Value } | Sort -Unique
          $History | Out-File -FilePath "$Env:USERPROFILE\Downloads\edgebrowsinghistory.txt"
        cleanup: |-
          Remove-Item -Path "$Env:USERPROFILE\Downloads\edgebrowsinghistory.txt"
