- requirements: []
  name: Soumaia ART Tests - Extract Edge Browsing History
  description: This test will extract Microsoft Edge browser's history of current user (requires elevation)
  tactic: discovery
  technique_id: T1217
  technique_name: Browser Bookmark Discovery
  executors:
  - cleanup:
    - Remove-Item -Path "$Env:USERPROFILE\Downloads\edgebrowsinghistory.txt"
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $URL_Regex = '(htt(p|s))://([\w-]+\.)+[\w-]+(/[\w- ./?%&=]*)*?'; $History = Get-Content -Path "$Env:LOCALAPPDATA\Microsoft\Edge\User Data\Default\History" | Select-String -AllMatches $URL_Regex | ForEach-Object { $_.Matches.Value } | Sort -Unique; $History | Out-File -FilePath "$Env:USERPROFILE\Downloads\edgebrowsinghistory.txt"
  id: dd005ddc-2266-5756-b57e-31c43c2bf348
