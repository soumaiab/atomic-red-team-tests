- id: e9573298-020a-5d01-ab82-d214e66a911d
  name: Soumaia ART Tests - Suspicious LAPS Attributes Query with Get-ADComputer ms-Mcs-AdmPwd property
  description: This test executes LDAP query using powershell command Get-ADComputer and lists Microsoft LAPS attributes ms-mcs-AdmPwd and ms-mcs-AdmPwdExpirationTime
  tactic: discovery
  technique:
    attack_id: T1087.002
    name: 'Account Discovery: Domain Account'
  platforms:
    windows:
      psh:
        command: |-
          Get-ADComputer $env:computername -Properties ms-Mcs-AdmPwd, ms-Mcs-AdmPwdExpirationTime
