- requirements: []
  name: Soumaia ART Tests - Discover System Time Zone via Registry
  description: 'Identify the Operating System Time Zone via registry with the reg.exe command.

    Upon execution, the system Time Zone will be shown.'
  tactic: discovery
  technique_id: T1124
  technique_name: System Time Discovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg query "HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation" /v TimeZoneKeyName
  id: 15538fe3-6035-561d-8644-dbf72a034256
