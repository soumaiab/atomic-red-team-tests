- id: ad7420d6-0d90-55d2-a357-3c85ed2b2bf6
  name: Soumaia ART Tests - System Network Configuration Discovery on Windows
  description: 'Identify network configuration information


    Upon successful execution, cmd.exe will spawn multiple commands to list network configuration settings. Output will be via stdout.'
  tactic: discovery
  technique:
    attack_id: T1016
    name: System Network Configuration Discovery
  platforms:
    windows:
      cmd:
        command: |-
          ipconfig /all
          netsh interface show interface
          arp -a
          nbtstat -n
          net config
