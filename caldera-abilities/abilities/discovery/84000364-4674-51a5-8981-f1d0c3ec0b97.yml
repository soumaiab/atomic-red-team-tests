- id: 84000364-4674-51a5-8981-f1d0c3ec0b97
  name: Soumaia ART Tests - Check internet connection using Test-NetConnection in PowerShell (TCP-SMB)
  description: Check internet connection using PowerShell's Test-NetConnection cmdlet and the TCP protocol to check for outbound SMB (Port 445) access. The default target is 8.8.8.8.
  tactic: discovery
  technique:
    attack_id: T1016.001
    name: 'System Network Configuration Discovery: Internet Connection Discovery'
  platforms:
    windows:
      psh:
        command: |-
          Test-NetConnection -CommonTCPPort SMB -ComputerName 8.8.8.8
