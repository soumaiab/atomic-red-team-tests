- requirements: []
  name: Soumaia ART Tests - Identify System Locale and Regional Settings with PowerShell
  description: "This action demonstrates how an attacker might gather a system's region and language settings using PowerShell, which could aid in profiling \nthe machine's location and user language preferences. The command outputs system locale details to a temporary file for further analysis."
  tactic: discovery
  technique_id: T1082
  technique_name: System Information Discovery
  executors:
  - cleanup:
    - cmd.exe /c del "%TMP%\a.txt"
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: powershell.exe -c "Get-Culture | Format-List | Out-File -FilePath %TMP%\a.txt"
  id: 714b18eb-686b-5943-b62f-ed8bb413f770
