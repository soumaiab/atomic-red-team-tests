- id: c4dbaa6f-e404-5aa5-95d4-78dfe31fc814
  name: Soumaia ART Tests - Windows - Discover domain trusts with nltest
  description: 'Uses the nltest command to discover domain trusts.

    Requires the installation of nltest via Windows RSAT or the Windows Server AD DS role.

    This technique has been used by the Trickbot malware family.'
  tactic: discovery
  technique:
    attack_id: T1482
    name: Domain Trust Discovery
  platforms:
    windows:
      cmd:
        command: |-
          cmd /c "WHERE nltest.exe >NUL 2>&1"
          if not "%ERRORLEVEL%"=="0" (
              cmd /c "echo Sorry RSAT must be installed manually"
          )
          nltest /domain_trusts
          nltest /trusted_domains
