- requirements: []
  name: Soumaia ART Tests - Find and Display Internet Explorer Browser Version
  description: 'Query the registry to determine the version of internet explorer installed on the system.

    Upon execution, version information about internet explorer will be displayed.'
  tactic: discovery
  technique_id: T1518
  technique_name: Software Discovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg query "HKEY_LOCAL_MACHINE\Software\Microsoft\Internet Explorer" /v svcVersion
  id: 9ef6c758-f69d-5e7a-8101-2f37b82547b7
