- id: 30bf723b-13ba-5fd6-8173-d5aced7a7dc2
  name: Soumaia ART Tests - Enumerate Active Directory for Unconstrained Delegation
  description: 'Attackers may attempt to query for computer objects with the UserAccountControl property

    ''TRUSTED_FOR_DELEGATION'' (0x80000;524288) set

    More Information - https://shenaniganslabs.io/2019/01/28/Wagging-the-Dog.html#when-the-stars-align-unconstrained-delegation-leads-to-rce

    Prerequisite: AD RSAT PowerShell module is needed and it must run under a domain user'
  tactic: discovery
  technique:
    attack_id: T1087.002
    name: 'Account Discovery: Domain Account'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand VAByAHkAIAB7AAoAIAAgACAAIABJAG0AcABvAHIAdAAtAE0AbwBkAHUAbABlACAAQQBjAHQAaQB2AGUARABpAHIAZQBjAHQAbwByAHkAIAAtAEUAcgByAG8AcgBBAGMAdABpAG8AbgAgAFMAdABvAHAAIAB8ACAATwB1AHQALQBOAHUAbABsAAoAIAAgACAAIABlAHgAaQB0ACAAMAAKAH0ACgBDAGEAdABjAGgAIAB7AAoAIAAgACAAIABlAHgAaQB0ACAAMQAKAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Get-ADObject -LDAPFilter '(UserAccountControl:1.2.840.113556.1.4.803:=524288)' -Server $env:UserDnsDomain
