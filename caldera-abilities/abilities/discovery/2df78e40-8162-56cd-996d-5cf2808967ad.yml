- requirements: []
  name: Soumaia ART Tests - Enumerate Root Domain linked policies Discovery
  description: 'The following Atomic test will utilize ADSISearcher to enumerate root domain unit within Active Directory.

    Upon successful execution a listing of users will output with their paths in AD.

    Reference: https://medium.com/@pentesttas/discover-hidden-gpo-s-on-active-directory-using-ps-adsi-a284b6814c81'
  tactic: discovery
  technique_id: T1087.002
  technique_name: 'Account Discovery: Domain Account'
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: (([adsisearcher]'').SearchRooT).Path | %{if(([ADSI]"$_").gPlink){Write-Host "[+] Domain Path:"([ADSI]"$_").Path;$a=((([ADSI]"$_").gplink) -replace "[[;]" -split "]");for($i=0;$i -lt $a.length;$i++){if($a[$i]){Write-Host "Policy Path[$i]:"([ADSI]($a[$i]).Substring(0,$a[$i].length-1)).Path;Write-Host "Policy Name[$i]:"([ADSI]($a[$i]).Substring(0,$a[$i].length-1)).DisplayName} };Write-Output "`n" }}
  id: 2df78e40-8162-56cd-996d-5cf2808967ad
