- id: 68fd46f2-6503-5bdc-a69f-478c7ce04ec1
  name: Soumaia ART Tests - Check internet connection using Test-NetConnection in PowerShell (TCP-HTTP)
  description: Check internet connection using PowerShell's Test-NetConnection cmdlet and the TCP protocol to check for outbound HTTP (Port 80) access. The default target is www.google.com.
  tactic: discovery
  technique:
    attack_id: T1016.001
    name: 'System Network Configuration Discovery: Internet Connection Discovery'
  platforms:
    windows:
      psh:
        command: |-
          Test-NetConnection -CommonTCPPort HTTP -ComputerName www.google.com
