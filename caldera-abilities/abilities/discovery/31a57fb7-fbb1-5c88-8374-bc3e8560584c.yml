- requirements: []
  name: Soumaia ART Tests - List Google Chrome / Opera Bookmarks on Windows with powershell
  description: 'Searches for Google Chrome''s and Opera''s Bookmarks file (on Windows distributions) that contains bookmarks.

    Upon execution, paths that contain bookmark files will be displayed.'
  tactic: discovery
  technique_id: T1217
  technique_name: Browser Bookmark Discovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Get-ChildItem -Path C:\Users\ -Filter Bookmarks -Recurse -ErrorAction SilentlyContinue -Force
  id: 31a57fb7-fbb1-5c88-8374-bc3e8560584c
