- requirements: []
  name: Soumaia ART Tests - Remote System Discovery - nslookup
  description: 'Powershell script that runs nslookup on cmd.exe against the local /24 network of the first network adaptor listed in ipconfig.


    Upon successful execution, powershell will identify the ip range (via ipconfig) and perform a for loop and execute nslookup against that IP range. Output will be via stdout. (requires elevation)'
  tactic: discovery
  technique_id: T1018
  technique_name: Remote System Discovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $localip = ((ipconfig | findstr [0-9].\.)[0]).Split()[-1]; $pieces = $localip.split("."); $firstOctet = $pieces[0]; $secondOctet = $pieces[1]; $thirdOctet = $pieces[2]; foreach ($ip in 1..255 | % { "$firstOctet.$secondOctet.$thirdOctet.$_" } ) {cmd.exe /c nslookup $ip}
  id: 6a3719ed-7ac7-5b28-8018-c2829ef094e2
