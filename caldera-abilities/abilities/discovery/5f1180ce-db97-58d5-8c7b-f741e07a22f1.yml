- requirements: []
  name: Soumaia ART Tests - Get-WmiObject to Enumerate Domain Controllers
  description: 'The following Atomic test will utilize get-wmiobject to enumerate Active Directory for Domain Controllers.

    Upon successful execution a listing of Systems from AD will output with their paths.

    Reference: https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.management/get-wmiobject?view=powershell-5.1'
  tactic: discovery
  technique_id: T1018
  technique_name: Remote System Discovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: try { get-wmiobject -class ds_computer -namespace root\directory\ldap -ErrorAction Stop } catch { $_; exit $_.Exception.HResult }
  id: 5f1180ce-db97-58d5-8c7b-f741e07a22f1
