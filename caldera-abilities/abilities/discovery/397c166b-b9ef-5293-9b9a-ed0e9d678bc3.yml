- id: 397c166b-b9ef-5293-9b9a-ed0e9d678bc3
  name: Soumaia ART Tests - Windows - Discover domain trusts with dsquery
  description: 'Uses the dsquery command to discover domain trusts.

    Requires the installation of dsquery via Windows RSAT or the Windows Server AD DS role.'
  tactic: discovery
  technique:
    attack_id: T1482
    name: Domain Trust Discovery
  platforms:
    windows:
      cmd:
        command: |-
          dsquery * -filter "(objectClass=trustedDomain)" -attr *
