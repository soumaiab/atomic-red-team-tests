- requirements: []
  name: Soumaia ART Tests - Discover System Language with Powershell
  description: "This PowerShell script collects key system settings, such as the UI language, user language preferences, system locale, current culture, UI culture, and time zone, into a hash table. \n\nIt then outputs these settings in a readable key-value format directly to the terminal. The script is simple and efficient for quickly displaying system configuration details."
  tactic: discovery
  technique_id: T1614.001
  technique_name: 'System Location Discovery: System Language Discovery'
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: '$info = @{ UILanguage     = Get-WinUILanguageOverride; UserLanguages  = (Get-WinUserLanguageList).LanguageTag -join '', ''; SystemLocale   = Get-WinSystemLocale; CurrentCulture = [System.Globalization.CultureInfo]::CurrentCulture.Name; CurrentUICulture = [System.Globalization.CultureInfo]::CurrentUICulture.Name; TimeZone       = (Get-TimeZone).Id }; $info.GetEnumerator() | ForEach-Object { "$($_.Name): $($_.Value)" }'
  id: 3ba243b7-2d96-5485-ae89-e76b1c8700ad
