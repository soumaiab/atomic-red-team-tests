- id: d9906ab6-b496-5112-9fe6-c044ab4d243e
  name: Soumaia ART Tests - Elevated group enumeration using net group (Domain)
  description: 'Runs "net group" command including command aliases and loose typing to simulate enumeration/discovery of high value domain groups. This

    test will display some errors if run on a computer not connected to a domain. Upon execution, domain information will be displayed.'
  tactic: discovery
  technique:
    attack_id: T1069.002
    name: 'Permission Groups Discovery: Domain Groups'
  platforms:
    windows:
      cmd:
        command: |-
          net groups "Account Operators" /domain
          net groups "Exchange Organization Management" /domain
          net group "BUILTIN\Backup Operators" /domain
          net group "Domain Admins" /domain
