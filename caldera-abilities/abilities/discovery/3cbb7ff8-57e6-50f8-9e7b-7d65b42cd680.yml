- id: 3cbb7ff8-57e6-50f8-9e7b-7d65b42cd680
  name: Soumaia ART Tests - Discover System Language by Registry Query
  description: "Identify System language by querying the registry on an endpoint. \n\nUpon successful execution, result in number format can be looked up to correlate the language."
  tactic: discovery
  technique:
    attack_id: T1614.001
    name: 'System Location Discovery: System Language Discovery'
  platforms:
    windows:
      cmd:
        command: |-
          reg query HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Nls\Language
