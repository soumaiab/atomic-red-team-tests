- id: ad84584d-4511-52b0-bb20-abf123c4d352
  name: Soumaia ART Tests - Download Macro-Enabled Phishing Attachment
  description: 'This atomic test downloads a macro enabled document from the Atomic Red Team GitHub repository, simulating an end user clicking a phishing link to download the file.

    The file "PhishingAttachment.xlsm" is downloaded to the %temp% directory.'
  tactic: initial-access
  technique:
    attack_id: T1566.001
    name: 'Phishing: Spearphishing Attachment'
  platforms:
    windows:
      psh:
        command: |-
          $url = 'https://github.com/redcanaryco/atomic-red-team/raw/master/atomics/T1566.001/bin/PhishingAttachment.xlsm'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $env:TEMP\PhishingAttachment.xlsm
        cleanup: |-
          Remove-Item $env:TEMP\PhishingAttachment.xlsm -ErrorAction Ignore
