- id: 6e361870-8b04-59fc-a8c3-b0e07a79f93b
  name: Soumaia ART Tests - PowerShell Network Sniffing
  description: 'PowerShell Built-in Cmdlets to capture network traffic.

    https://learn.microsoft.com/en-us/powershell/module/neteventpacketcapture/new-neteventsession?view=windowsserver2022-ps (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1040
    name: Network Sniffing
  platforms:
    windows:
      psh:
        command: |-
          New-NetEventSession -Name Capture007 -LocalFilePath "$ENV:Temp\sniff.etl"
          Add-NetEventPacketCaptureProvider -SessionName Capture007 -TruncationLength 100
          Start-NetEventSession -Name Capture007
          Stop-NetEventSession -Name Capture007
          Remove-NetEventSession -Name Capture007
        cleanup: |-
          del $ENV:Temp\sniff.etl
