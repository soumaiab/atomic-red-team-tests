- requirements: []
  name: Soumaia ART Tests - Enumeration for Credentials in Registry
  description: Queries to enumerate for credentials in the Registry. Upon execution, any registry key containing the word "password" will be displayed.
  tactic: credential-access
  technique_id: T1552.002
  technique_name: 'Unsecured Credentials: Credentials in Registry'
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg query HKLM /f password /t REG_SZ /s & reg query HKCU /f password /t REG_SZ /s
  id: 1c1bcbd0-0fcb-527c-a84f-43fc7c85f5c7
