- id: 1c1bcbd0-0fcb-527c-a84f-43fc7c85f5c7
  name: Soumaia ART Tests - Enumeration for Credentials in Registry
  description: Queries to enumerate for credentials in the Registry. Upon execution, any registry key containing the word "password" will be displayed.
  tactic: credential-access
  technique:
    attack_id: T1552.002
    name: 'Unsecured Credentials: Credentials in Registry'
  platforms:
    windows:
      cmd:
        command: |-
          reg query HKLM /f password /t REG_SZ /s
          reg query HKCU /f password /t REG_SZ /s
