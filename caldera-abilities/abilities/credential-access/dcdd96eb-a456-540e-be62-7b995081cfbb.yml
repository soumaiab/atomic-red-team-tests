- id: dcdd96eb-a456-540e-be62-7b995081cfbb
  name: Soumaia ART Tests - Trigger an authenticated RPC call to a target server with no Sign flag set
  description: 'RpcPing command can be used to trigger an authenticated RPC call to the target server (/s) that could be relayed to a privileged resource (Sign flag not Set)

    Ref: https://twitter.com/splinter_code/status/1421144623678988298'
  tactic: credential-access
  technique:
    attack_id: T1187
    name: Forced Authentication
  platforms:
    windows:
      psh:
        command: |-
          rpcping -s 127.0.0.1 -e 9997 /a connect /u NTLM 1>$Null
