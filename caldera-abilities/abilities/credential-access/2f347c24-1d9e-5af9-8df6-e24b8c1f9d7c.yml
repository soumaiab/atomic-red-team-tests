- requirements: []
  name: Soumaia ART Tests - Windows Internal Packet Capture
  description: 'Uses the built-in Windows packet capture

    After execution you should find a file named trace.etl and trace.cab in the temp directory (requires elevation)'
  tactic: credential-access
  technique_id: T1040
  technique_name: Network Sniffing
  executors:
  - cleanup:
    - netsh trace stop >nul 2>&1 & TIMEOUT /T 5 >nul 2>&1 & del %temp%\trace.etl >nul 2>&1 & del %temp%\trace.cab >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: netsh trace start capture=yes tracefile=%temp%\trace.etl maxsize=10
  id: 2f347c24-1d9e-5af9-8df6-e24b8c1f9d7c
