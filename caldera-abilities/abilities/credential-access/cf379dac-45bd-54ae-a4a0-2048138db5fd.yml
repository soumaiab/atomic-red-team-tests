- id: cf379dac-45bd-54ae-a4a0-2048138db5fd
  name: Soumaia ART Tests - List Credential Files via PowerShell
  description: Via PowerShell,list files where credentials are stored in Windows Credential Manager (requires elevation)
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    windows:
      psh:
        command: |-
          $usernameinfo = (Get-ChildItem Env:USERNAME).Value
          Get-ChildItem -Hidden C:\Users\$usernameinfo\AppData\Roaming\Microsoft\Credentials\
          Get-ChildItem -Hidden C:\Users\$usernameinfo\AppData\Local\Microsoft\Credentials\
