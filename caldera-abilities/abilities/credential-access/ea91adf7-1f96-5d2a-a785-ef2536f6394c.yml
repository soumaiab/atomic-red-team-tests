- id: ea91adf7-1f96-5d2a-a785-ef2536f6394c
  name: Soumaia ART Tests - Private Keys
  description: 'Find private keys on the Windows file system.

    File extensions include: .key, .pgp, .gpg, .ppk., .p12, .pem, pfx, .cer, .p7b, .asc (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1552.004
    name: 'Unsecured Credentials: Private Keys'
  platforms:
    windows:
      cmd:
        command: |-
          dir c:\ /b /s .key | findstr /e .key
