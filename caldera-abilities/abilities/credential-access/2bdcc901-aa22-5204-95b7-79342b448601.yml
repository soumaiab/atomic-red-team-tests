- id: 2bdcc901-aa22-5204-95b7-79342b448601
  name: Soumaia ART Tests - Create Volume Shadow Copy with WMI
  description: 'This test is intended to be run on a domain Controller.


    The Active Directory database NTDS.dit may be dumped by copying it from a Volume Shadow Copy. (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1003.003
    name: 'OS Credential Dumping: NTDS'
  platforms:
    windows:
      cmd:
        command: |-
          cmd /c "reg query HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\ProductOptions  /v ProductType | findstr LanmanNT"
          if not "%ERRORLEVEL%"=="0" (
              cmd /c "echo Sorry, Promoting this machine to a Domain Controller must be done manually"
          )
          wmic shadowcopy call create Volume=C:\
