- id: 5ed133ca-0d1b-59f9-a1fb-35fd2fe0b7f1
  name: Soumaia ART Tests - List Credential Files via Command Prompt
  description: Via Command Prompt,list files where credentials are stored in Windows Credential Manager (requires elevation)
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    windows:
      cmd:
        command: |-
          dir /a:h C:\Users\%USERNAME%\AppData\Local\Microsoft\Credentials\
          dir /a:h C:\Users\%USERNAME%\AppData\Roaming\Microsoft\Credentials\
