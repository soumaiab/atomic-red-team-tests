- id: e7d25796-5f25-5661-aa2c-74cd3cc61ece
  name: Soumaia ART Tests - Windows Internal pktmon capture
  description: 'Will start a packet capture and store log file as t1040.etl.

    https://lolbas-project.github.io/lolbas/Binaries/Pktmon/ (requires elevation)'
  tactic: credential-access
  technique:
    attack_id: T1040
    name: Network Sniffing
  platforms:
    windows:
      cmd:
        command: |-
          pktmon.exe start --etw  -f %TEMP%\t1040.etl
          TIMEOUT /T 5 >nul 2>&1
          pktmon.exe stop
        cleanup: |-
          del %TEMP%\t1040.etl
