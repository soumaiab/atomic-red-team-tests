- requirements: []
  name: Soumaia ART Tests - Replace Desktop Wallpaper
  description: Downloads an image from a URL and sets it as the desktop wallpaper.
  tactic: impact
  technique_id: T1491.001
  technique_name: 'Defacement: Internal Defacement'
  executors:
  - cleanup:
    - $updateWallpapercode = @'; using System.Runtime.InteropServices; namespace Win32{ public class Wallpaper{ [DllImport("user32.dll", CharSet=CharSet.Auto)]; static extern int SystemParametersInfo (int uAction , int uParam , string lpvParam , int fuWinIni) ; public static void SetWallpaper(string thePath){ SystemParametersInfo(20,0,thePath,3); } } }; '@; if (Test-Path -Path $env:TEMP\T1491.001-OrginalWallpaperLocation -PathType Leaf) { $orgImg = Get-Content -Path "$env:TEMP\T1491.001-OrginalWallpaperLocation"; add-type $updateWallpapercode; [Win32.Wallpaper]::SetWallpaper($orgImg) }; Remove-Item "$env:TEMP\T1491.001-OrginalWallpaperLocation" -ErrorAction Ignore; Remove-Item "$env:TEMP\T1491.001-newWallpaper.png" -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $url = "https://redcanary.com/wp-content/uploads/Atomic-Red-Team-Logo.png"; $imgLocation = "$env:TEMP\T1491.001-newWallpaper.png"; $orgWallpaper = (Get-ItemProperty -Path Registry::'HKEY_CURRENT_USER\Control Panel\Desktop\' -Name WallPaper).WallPaper; $orgWallpaper | Out-File -FilePath "$env:TEMP\T1491.001-OrginalWallpaperLocation"; $updateWallpapercode = @'; using System.Runtime.InteropServices; namespace Win32{ public class Wallpaper{ [DllImport("user32.dll", CharSet=CharSet.Auto)]; static extern int SystemParametersInfo (int uAction , int uParam , string lpvParam , int fuWinIni) ; public static void SetWallpaper(string thePath){ SystemParametersInfo(20,0,thePath,3); } } }; '@; $wc = New-Object System.Net.WebClient; try{ $wc.DownloadFile($url, $imgLocation); add-type $updateWallpapercode; [Win32.Wallpaper]::SetWallpaper($imgLocation) } catch [System.Net.WebException]{ Write-Host("Cannot download $url"); add-type $updateWallpapercode; [Win32.Wallpaper]::SetWallpaper($imgLocation) } finally{ $wc.Dispose() }
  id: a9e5a43c-089e-58fd-a0f2-4caf13246475
