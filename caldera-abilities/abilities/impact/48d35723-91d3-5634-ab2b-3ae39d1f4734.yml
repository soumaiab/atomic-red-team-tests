- requirements: []
  name: Soumaia ART Tests - Windows - Simulate CPU Load with PowerShell
  description: 'This test simulates high CPU load using PowerShell, commonly seen in resource hijacking.

    Spawns background jobs to stress CPU cores for a specified duration.'
  tactic: impact
  technique_id: T1496
  technique_name: Resource Hijacking
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $end = (Get-Date).AddSeconds(30); 1..4 | ForEach-Object { Start-Job { param($t) while((Get-Date) -lt $t) { $i=0; while($i -lt 200000){$i++} } } -ArgumentList $end }; Get-Job | Wait-Job | Remove-Job
  id: 48d35723-91d3-5634-ab2b-3ae39d1f4734
