- id: 820d6b89-592f-5ef5-a3b0-90b6bac6e251
  name: Soumaia ART Tests - Windows - Disable Windows Recovery Console Repair
  description: 'Disables repair by the Windows Recovery Console on boot. This technique is used by numerous ransomware families and APT malware such as Olympic Destroyer.

    Upon execution, "The operation completed successfully." will be displayed in the powershell session. (requires elevation)'
  tactic: impact
  technique:
    attack_id: T1490
    name: Inhibit System Recovery
  platforms:
    windows:
      cmd:
        command: |-
          bcdedit.exe /set {default} bootstatuspolicy ignoreallfailures
          bcdedit.exe /set {default} recoveryenabled no
        cleanup: |-
          bcdedit.exe /set {default} bootstatuspolicy DisplayAllFailures >nul 2>&1
          bcdedit.exe /set {default} recoveryenabled yes >nul 2>&1
