- id: c7cc76eb-aa94-5413-8091-22c43ba5571d
  name: Soumaia ART Tests - Windows - Disable the SR scheduled task
  description: Use schtasks.exe to disable the System Restore (SR) scheduled task (requires elevation)
  tactic: impact
  technique:
    attack_id: T1490
    name: Inhibit System Recovery
  platforms:
    windows:
      cmd:
        command: |-
          schtasks.exe /Change /TN "\Microsoft\Windows\SystemRestore\SR" /disable
        cleanup: |-
          schtasks.exe /Change /TN "\Microsoft\Windows\SystemRestore\SR" /enable >nul 2>&1
