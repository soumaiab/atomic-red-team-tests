- requirements: []
  name: Soumaia ART Tests - Windows - Delete Volume Shadow Copies via WMI with PowerShell
  description: 'Deletes Windows Volume Shadow Copies with PowerShell code and Get-WMIObject.

    This technique is used by numerous ransomware families such as Sodinokibi/REvil.

    Executes Get-WMIObject. Shadow copies can only be created on Windows server or Windows 8, so upon execution

    there may be no output displayed. (requires elevation)'
  tactic: impact
  technique_id: T1490
  technique_name: Inhibit System Recovery
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Get-WmiObject Win32_Shadowcopy | ForEach-Object {$_.Delete();}
  id: fd77f1c6-70e8-5f29-9849-f43f03b313f1
