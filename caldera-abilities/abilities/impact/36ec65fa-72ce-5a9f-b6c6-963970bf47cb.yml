- requirements: []
  name: Soumaia ART Tests - Modify VSS Service Permissions
  description: 'This atomic test alters the security settings of the Volume Shadow Copy Service (VSS) by modifying its permissions, potentially impacting system recovery operations. The specific permissions set by the command are as follows:

    - Deny Generic All (GA) permissions to Network Users (NU)

    - Deny GA permissions to Everyone (WD)

    - Deny GA permissions to Anonymous (AN)

    - Allow Full Access (FA) and Generic All (GA) permissions to Everyone (WD) in System ACL (SACL)

    - Allow Object Inherit and Inherit Only (OIIO) Full Access (FA) and GA permissions to Everyone (WD) in SACL

    These permissions can significantly restrict VSS functionalities, including backup and restore operations. As such, it is essential to run this test only in a controlled environment with administrative privileges.

    A cleanup command is provided to reset VSS permissions to a common default configuration, which should be verified against your specific system''s configuration. It''s crucial to use this cleanup command after testing to ensure the system''s backup and recovery capabilities remain functional. Running this test on a production system or critical environment is not recommended without proper precautions and a robust recovery plan. (requires elevation)'
  tactic: impact
  technique_id: T1490
  technique_name: Inhibit System Recovery
  executors:
  - cleanup:
    - sc sdset VSS D:(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)(A;;LC;;;BU)S:(AU;FA;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;WD)
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: sc sdset VSS D:(D;;GA;;;NU)(D;;GA;;;WD)(D;;GA;;;AN)S:(AU;FA;GA;;;WD)(AU;OIIOFA;GA;;;WD)
  id: 36ec65fa-72ce-5a9f-b6c6-963970bf47cb
