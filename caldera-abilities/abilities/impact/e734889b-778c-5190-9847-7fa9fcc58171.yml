- id: e734889b-778c-5190-9847-7fa9fcc58171
  name: Soumaia ART Tests - Data Encrypted with GPG4Win
  description: Gpg4win is a Windows tool (also called Kleopatra which is the preferred certificate manager) that uses email and file encryption packages for symmetric encryption. It is used by attackers to encrypt disks. User will need to add pass phrase to encrypt file as automation is not allowed under newer versions.
  tactic: impact
  technique:
    attack_id: T1486
    name: Data Encrypted for Impact
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKAB0AGUAcwB0AC0AcABhAHQAaAAgACcAQwA6AFwAUAByAG8AZwByAGEAbQAgAEYAaQBsAGUAcwAgACgAeAA4ADYAKQBcAEcAbgB1AFAARwBcAGIAaQBuAFwAZwBwAGcALgBlAHgAZQAnACkAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQAKAA==
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Set-Content -Path "$env:temp\test.txt" -Value "populating this file with some text"  # Create the test.txt file again in case prereqs failed
          cmd /c "`"C:\Program Files (x86)\GnuPG\bin\gpg.exe`" --passphrase 'SomeParaphraseBlah' --batch --yes -c `"$env:temp\test.txt`""
        cleanup: |-
          Remove-Item -Path "$env:temp\test.txt" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:temp\test.txt.gpg" -Force -ErrorAction SilentlyContinue
