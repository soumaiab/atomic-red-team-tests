- requirements: []
  name: Soumaia ART Tests - Phantom Dll Hijacking - ualapi.dll
  description: 'Re-starting the Print Spooler service leads to C:\Windows\System32\ualapi.dll being loaded

    A malicious ualapi.dll placed in the System32 directory will lead to its execution whenever the system starts


    Upon successful execution, amsi.dll will be copied and renamed to ualapi.dll and then ualapi.dll will be copied to system32 folder for loading during system restart.

    Print Spooler service is also configured to auto start. Reboot of system is required (requires elevation)'
  tactic: stealth
  technique_id: T1574.001
  technique_name: 'Hijack Execution Flow: DLL'
  executors:
  - cleanup:
    - del %windir%\System32\ualapi.dll & del %APPDATA%\ualapi.dll
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: copy %windir%\System32\amsi.dll %APPDATA%\amsi.dll & ren %APPDATA%\amsi.dll ualapi.dll & copy %APPDATA%\ualapi.dll %windir%\System32\ualapi.dll & sc config Spooler start=auto
  id: 71a606db-5890-5935-8abd-97994c5a104f
