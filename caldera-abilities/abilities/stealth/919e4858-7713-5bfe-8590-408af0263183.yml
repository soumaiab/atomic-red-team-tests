- id: 919e4858-7713-5bfe-8590-408af0263183
  name: Soumaia ART Tests - Event Log Manipulations- Time slipping via Powershell
  description: "Changes the system time on the computer to a time that you specify. It involves altering the system’s clock or adjusting the dates of files, affecting timestamp integrity within Event Logs. This technique can disrupt the sequence of logged events, complicating incident analysis and forensics. \nReference - \nhttps://detect.fyi/event-log-manipulations-1-time-slipping-55bf95631c40\nhttps://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/set-date?view=powershell-7.4 (requires elevation)"
  tactic: stealth
  technique:
    attack_id: T1070.006
    name: 'Indicator Removal on Host: Timestomp'
  platforms:
    windows:
      psh:
        command: "try{ \n  Set-Date -Date (Get-Date).AddDays(3)\n  Add-Content \"$env:APPDATA\\slipDays.bak\" 3\n}\ncatch {exit 1}"
        cleanup: |-
          if(Test-Path "$env:APPDATA\slipDays.bak" ){
            foreach($line in (get-content $env:APPDATA\slipDays.bak)){
              Set-Date -Date (Get-Date).AddDays(-$line)
            }
            rm "$env:APPDATA\slipDays.bak"
          }
