- requirements: []
  name: Soumaia ART Tests - Certutil Rename and Decode
  description: Rename certutil and decode a file. This is in reference to latest research by FireEye [here](https://www.fireeye.com/blog/threat-research/2018/09/apt10-targeting-japanese-corporations-using-updated-ttps.html)
  tactic: stealth
  technique_id: T1140
  technique_name: Deobfuscate/Decode Files or Information
  executors:
  - cleanup:
    - del %temp%\tcm.tmp >nul 2>&1 & del %temp%\T1140_calc2.txt >nul 2>&1 & del %temp%\T1140_calc2_decoded.exe >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: copy %windir%\system32\certutil.exe %temp%\tcm.tmp & %temp%\tcm.tmp -encode C:\Windows\System32\calc.exe %temp%\T1140_calc2.txt & %temp%\tcm.tmp -decode %temp%\T1140_calc2.txt %temp%\T1140_calc2_decoded.exe
  id: d192da6e-71f3-5254-9570-e1e29f4129bb
