- id: fd6f2a4a-29a0-53bf-aecc-0477bb10b356
  name: Soumaia ART Tests - Detect Virtualization Environment via WMI Manufacturer/Model Listing (Windows)
  description: Windows Management Instrumentation(WMI) objects contain system information which helps to detect virtualization. This test will get the model and manufacturer of the machine to determine if it is a virtual machine, such as through VMware or VirtualBox.
  tactic: stealth
  technique:
    attack_id: T1497.001
    name: 'Virtualization/Sandbox Evasion: System Checks'
  platforms:
    windows:
      psh:
        command: |-
          $Manufacturer = Get-WmiObject -Class Win32_ComputerSystem | select-object -expandproperty "Manufacturer"
          $Model = Get-WmiObject -Class Win32_ComputerSystem | select-object -expandproperty "Model"
          if((($Manufacturer.ToLower() -eq "microsoft corporation") -and ($Model.ToLower().contains("virtual"))) -or ($Manufacturer.ToLower().contains("vmware")) -or ($Model.ToLower() -eq "virtualbox")) {write-host "Virtualization environment detected!"} else {write-host "No virtualization environment detected!"}
