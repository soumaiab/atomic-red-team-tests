- id: 5ac7a7b1-da3f-58f1-b5f9-7ca2e4008a62
  name: Soumaia ART Tests - Create Hidden Directory via $index_allocation
  description: 'Create an Alternate Data Stream Directory and File with the command prompt. Write access is required. Upon execution,

    run "dir /A /Q /R" in the %temp% folder to view that the alternate data stream folder exists. To view the data in the

    alternate data stream, run "type %temp%\...$.......::$index_allocation\secrets.txt"'
  tactic: stealth
  technique:
    attack_id: T1564.004
    name: 'Hide Artifacts: NTFS File Attributes'
  platforms:
    windows:
      cmd:
        command: |-
          md %temp%\...$.......::$index_allocation
          echo too many secrets > %temp%\...$.......::$index_allocation\secrets.txt
        cleanup: |-
          rmdir /S /Q %temp%\...$.......::$index_allocation >nul 2>&1
