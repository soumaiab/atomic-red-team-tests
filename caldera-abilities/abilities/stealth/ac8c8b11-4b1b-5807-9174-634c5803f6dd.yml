- id: ac8c8b11-4b1b-5807-9174-634c5803f6dd
  name: Soumaia ART Tests - Malicious process Masquerading as LSM.exe
  description: 'Detect LSM running from an incorrect directory and an incorrect service account

    This works by copying cmd.exe to a file, naming it lsm.exe, then copying a file to the C:\ folder.


    Upon successful execution, cmd.exe will be renamed as lsm.exe and executed from non-standard path. (requires elevation)'
  tactic: stealth
  technique:
    attack_id: T1036.003
    name: 'Masquerading: Rename System Utilities'
  platforms:
    windows:
      cmd:
        command: |-
          copy C:\Windows\System32\cmd.exe C:\lsm.exe
          C:\lsm.exe /c echo T1036.003 > C:\T1036.003.txt
        cleanup: |-
          del C:\T1036.003.txt >nul 2>&1
          del C:\lsm.exe >nul 2>&1
