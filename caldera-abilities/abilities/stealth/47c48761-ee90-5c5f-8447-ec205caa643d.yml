- id: 47c48761-ee90-5c5f-8447-ec205caa643d
  name: Soumaia ART Tests - Hide Files Through Registry
  description: 'Disable Show Hidden files switch in registry. This technique was abused by several malware to hide their files from normal user.

    See how this trojan abuses this technique - https://www.sophos.com/en-us/threat-center/threat-analyses/viruses-and-spyware/W32~Tiotua-P/detailed-analysis.aspx (requires elevation)'
  tactic: stealth
  technique:
    attack_id: T1564.001
    name: 'Hide Artifacts: Hidden Files and Directories'
  platforms:
    windows:
      cmd:
        command: |-
          reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced /v ShowSuperHidden /t REG_DWORD /d 0 /f
          reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced /v Hidden /t REG_DWORD /d 0 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v ShowSuperHidden /f >nul 2>&1
          reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v Hidden /f >nul 2>&1
