- id: 4bb50ab9-ecf3-55de-a2ca-28efbf95d9da
  name: Soumaia ART Tests - Masquerade as a built-in system executable
  description: Launch an executable that attempts to masquerade as a legitimate executable.
  tactic: stealth
  technique:
    attack_id: T1036.005
    name: 'Masquerading: Match Legitimate Name or Location'
  platforms:
    windows:
      psh:
        command: |-
          Add-Type -TypeDefinition @'
          public class Test {
              public static void Main(string[] args) {
                  System.Console.WriteLine("tweet, tweet");
              }
          }
          '@ -OutputAssembly "$Env:windir\Temp\svchost.exe"

          Start-Process -FilePath "$Env:windir\Temp\svchost.exe"
        cleanup: |-
          Remove-Item -Path "$Env:windir\Temp\svchost.exe" -ErrorAction Ignore
