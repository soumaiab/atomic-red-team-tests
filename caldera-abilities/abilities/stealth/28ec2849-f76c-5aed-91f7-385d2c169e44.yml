- id: 28ec2849-f76c-5aed-91f7-385d2c169e44
  name: Soumaia ART Tests - Mshta executes VBScript to execute malicious command
  description: 'Run a local VB script to run local user enumeration powershell command.

    This attempts to emulate what FIN7 does with this technique which is using mshta.exe to execute VBScript to execute malicious code on victim systems.

    Upon execution, a new PowerShell windows will be opened that displays user information.'
  tactic: stealth
  technique:
    attack_id: T1218.005
    name: 'Signed Binary Proxy Execution: Mshta'
  platforms:
    windows:
      cmd:
        command: |-
          mshta vbscript:Execute("CreateObject(""Wscript.Shell"").Run ""powershell -noexit -file .\powershell.ps1"":close")
        payloads:
        - powershell.ps1
