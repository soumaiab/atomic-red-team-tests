- requirements: []
  name: Soumaia ART Tests - Binary Masquerading via Invisible Unicode
  description: 'Copies a system binary (calc.exe) to a new name containing an invisible character (U+200D) and executes it.

    This tests the ability of EDRs to handle non-normalized file paths in process execution events.'
  tactic: stealth
  technique_id: T1027.018
  technique_name: 'Obfuscated Files or Information: Invisible Unicode'
  executors:
  - cleanup:
    - $hiddentarget = "$env:TEMP\calc" + [char]0x200D + ".exe"; Stop-Process -Name "calc*" -ErrorAction Ignore; Remove-Item $hiddentarget -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $hiddentarget = "$env:TEMP\calc" + [char]0x200D + ".exe"; Copy-Item "C:\Windows\System32\calc.exe" -Destination $hiddentarget; Start-Process $hiddentarget
  id: bdf75b3e-3813-5e91-9ab6-df2353fb0ca8
