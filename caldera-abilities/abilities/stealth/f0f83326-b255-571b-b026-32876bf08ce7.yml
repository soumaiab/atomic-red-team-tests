- id: f0f83326-b255-571b-b026-32876bf08ce7
  name: Soumaia ART Tests - Create Windows Hidden File with powershell
  description: 'Creates a file and marks it as hidden through powershell. Upon execution, open File Epxplorer and enable View > Hidden Items. Then, open Properties > Details on the file

    and observe that the Attributes is "H" Hidden. (requires elevation)'
  tactic: stealth
  technique:
    attack_id: T1564.001
    name: 'Hide Artifacts: Hidden Files and Directories'
  platforms:
    windows:
      psh:
        command: |-
          cmd /c "IF EXIST %temp%\T1564.001-9.txt ( EXIT 0 ) ELSE ( EXIT 1 )"
          if ($LASTEXITCODE -ne 0) {
              cmd /c "echo system_Attrib_T1564.001-9 >> %temp%\T1564.001-9.txt"
          }
          $file = Get-Item $env:temp\T1564.001-9.txt -Force
          $file.attributes='Hidden'
        cleanup: |-
          cmd /c 'del /A:H %temp%\T1564.001-9.txt >nul 2>&1'
