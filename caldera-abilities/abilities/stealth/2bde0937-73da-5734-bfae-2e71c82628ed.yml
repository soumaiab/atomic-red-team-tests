- requirements: []
  name: Soumaia ART Tests - Remove Administrative Shares
  description: "Administrative shares are hidden network shares created by Microsoft’s Windows NT operating systems that grant system administrators \nremote access to every disk volume on a network-connected system. As Microsoft puts it, “Missing administrative shares typically \nindicate that the computer in question has been compromised by malicious software.\nhttps://threatpost.com/conti-ransomware-gang-has-full-log4shell-attack-chain/177173/ (requires elevation)"
  tactic: stealth
  technique_id: T1070.005
  technique_name: 'Indicator Removal on Host: Network Share Connection Removal'
  executors:
  - cleanup:
    - net share ADMIN$ /UNLIMITED >nul 2>&1 & net share C$=C:\ >nul 2>&1 & net share IPC$ >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: for %i in (C$ IPC$ ADMIN$) do net share %i /delete
  id: 2bde0937-73da-5734-bfae-2e71c82628ed
