- id: 78ebe1ce-f9e7-52a9-9401-5be8a6d6c99f
  name: Soumaia ART Tests - Masquerading - wscript.exe running as svchost.exe
  description: 'Copies wscript.exe, renames it, and launches it to masquerade as an instance of svchost.exe.


    Upon execution, no windows will remain open but wscript will have been renamed to svchost and ran out of the temp folder'
  tactic: stealth
  technique:
    attack_id: T1036.003
    name: 'Masquerading: Rename System Utilities'
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand 
          )
          copy %SystemRoot%\System32\wscript.exe %APPDATA%\svchost.exe /Y
          cmd.exe /c %APPDATA%\svchost.exe "%TEMP%\ART-ExternalPayloads\T1036.003\src\T1036.003_masquerading.vbs"
        cleanup: |-
          del /Q /F %APPDATA%\svchost.exe >nul 2>&1
