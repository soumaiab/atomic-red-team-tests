- id: e876f1c3-ac22-5b72-b233-a7d8b1745797
  name: Soumaia ART Tests - Delete Prefetch File
  description: 'Delete a single prefetch file.  Deletion of prefetch files is a known anti-forensic technique. To verify execution, Run `(Get-ChildItem -Path "$Env:SystemRoot\prefetch\*.pf" | Measure-Object).Count`

    before and after the test to verify that the number of prefetch files decreases by 1. (requires elevation)'
  tactic: stealth
  technique:
    attack_id: T1070.004
    name: 'Indicator Removal on Host: File Deletion'
  platforms:
    windows:
      psh:
        command: |-
          Remove-Item -Path (Join-Path "$Env:SystemRoot\prefetch\" (Get-ChildItem -Path "$Env:SystemRoot\prefetch\*.pf" -Name)[0])
