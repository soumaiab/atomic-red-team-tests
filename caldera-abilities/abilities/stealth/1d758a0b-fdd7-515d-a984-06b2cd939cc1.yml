- id: 1d758a0b-fdd7-515d-a984-06b2cd939cc1
  name: Soumaia ART Tests - Masquerading as Windows LSASS process
  description: 'Copies cmd.exe, renames it, and launches it to masquerade as an instance of lsass.exe.


    Upon execution, cmd will be launched by powershell. If using Invoke-AtomicTest, The test will hang until the 120 second timeout cancels the session'
  tactic: stealth
  technique:
    attack_id: T1036.003
    name: 'Masquerading: Rename System Utilities'
  platforms:
    windows:
      cmd:
        command: |-
          copy %SystemRoot%\System32\cmd.exe %SystemRoot%\Temp\lsass.exe
          %SystemRoot%\Temp\lsass.exe /B
        cleanup: |-
          del /Q /F %SystemRoot%\Temp\lsass.exe >nul 2>&1
