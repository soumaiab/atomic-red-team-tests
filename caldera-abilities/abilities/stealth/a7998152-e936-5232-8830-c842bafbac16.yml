- requirements: []
  name: Soumaia ART Tests - Masquerading cmd.exe as VEDetector.exe
  description: 'This test simulates an adversary renaming cmd.exe to VEDetector.exe to masquerade as a legitimate application.

    The test copies cmd.exe, renames it to VEDetector.exe, adds a registry run key for persistence, and executes the renamed binary.

    This technique may be used to evade detection by mimicking legitimate software names or locations.


    **Expected Output:**

    - A new process named VEDetector.exe appears in the process list, but its behavior matches cmd.exe.

    - SIEM/EDR systems may detect this as suspicious process activity (e.g., Sysmon Event ID 1 for process creation, or Event ID 13 for registry modifications).

    - Registry modification in HKLM:\Software\Microsoft\Windows\CurrentVersion\Run may trigger persistence alerts in XDR platforms.


    **References:**

    - [MITRE ATT&CK T1036.005](https://attack.mitre.org/techniques/T1036/005/)

    - [Sysmon Process Creation](https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon) (requires elevation)'
  tactic: stealth
  technique_id: T1036.005
  technique_name: 'Masquerading: Match Legitimate Name or Location'
  executors:
  - cleanup:
    - Remove-ItemProperty -Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "VEDetector" -ErrorAction SilentlyContinue; Stop-Process -Name "VEDetector" -Force -ErrorAction SilentlyContinue; Remove-Item -Path "$env:TEMP\VEDetector.exe" -Force -ErrorAction SilentlyContinue; Write-Host "[+] Cleaned up VEDetector artifacts"
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFMAeQBzAHQAZQBtAFIAbwBvAHQAXABTAHkAcwB0AGUAbQAzADIAXABjAG0AZAAuAGUAeABlACIAKQAgAHsAIABlAHgAaQB0ACAAMAAgAH0AIABlAGwAcwBlACAAewAgAGUAeABpAHQAIAAxACAAfQAKAA==; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; Copy-Item -Path "$env:SystemRoot\System32\cmd.exe" -Destination "$env:TEMP\VEDetector.exe" -Force; New-ItemProperty -Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "VEDetector" -Value "$env:TEMP\VEDetector.exe" -PropertyType String -Force; Start-Process -FilePath "$env:TEMP\VEDetector.exe"; Start-Sleep -Seconds 5
  id: a7998152-e936-5232-8830-c842bafbac16
