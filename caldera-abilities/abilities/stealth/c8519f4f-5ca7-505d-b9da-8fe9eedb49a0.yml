- id: c8519f4f-5ca7-505d-b9da-8fe9eedb49a0
  name: Soumaia ART Tests - Prevent Powershell History Logging
  description: Prevents Powershell history
  tactic: stealth
  technique:
    attack_id: T1070.003
    name: 'Indicator Removal on Host: Clear Command History'
  platforms:
