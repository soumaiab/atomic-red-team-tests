- id: d7238562-0790-5031-b424-1ebea0a372af
  name: Soumaia ART Tests - Create an "Administrator " user (with a space on the end)
  description: Creating a user with a username containing with a space on the end (requires elevation)
  tactic: stealth
  technique:
    attack_id: T1564
    name: Hide Artifacts
  platforms:
    windows:
      psh:
        command: |-
          New-LocalUser -Name "Administrator " -NoPassword
        cleanup: |-
          Remove-LocalUser -Name "Administrator " 2>&1 | out-null
