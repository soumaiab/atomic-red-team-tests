- requirements: []
  name: Soumaia ART Tests - Detect Virtualization Environment (Windows)
  description: Windows Management Instrumentation(WMI) objects contains system information which helps to detect virtualization. This command will specifically attempt to get the CurrentTemperature value from this object and will check to see if the attempt results in an error that contains the word supported. This is meant to find the result of Not supported, which is the result if run in a virtual machine
  tactic: stealth
  technique_id: T1497.001
  technique_name: 'Virtualization/Sandbox Evasion: System Checks'
  executors:
  - cleanup:
    - $error.clear()
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: $error.clear(); Get-WmiObject -Query "SELECT * FROM MSAcpi_ThermalZoneTemperature" -ErrorAction SilentlyContinue; if($error) {echo "Virtualization Environment detected"}
  id: 1a8179d0-229c-5cbd-a614-530ee20afcf4
