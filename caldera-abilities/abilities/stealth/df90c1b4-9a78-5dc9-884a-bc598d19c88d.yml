- id: df90c1b4-9a78-5dc9-884a-bc598d19c88d
  name: Soumaia ART Tests - Binary Masquerading via Invisible Unicode
  description: 'Copies a system binary (calc.exe) to a new name containing an invisible character (U+200D) and executes it.

    This tests the ability of EDRs to handle non-normalized file paths in process execution events.'
  tactic: stealth
  technique:
    attack_id: T1027.018
    name: 'Obfuscated Files or Information: Invisible Unicode'
  platforms:
    windows:
      psh:
        command: |-
          $hiddentarget = "$env:TEMP\calc" + [char]0x200D + ".exe"
          Copy-Item "C:\Windows\System32\calc.exe" -Destination $hiddentarget
          Start-Process $hiddentarget
        cleanup: |-
          $hiddentarget = "$env:TEMP\calc" + [char]0x200D + ".exe"
          Stop-Process -Name "calc*" -ErrorAction Ignore
          Remove-Item $hiddentarget -ErrorAction Ignore
