- requirements: []
  name: Soumaia ART Tests - Changing RDP Port to Non Standard Port via Command_Prompt
  description: Changing RDP Port to Non Standard Port via Command_Prompt (requires elevation)
  tactic: lateral-movement
  technique_id: T1021.001
  technique_name: 'Remote Services: Remote Desktop Protocol'
  executors:
  - cleanup:
    - reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v PortNumber /t REG_DWORD /d 3389 /f >nul 2>&1 & netsh advfirewall firewall delete rule name="RDPPORTLatest-TCP-In" >nul 2>&1 & net stop TermService /y >nul 2>&1 & net start TermService >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v PortNumber /t REG_DWORD /d 4489 /f & netsh advfirewall firewall add rule name="RDPPORTLatest-TCP-In" dir=in action=allow protocol=TCP localport=4489
  id: 64cdbaa9-e0bd-54e9-8391-b828325b3f1d
