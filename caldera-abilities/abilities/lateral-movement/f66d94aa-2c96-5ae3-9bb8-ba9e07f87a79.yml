- id: f66d94aa-2c96-5ae3-9bb8-ba9e07f87a79
  name: Soumaia ART Tests - Remote Code Execution with PS Credentials Using Invoke-Command
  description: "Simulate lateral movement with PowerShell Remoting on the local host. \nUpon successful execution, PowerShell will execute `whoami` using `Invoke-Command`, targeting the \nlocal machine as remote target."
  tactic: lateral-movement
  technique:
    attack_id: T1021.006
    name: 'Remote Services: Windows Remote Management'
  platforms:
    windows:
      psh:
        command: |-
          Enable-PSRemoting -Force
          Invoke-Command -ComputerName $env:COMPUTERNAME -ScriptBlock {whoami}
        cleanup: |-
          Disable-PSRemoting -Force
