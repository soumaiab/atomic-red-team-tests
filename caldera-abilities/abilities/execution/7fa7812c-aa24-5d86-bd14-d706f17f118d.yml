- requirements: []
  name: Soumaia ART Tests - Application uninstall using WMIC
  description: Emulates uninstalling  applications using WMIC.  This method only works if the product was installed with an msi file.  APTs have been seen using this to uninstall security products. (requires elevation)
  tactic: execution
  technique_id: T1047
  technique_name: Windows Management Instrumentation
  executors:
  - cleanup:
    - msiexec /i "%TEMP%\ART-ExternalPayloads\tightvncinstaller.msi" /qn /norestart
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand  & if not "%ERRORLEVEL%"=="0" ( powershell -NoProfile -EncodedCommand  ) & wmic /node:"127.0.0.1" product where "name like 'Tightvnc%%'" call uninstall
  id: 7fa7812c-aa24-5d86-bd14-d706f17f118d
