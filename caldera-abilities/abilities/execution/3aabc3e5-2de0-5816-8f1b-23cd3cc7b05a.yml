- id: 3aabc3e5-2de0-5816-8f1b-23cd3cc7b05a
  name: Soumaia ART Tests - Pipe Creation - PsExec Tool Execution From Suspicious Locations
  description: Requires PsExec tool installed. BlackCat Ransomeware tried to propagate by creating pipe using PsExec process executing from suspicious locations (In the particular case the legitimate PsExec executable is embedded within the Windows variant and is dropped in the victim’s %TEMP% directory). pon successful execution, PsExec will be executed from suspicious location and create a new pipe to execute CMD. (requires elevation)
  tactic: execution
  technique:
    attack_id: T1569.002
    name: 'System Services: Service Execution'
  platforms:
    windows:
      psh:
        command: "powershell -NoProfile -EncodedCommand \nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand \n}\ncd C:\\Users\\Public\\Temp\\ \n.\\PsExec.exe -i -s cmd  -accepteula"
