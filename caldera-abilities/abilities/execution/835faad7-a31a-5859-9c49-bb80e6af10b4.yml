        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKAB0AGUAcwB0AC0AcABhAHQAaAAgACIAJABlAG4AdgA6AFQARQBNAFAAXABBAFIAVAAtAEUAeAB0AGUAcgBuAGEAbABQAGEAeQBsAG8AYQBkAHMAXABUADEAMAA1ADkAXwAwADAAMwBuAG8AdABlAC4AdAB4AHQAIgApAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
