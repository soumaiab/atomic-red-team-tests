- id: aa1e63a1-1052-5427-bf04-cbf0f71221cb
  name: Soumaia ART Tests - PowerShell Session Creation and Use
  description: 'Connect to a remote powershell session and interact with the host.

    Upon execution, network test info and ''T1086 PowerShell Session Creation and Use'' will be displayed. (requires elevation)'
  tactic: execution
  technique:
    attack_id: T1059.001
    name: 'Command and Scripting Interpreter: PowerShell'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand RQBuAGEAYgBsAGUALQBQAFMAUgBlAG0AbwB0AGkAbgBnAAoA
          }
          New-PSSession -ComputerName $env:COMPUTERNAME
          Test-Connection $env:COMPUTERNAME
          Set-Content -Path $env:TEMP\T1086_PowerShell_Session_Creation_and_Use -Value "T1086 PowerShell Session Creation and Use"
          Get-Content -Path $env:TEMP\T1086_PowerShell_Session_Creation_and_Use
          Remove-Item -Force $env:TEMP\T1086_PowerShell_Session_Creation_and_Use
