- requirements: []
  name: Soumaia ART Tests - Command prompt writing script to file then executes it
  description: "Simulate DarkGate malware's second stage by writing a VBscript to disk directly from the command prompt then executing it.\n    The script will execute 'whoami' then exit. (requires elevation)"
  tactic: execution
  technique_id: T1059.003
  technique_name: 'Command and Scripting Interpreter: Windows Command Shell'
  executors:
  - cleanup:
    - del "AtomicTest.vbs" >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: c:\windows\system32\cmd.exe /c cd /d %TEMP%\ & echo Set objShell = CreateObject("WScript.Shell"):Set objExec = objShell.Exec("whoami"):Set objExec = Nothing:Set objShell = Nothing > AtomicTest.vbs & AtomicTest.vbs
  id: cb566696-0786-5fbc-8628-940adac1e3f2
