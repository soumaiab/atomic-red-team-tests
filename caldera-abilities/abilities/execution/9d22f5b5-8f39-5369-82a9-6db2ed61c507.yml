- id: 9d22f5b5-8f39-5369-82a9-6db2ed61c507
  name: Soumaia ART Tests - WMI Reconnaissance List Remote Services
  description: "An adversary might use WMI to check if a certain Remote Service is running on a remote device. \nWhen the test completes, a service information will be displayed on the screen if it exists.\nA common feedback message is that \"No instance(s) Available\" if the service queried is not running.\nA common error message is \"Node - (provided IP or default)  ERROR Description =The RPC server is unavailable\" \nif the provided remote host is unreachable"
  tactic: execution
  technique:
    attack_id: T1047
    name: Windows Management Instrumentation
  platforms:
    windows:
      cmd:
        command: |-
          wmic /node:"127.0.0.1" service where (caption like "%Spooler%")
