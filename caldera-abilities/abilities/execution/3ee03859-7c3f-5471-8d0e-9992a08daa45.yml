- requirements: []
  name: Soumaia ART Tests - Execute a Command as a Service
  description: "Creates a service specifying an arbitrary command and executes it. When executing commands such as PowerShell, the service will report that it did not start correctly even when code executes properly.\n\nUpon successful execution, cmd.exe creates a new service using sc.exe that will start powershell.exe to create a new file `art-marker.txt`\n\n[BlackCat Ransomware (ALPHV)](https://www.varonis.com/blog/blackcat-ransomware)  \n[Cybereason vs. BlackCat Ransomware](https://www.cybereason.com/blog/cybereason-vs.-blackcat-ransomware) (requires elevation)"
  tactic: execution
  technique_id: T1569.002
  technique_name: 'System Services: Service Execution'
  executors:
  - cleanup:
    - del C:\art-marker.txt >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: sc.exe create ARTService binPath= "%COMSPEC% /c powershell.exe -nop -w hidden -command New-Item -ItemType File C:\art-marker.txt" & sc.exe start ARTService & sc.exe delete ARTService
  id: 3ee03859-7c3f-5471-8d0e-9992a08daa45
