- id: 27852a1b-c620-5925-9b56-eb90bd6bc2c8
  name: Soumaia ART Tests - ESXi - Install a custom VIB on an ESXi host
  description: 'An adversary can maintain persistence within an ESXi host by installing malicious vSphere Installation Bundles (VIBs).

    [Reference](https://www.mandiant.com/resources/blog/esxi-hypervisors-malware-persistence)'
  tactic: execution
  technique:
    attack_id: T1129
    name: Server Software Component
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand 
          )
          %TEMP%\ART-ExternalPayloads\pscp.exe -pw pass .\atomicvibes.vib root@atomic.local:/tmp
          echo "" | "%TEMP%\ART-ExternalPayloads\plink.exe" "atomic.local" -ssh  -l "root" -pw "pass" -m ".\esxi_vibinstall.txt"
        cleanup: |-
          echo "" | "%TEMP%\ART-ExternalPayloads\plink.exe" "atomic.local" -ssh  -l "root" -pw "pass" -m ".\esxi_vibremove.txt"
        payloads:
        - atomicvibes.vib
        - esxi_vibinstall.txt
        - esxi_vibremove.txt
