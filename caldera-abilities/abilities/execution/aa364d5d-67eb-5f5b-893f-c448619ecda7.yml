- id: aa364d5d-67eb-5f5b-893f-c448619ecda7
  name: Soumaia ART Tests - Command prompt writing script to file then executes it
  description: "Simulate DarkGate malware's second stage by writing a VBscript to disk directly from the command prompt then executing it.\n    The script will execute 'whoami' then exit. (requires elevation)"
  tactic: execution
  technique:
    attack_id: T1059.003
    name: 'Command and Scripting Interpreter: Windows Command Shell'
  platforms:
    windows:
      cmd:
        command: |-
          c:\windows\system32\cmd.exe /c cd /d %TEMP%\ & echo Set objShell = CreateObject("WScript.Shell"):Set objExec = objShell.Exec("whoami"):Set objExec = Nothing:Set objShell = Nothing > AtomicTest.vbs & AtomicTest.vbs
        cleanup: |-
          del "AtomicTest.vbs" >nul 2>&1
