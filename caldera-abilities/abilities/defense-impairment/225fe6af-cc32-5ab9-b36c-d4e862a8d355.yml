  name: Soumaia ART Tests - Stop and Remove Arbitrary Security Windows Service
  description: Beginning with Powershell 6.0, the Stop-Service cmdlet sends a stop message to the Windows Service Controller for each of the specified services. The Remove-Service cmdlet removes a Windows service in the registry and in the service database. (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          Stop-Service -Name McAfeeDLPAgentService
          Remove-Service -Name McAfeeDLPAgentService
