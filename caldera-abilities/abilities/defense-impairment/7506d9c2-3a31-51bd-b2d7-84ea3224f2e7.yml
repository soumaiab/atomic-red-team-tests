- id: 7506d9c2-3a31-51bd-b2d7-84ea3224f2e7
  name: Soumaia ART Tests - Opening ports for proxy - HARDRAIN
  description: 'This test creates a listening interface on a victim device. This tactic was used by HARDRAIN for proxying.


    reference: https://www.us-cert.gov/sites/default/files/publications/MAR-10135536-F.pdf (requires elevation)'
  tactic: defense-impairment
  technique:
    attack_id: T1686
    name: Disable or Modify System Firewall
  platforms:
    windows:
      cmd:
        command: |-
          netsh advfirewall firewall add rule name="atomic testing" action=allow dir=in protocol=TCP localport=450
        cleanup: |-
          netsh advfirewall firewall delete rule name="atomic testing" protocol=TCP localport=450 >nul 2>&1
