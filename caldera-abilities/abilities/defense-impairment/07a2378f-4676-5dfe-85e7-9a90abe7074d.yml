- requirements: []
  name: Soumaia ART Tests - Throttle Cybersecurity Agent Network Traffic via QoS Policy
  description: 'This test simulates an adversary impairing security agent capabilities by applying Policy-Based Quality of Service (QoS) throttling rules to security agent processes.


    Unlike traditional evasion techniques (such as firewall-based blocking or process termination), this approach leverages native Windows functionality to degrade, rather than disable, defensive tooling:


    - Uses built-in Windows QoS features to manipulate application bandwidth

    - Limits network throughput to extremely low levels (e.g., 8 bits per second)

    - Causes security agents to repeatedly time out when attempting to communicate with their cloud backend


    As a result, telemetry ingestion, alerting, and remote response capabilities may be significantly degraded, while the agent itself continues to run and appear operational.


    This technique is inspired by research from Zero Salarium and the associated EDRChoker tool (https://www.zerosalarium.com/2026/06/edrchoker-choking-telemetry-stream-block-edr.html), which demonstrates how adversaries can exploit the reliance of modern EDR solutions on persistent, low-latency cloud connectivity to create a temporary loss of visibility without triggering traditional tampering detections. (requires elevation)'
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup:
    - Get-NetQosPolicy -PolicyStore ActiveStore | Where-Object { $_.Name -like "*CyberSecurityAgentThrottlingTest*" } | Remove-NetQosPolicy -Confirm:$false
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
