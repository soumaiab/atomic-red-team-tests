- requirements: []
  name: Soumaia ART Tests - Take ownership using takeown utility
  description: 'Modifies the filesystem permissions of the specified file or folder to take ownership of the object. Upon execution, "SUCCESS" will

    be displayed for the folder and each file inside of it.'
  tactic: defense-impairment
  technique_id: T1222.001
  technique_name: 'File and Directory Permissions Modification: Windows File and Directory Permissions Modification'
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: cmd /c "IF EXIST %temp%\T1222.001_takeown_folder ( EXIT 0 ) ELSE ( EXIT 1 )" & if not "%ERRORLEVEL%"=="0" ( cmd /c "mkdir %temp%\T1222.001_takeown_folder & echo T1222.001_takeown1 >> %temp%\T1222.001_takeown_folder\T1222.001_takeown1.txt & echo T1222.001_takeown2 >> %temp%\T1222.001_takeown_folder\T1222.001_takeown2.txt" ) & takeown.exe /f %temp%\T1222.001_takeown_folder /r
  id: 70c0865b-f4b7-5cc6-81f7-ab87ea61ce49
