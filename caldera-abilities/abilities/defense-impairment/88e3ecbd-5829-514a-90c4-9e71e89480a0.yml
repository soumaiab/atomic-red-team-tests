- id: 88e3ecbd-5829-514a-90c4-9e71e89480a0
  name: Soumaia ART Tests - Disable Windows IIS HTTP Logging
  description: 'Disables HTTP logging on a Windows IIS web server as seen by Threat Group 3390 (Bronze Union).

    This action requires HTTP logging configurations in IIS to be unlocked.


    Use the cleanup commands to restore some default auditpol settings (your original settings will be lost)'
  tactic: defense-impairment
  technique:
    attack_id: T1685.001
    name: 'Disable or Modify Tools: Disable or Modify Windows Event Log'
  platforms:
    windows:
      psh:
        command: |-
          C:\Windows\System32\inetsrv\appcmd.exe set config "Default Web Site" /section:httplogging /dontLog:true
        cleanup: |-
          if(Test-Path "C:\Windows\System32\inetsrv\appcmd.exe"){
            C:\Windows\System32\inetsrv\appcmd.exe set config "Default Web Site" /section:httplogging /dontLog:false *>$null
          }
