- id: 8135e3ef-7031-5db6-aa18-f36e66858a1a
  name: Soumaia ART Tests - Disable .NET Event Tracing for Windows Via Registry (powershell)
  description: Disables ETW for the .NET Framework using PowerShell to update the Windows registry (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          New-ItemProperty -Path HKLM:\Software\Microsoft\.NETFramework -Name ETWEnabled -Value 0 -PropertyType "DWord" -Force
        cleanup: |-
          REG DELETE HKLM\Software\Microsoft\.NETFramework /v ETWEnabled /f > $null 2>&1
