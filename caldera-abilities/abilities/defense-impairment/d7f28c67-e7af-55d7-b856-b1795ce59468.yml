- id: d7f28c67-e7af-55d7-b856-b1795ce59468
  name: Soumaia ART Tests - Disable EventLog-Application Auto Logger Session Via Registry - Cmd
  description: This atomic simulates an activity where an attacker disables the EventLog-Application ETW Auto Logger session using the reg.exe utility to update the Windows registry value "Start". This would effectivly disable the Event log application channel. The changes would only take effect after a restart. (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\System\CurrentControlSet\Control\WMI\Autologger\EventLog-Application" /v "Start" /t REG_DWORD /d "0" /f
        cleanup: |-
          reg add "HKLM\System\CurrentControlSet\Control\WMI\Autologger\EventLog-Application" /v "Start" /t REG_DWORD /d "1" /f
