- id: 4df89d53-a986-51dc-96e8-8ef92f27d4fd
  name: Soumaia ART Tests - Install root CA on Windows
  description: Creates a root CA with Powershell (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1553.004
    name: 'Subvert Trust Controls: Install Root Certificate'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgAHIAbwBvAHQAQwBBAC4AYwBlAHIAKQAgAHsAIABlAHgAaQB0ACAAMAAgAH0AIABlAGwAcwBlACAAewAgAGUAeABpAHQAIAAxACAAfQAKAA==
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
