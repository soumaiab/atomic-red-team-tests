- id: c7efd2d3-8bd9-5e70-81ac-3a6b86877b0b
  name: Soumaia ART Tests - Modify Event Log Channel Access Permissions via Registry - PowerShell
  description: 'This test simulates an adversary modifying access permissions for a Windows Event Log Channel by altering the "ChannelAccess" registry value. Specifically, it changes the Security Descriptor Definition Language (SDDL) string. These modifications can restrict or grant access to specific users or groups, potentially aiding in defense evasion by controlling who can view or modify a event log channel.

    Upon execution, the user shouldn''t be able to access the event log channel via the event viewer or via utilities such as "Get-EventLog" or "wevtutil". (requires elevation)'
  tactic: defense-impairment
  technique:
    attack_id: T1685.001
    name: 'Disable or Modify Tools: Disable or Modify Windows Event Log'
  platforms:
    windows:
      psh:
        command: |-
          Set-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-TaskScheduler/Operational -Name "ChannelAccess" -Value "O:SYG:SYD:(D;;0x1;;;WD)"
          Restart-Service -Name EventLog -Force -ErrorAction Ignore
        cleanup: |-
          Set-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-TaskScheduler/Operational -Name "ChannelAccess" -Value "O:BAG:SYD:(A;;0x2;;;S-1-15-2-1)(A;;0x2;;;S-1-15-3-1024-3153509613-960666767-3724611135-2725662640-12138253-543910227-1950414635-4190290187)(A;;0xf0007;;;SY)(A;;0x7;;;BA)(A;;0x7;;;SO)(A;;0x3;;;IU)(A;;0x3;;;SU)(A;;0x3;;;S-1-5-3)(A;;0x3;;;S-1-5-33)(A;;0x1;;;S-1-5-32-573)"
          Restart-Service -Name EventLog -Force -ErrorAction Ignore
