- id: 116fbdab-2a80-5f23-9da8-5c155b6e43a6
  name: Soumaia ART Tests - LockBit Black - Disable Privacy Settings Experience Using Registry -Powershell
  description: LockBit Black - Disable Privacy Settings Experience Using Registry (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          New-ItemProperty "HKCU:\Software\Policies\Microsoft\Windows\OOBE" -Name DisablePrivacyExperience -PropertyType DWord -Value 1 -Force
        cleanup: |-
          Remove-ItemProperty "HKCU:\Software\Policies\Microsoft\Windows\OOBE" -Name DisablePrivacyExperience -Force -ErrorAction Ignore
