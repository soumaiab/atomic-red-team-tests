    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: powershell -NoProfile -EncodedCommand  & if not "%ERRORLEVEL%"=="0" ( powershell -NoProfile -EncodedCommand  ) & "C:\Program Files (x86)\Windows Resource Kits\Tools\subinacl.exe"
