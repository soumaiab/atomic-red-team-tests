- requirements: []
  name: Soumaia ART Tests - LockBit Black - Disable the ETW Provider of Windows Defender -Powershell
  description: 'An adversary can disable the ETW Provider of Windows Defender,

    so nothing would be logged to Microsoft-Windows-Windows-Defender/Operational anymore.

    https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-075a (requires elevation)'
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup:
    - Remove-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational" -Name Enabled -Force -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: New-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational" -Name Enabled  -PropertyType DWord -Value 0 -Force
  id: bf651a61-fb7d-5bf8-82df-b2e5f81bd860
