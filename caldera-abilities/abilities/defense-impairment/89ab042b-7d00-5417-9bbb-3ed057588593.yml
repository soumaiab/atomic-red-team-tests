- id: 89ab042b-7d00-5417-9bbb-3ed057588593
  name: Soumaia ART Tests - Tamper with Windows Defender Command Prompt
  description: 'Attempting to disable scheduled scanning and other parts of windows defender atp. These commands must be run as System, so they still fail as administrator.

    However, adversaries do attempt to perform this action so monitoring for these command lines can help alert to other bad things going on. Upon execution, "Access Denied"

    will be displayed twice and the WinDefend service status will be displayed. (requires elevation)'
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      cmd:
        command: |-
          sc stop WinDefend
          sc config WinDefend start=disabled
          sc query WinDefend
        cleanup: |-
          sc start WinDefend >nul 2>&1
          sc config WinDefend start=enabled >nul 2>&1
