- requirements: []
  name: Soumaia ART Tests - Delete Microsoft Defender ASR Rules - GPO
  description: This test simulates the deletion of the ASR rules loaded by Microsoft Defender using the registry. Depending on the deployment, rules can be pushed either using GPO or InTune, This test simulates a GPO-based rules deployment. (requires elevation)
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: '$registryPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules"; if (-not (Test-Path $registryPath)) { New-Item -Path $registryPath -Force; Write-Host "Registry key created: $registryPath" }; $newValueName = "36190899-1602-49e8-8b27-eb1d0a1ce869"; $newValueData = "1"; New-ItemProperty -Path $registryPath -Name $newValueName -PropertyType String -Value $newValueData -Force; Write-Host "Registry value created: $newValueName with data $newValueData"; Remove-ItemProperty -Path $registryPath -Name $newValueName; Write-Host "Registry value deleted: $newValueName"'
  id: 6495f106-4227-59c5-8fbd-29042e2220f2
