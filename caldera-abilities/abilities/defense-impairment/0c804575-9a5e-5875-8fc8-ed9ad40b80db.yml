- requirements: []
  name: Soumaia ART Tests - Disable EventLog-Application ETW Provider Via Registry - Cmd
  description: This atomic simulates an activity where an attacker disables a specific ETW provider from the EventLog-Application ETW Auto Logger session using the reg.exe utility to update the Windows registry value "Enabled". This would effectivly remove that provider from the session and cause to not emit any logs of that type. The changes would only take effect after a restart. (requires elevation)
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup:
    - reg add "HKLM\System\CurrentControlSet\Control\WMI\Autologger\EventLog-Application\{B6D775EF-1436-4FE6-BAD3-9E436319E218}" /v "Enabled" /t REG_DWORD /d "1" /f
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKLM\System\CurrentControlSet\Control\WMI\Autologger\EventLog-Application\{B6D775EF-1436-4FE6-BAD3-9E436319E218}" /v "Enabled" /t REG_DWORD /d "0" /f
  id: 0c804575-9a5e-5875-8fc8-ed9ad40b80db
