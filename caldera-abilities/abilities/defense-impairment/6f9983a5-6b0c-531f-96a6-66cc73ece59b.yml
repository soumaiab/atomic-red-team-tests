- requirements: []
  name: Soumaia ART Tests - Clear Windows Audit Policy Config
  description: Clear the Windows audit policy using auditpol utility. This action would stop certain audit events from being recorded in the security log. (requires elevation)
  tactic: defense-impairment
  technique_id: T1685.001
  technique_name: 'Disable or Modify Tools: Disable or Modify Windows Event Log'
  executors:
  - cleanup:
    - auditpol /set /category:"Account Logon" /success:enable /failure:enable & auditpol /set /category:"Detailed Tracking" /success:enable & auditpol /set /category:"Logon/Logoff" /success:enable /failure:enable
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: auditpol /clear /y & auditpol /remove /allusers
  id: 6f9983a5-6b0c-531f-96a6-66cc73ece59b
