- requirements: []
  name: Soumaia ART Tests - Disable EventLog-Application ETW Provider Via Registry - PowerShell
  description: This atomic simulates an activity where an attacker disables a specific ETW provider from the EventLog-Application ETW Auto Logger session using the powershell.exe "New-ItemProperty" cmdlet to update the Windows registry value "Enabled". This would effectivly remove that provider from the session and cause to not emit any logs of that type. The changes would only take effect after a restart. (requires elevation)
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup:
    - New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\WMI\Autologger\EventLog-Application\{B6D775EF-1436-4FE6-BAD3-9E436319E218}" -Name Enabled -Value 1 -PropertyType "DWord" -Force
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\WMI\Autologger\EventLog-Application\{B6D775EF-1436-4FE6-BAD3-9E436319E218}" -Name Enabled -Value 0 -PropertyType "DWord" -Force
  id: a4926a12-02f6-583a-a5ea-9d7490ae7c3e
