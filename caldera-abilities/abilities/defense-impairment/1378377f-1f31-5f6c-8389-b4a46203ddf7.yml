- requirements: []
  name: Soumaia ART Tests - Disable Microsoft Defender Firewall via Registry
  description: 'Disables the Microsoft Defender Firewall for the public profile via registry

    Caution if you access remotely the host where the test runs! Especially with the cleanup command which will re-enable firewall for the current profile...'
  tactic: defense-impairment
  technique_id: T1686
  technique_name: Disable or Modify System Firewall
  executors:
  - cleanup:
    - reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile" /v "EnableFirewall" /t REG_DWORD /d 1 /f
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile" /v "EnableFirewall" /t REG_DWORD /d 0 /f
  id: 1378377f-1f31-5f6c-8389-b4a46203ddf7
