- requirements: []
  name: Soumaia ART Tests - Disable Windows Defender with DISM
  description: "The following Atomic will attempt to disable Windows-Defender using the built in DISM.exe, Deployment Image Servicing and Management tool. \nDISM is used to enumerate, install, uninstall, configure, and update features and packages in Windows images.\nA successful execution will not standard-out any details. Remove the quiet switch if verbosity is needed.\nThis method will remove Defender and it's package. (requires elevation)"
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup: []
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: Dism /online /Disable-Feature /FeatureName:Windows-Defender /Remove /NoRestart /quiet
  id: 74902609-792e-51a1-92b0-d201c09cc423
