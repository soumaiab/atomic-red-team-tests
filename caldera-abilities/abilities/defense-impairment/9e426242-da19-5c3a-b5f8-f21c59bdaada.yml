- requirements: []
  name: Soumaia ART Tests - Disable Microsoft Defender Firewall
  description: 'Disables the Microsoft Defender Firewall for the current profile.

    Caution if you access remotely the host where the test runs! Especially with the cleanup command which will re-enable firewall for the current profile...'
  tactic: defense-impairment
  technique_id: T1686
  technique_name: Disable or Modify System Firewall
  executors:
  - cleanup:
    - netsh advfirewall set currentprofile state on >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: netsh advfirewall set currentprofile state off
  id: 9e426242-da19-5c3a-b5f8-f21c59bdaada
