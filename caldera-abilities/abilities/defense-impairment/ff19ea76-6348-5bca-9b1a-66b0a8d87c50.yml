- id: ff19ea76-6348-5bca-9b1a-66b0a8d87c50
  name: Soumaia ART Tests - Tamper with Windows Defender Evade Scanning -Extension
  description: "Malware can exclude specific extensions from being scanned and evading detection. \nUpon successful execution, the extension(s) should be on the list of excluded extensions.\nTo check the exclusion list using poweshell  (Get-MpPreference).ExclusionExtension. (requires elevation)"
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          $excludedExts= ".exe"
          Add-MpPreference -ExclusionExtension  $excludedExts
        cleanup: |-
          $excludedExts= ".exe"
          Remove-MpPreference -ExclusionExtension  $excludedExts -ErrorAction Ignore
