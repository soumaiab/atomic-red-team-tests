- requirements: []
  name: Soumaia ART Tests - Allow SMB and RDP on Microsoft Defender Firewall
  description: 'Allow all SMB and RDP rules on the Microsoft Defender Firewall for all profiles.

    Caution if you access remotely the host where the test runs! Especially with the cleanup command which will reset the firewall and risk disabling those services...'
  tactic: defense-impairment
  technique_id: T1686
  technique_name: Disable or Modify System Firewall
  executors:
  - cleanup:
    - netsh advfirewall reset >nul 2>&1
    timeout: 60
    platform: windows
    name: cmd
    payloads: []
    parsers: []
    command: netsh advfirewall firewall set rule group="remote desktop" new enable=Yes & netsh advfirewall firewall set rule group="file and printer sharing" new enable=Yes
  id: 56945063-b211-5fa8-8097-085cf99c8af7
