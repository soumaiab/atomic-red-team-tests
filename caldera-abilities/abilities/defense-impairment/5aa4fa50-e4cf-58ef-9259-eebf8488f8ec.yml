- id: 5aa4fa50-e4cf-58ef-9259-eebf8488f8ec
  name: Soumaia ART Tests - Open a local port through Windows Firewall to any profile
  description: This test will attempt to open a local port defined by input arguments to any profile (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1686
    name: Disable or Modify System Firewall
  platforms:
    windows:
      psh:
        command: |-
          netsh advfirewall firewall add rule name="Open Port to Any" dir=in protocol=tcp localport=3389 action=allow profile=any
        cleanup: |-
          netsh advfirewall firewall delete rule name="Open Port to Any" | Out-Null
