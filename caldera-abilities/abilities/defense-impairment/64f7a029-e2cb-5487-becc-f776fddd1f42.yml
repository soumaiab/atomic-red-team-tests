- id: 64f7a029-e2cb-5487-becc-f776fddd1f42
  name: Soumaia ART Tests - attrib - hide file
  description: 'Attackers leverage an existing Windows binary, attrib.exe, to mark specific files or folder as hidden by using specific flags so that

    the victim does not see the file.'
  tactic: defense-impairment
  technique:
    attack_id: T1222.001
    name: 'File and Directory Permissions Modification: Windows File and Directory Permissions Modification'
  platforms:
    windows:
      cmd:
        command: |-
          mkdir %temp%\T1222.001_attrib_2 >nul 2>&1
          echo T1222.001_attrib1 >> %temp%\T1222.001_attrib_2\T1222.001_attrib1.txt
          echo T1222.001_attrib2 >> %temp%\T1222.001_attrib_2\T1222.001_attrib2.txt
          attrib.exe +h %temp%\T1222.001_attrib_2\T1222.001_attrib1.txt
          attrib.exe +h %temp%\T1222.001_attrib_2\T1222.001_attrib2.txt
        cleanup: |-
          del /A:H %temp%\T1222.001_attrib_2\T1222.001_attrib*.txt >nul 2>&1
