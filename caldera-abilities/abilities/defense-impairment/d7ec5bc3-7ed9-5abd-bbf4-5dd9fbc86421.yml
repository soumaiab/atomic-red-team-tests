- id: d7ec5bc3-7ed9-5abd-bbf4-5dd9fbc86421
  name: Soumaia ART Tests - Safe Mode Boot
  description: Allows adversaries to abuse safe mode to disable endpoint defenses that may not start with limited boot (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1688
    name: Safe Mode Boot
  platforms:
    windows:
      cmd:
        command: |-
          bcdedit /set safeboot network
        cleanup: |-
          bcdedit /deletevalue {current} safeboot
