- id: 13652baa-559e-580a-afab-9f02d8303165
  name: Soumaia ART Tests - SubInAcl Execution
  description: This test simulates an adversary executing the Windows Resource kit utility SubInAcl. This utility was abused by adversaries in the past in order to modify access permissions. Upon execution, a process creation log should be generated indicating successful execution. (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1222.001
    name: 'File and Directory Permissions Modification: Windows File and Directory Permissions Modification'
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand 
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand 
          )
          "C:\Program Files (x86)\Windows Resource Kits\Tools\subinacl.exe"
