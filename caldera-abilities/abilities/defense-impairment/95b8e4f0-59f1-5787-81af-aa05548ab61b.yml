- id: 95b8e4f0-59f1-5787-81af-aa05548ab61b
  name: Soumaia ART Tests - Clear Windows Audit Policy Config
  description: Clear the Windows audit policy using auditpol utility. This action would stop certain audit events from being recorded in the security log. (requires elevation)
  tactic: defense-impairment
  technique:
    attack_id: T1685.001
    name: 'Disable or Modify Tools: Disable or Modify Windows Event Log'
  platforms:
    windows:
      cmd:
        command: |-
          auditpol /clear /y
          auditpol /remove /allusers
        cleanup: |-
          auditpol /set /category:"Account Logon" /success:enable /failure:enable
          auditpol /set /category:"Detailed Tracking" /success:enable
          auditpol /set /category:"Logon/Logoff" /success:enable /failure:enable
