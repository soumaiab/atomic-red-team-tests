- id: c19c9284-7db9-509f-9179-e04662470cd4
  name: Soumaia ART Tests - Compress Data and lock with password for Exfiltration with 7zip
  description: 'Note: This test requires 7zip installation'
  tactic: collection
  technique:
    attack_id: T1560.001
    name: 'Archive Collected Data: Archive via Utility'
  platforms:
    windows:
      cmd:
        command: |-
          cmd /c "if not exist ""%ProgramFiles%\7-zip\7z.exe"" (exit /b 1)"
          if not "%ERRORLEVEL%"=="0" (
              cmd /c "echo Downloading 7-zip installer & bitsadmin /transfer myDownloadJob /download /priority normal ""https://www.7-zip.org/a/7z2301-x64.exe"" %TEMP%\7zip.exe & %TEMP%\7zip.exe /S"
          )
          mkdir $.\victim-files
          cd $.\victim-files
          echo "This file will be encrypted" > .\encrypted_file.txt
          "%ProgramFiles%\7-zip\7z.exe" u archive.7z *txt -pblue
          dir
        cleanup: |-
          rmdir /s /Q $.\victim-files >nul 2>&1
        payloads:
        - victim-files
