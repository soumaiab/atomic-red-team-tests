- id: d0adaa2b-edf6-5ea1-a89d-53789d6a843f
  name: Soumaia ART Tests - WebBrowserPassView - Credentials from Browser
  description: The following Atomic test utilizes WebBrowserPassView to extract passwords from browsers on a Window system. WebBrowserPassView is an open source application used to retrieve passwords stored on a local computer. Recently noticed as a tool used in the BlackCat Ransomware. (requires elevation)
  tactic: credential-access
  technique:
    attack_id: T1555.003
    name: 'Credentials from Password Stores: Credentials from Web Browsers'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAFcAZQBiAEIAcgBvAHcAcwBlAHIAUABhAHMAcwBWAGkAZQB3AC4AZQB4AGUAIgApACAAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQAKAA==
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          Start-Process ".\WebBrowserPassView.exe"
          Start-Sleep -Second 4
          Stop-Process -Name "WebBrowserPassView"
        payloads:
        - WebBrowserPassView.exe
        - bin
