- requirements: []
  name: Soumaia ART Tests - Persistent Code Execution Via Excel VBA Add-in File (XLAM)
  description: 'Creates an Excel VBA Add-in file (XLAM) which runs automatically when Excel is started

    The sample XLAM provided launches the notepad as a proof-of-concept for persistent execution from Office.'
  tactic: persistence
  technique_id: T1137.006
  technique_name: 'Office Application Startup: Add-ins'
  executors:
  - cleanup:
    - Stop-Process -Name "notepad","Excel" -ErrorAction Ignore; Start-Sleep 3; Remove-Item "$env:APPDATA\Microsoft\Excel\XLSTART\notepad.xlam" -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - Addins
    - ExcelVBAaddin.xlam
    parsers: []
    command: powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAEUAeABjAGUAbAAgAG0AYQBuAHUAYQBsAGwAeQAgAHQAbwAgAG0AZQBlAHQAIAB0AGgAaQBzACAAcgBlAHEAdQBpAHIAZQBtAGUAbgB0ACIACgA= }; powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAEUAeABjAGUAbABWAEIAQQBhAGQAZABpAG4ALgB4AGwAYQBtACIAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; Copy ".\ExcelVBAaddin.xlam" "$env:APPDATA\Microsoft\Excel\XLSTART\notepad.xlam"; Start-Process "Excel"
