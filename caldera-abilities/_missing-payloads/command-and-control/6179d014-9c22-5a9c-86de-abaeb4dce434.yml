- requirements: []
  name: Soumaia ART Tests - Arbitrary file download using the Notepad++ GUP.exe binary
  description: 'GUP is an open source signed binary used by Notepad++ for software updates, and can be used to download arbitrary files(.zip) from internet/github.

    [Reference](https://x.com/nas_bench/status/1535322182863179776?s=20)

    Upon execution, a sample zip file will be downloaded to C:\Temp\Sample folder (requires elevation)'
  tactic: command-and-control
  technique_id: T1105
  technique_name: Ingress Tool Transfer
  executors:
  - cleanup:
    - rmdir /s /q "C:\Temp\Sample" >nul 2>nul
    timeout: 60
    platform: windows
    name: cmd
    payloads:
    - GUP.exe
    - bin
    parsers: []
    command: powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAEcAVQBQAC4AZQB4AGUAIgApACAAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQA= & if not "%ERRORLEVEL%"=="0" ( powershell -NoProfile -EncodedCommand  ) & mkdir "c:\Temp" & cd .\bin & GUP.exe -unzipTo "" "C:\Temp" "Sample https://getsamplefiles.com/download/zip/sample-2.zip CAC4D26F32CA629DFB10FE614ED00EB1066A0C0011386290D3426C3DE2E53AC6"
  id: 6179d014-9c22-5a9c-86de-abaeb4dce434
