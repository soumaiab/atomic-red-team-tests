- id: b1af91b5-b1d9-510c-a410-07740ceadcd2
  name: Soumaia ART Tests - DLL Side-Loading using the Notepad++ GUP.exe binary
  description: 'GUP is an open source signed binary used by Notepad++ for software updates, and is vulnerable to DLL Side-Loading, thus enabling the libcurl dll to be loaded.

    Upon execution, calc.exe will be opened.'
  tactic: stealth
  technique:
    attack_id: T1574.001
    name: 'Hijack Execution Flow: DLL'
  platforms:
    windows:
      cmd:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAEcAVQBQAC4AZQB4AGUAIgApACAAewBlAHgAaQB0ACAAMAB9ACAAZQBsAHMAZQAgAHsAZQB4AGkAdAAgADEAfQAKAA==
          if not "%ERRORLEVEL%"=="0" (
              powershell -NoProfile -EncodedCommand 
          )
          ".\GUP.exe"
        cleanup: |-
          taskkill /F /IM calculator.exe >nul 2>&1
        payloads:
        - GUP.exe
