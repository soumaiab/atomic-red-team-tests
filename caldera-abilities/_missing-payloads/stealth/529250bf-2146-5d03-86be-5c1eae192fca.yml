- id: 529250bf-2146-5d03-86be-5c1eae192fca
  name: Soumaia ART Tests - Read-Write-Execute process Injection
  description: "This test exploited the vulnerability in legitimate PE formats where sections have RWX permission and enough space for shellcode.\nThe RWX injection avoided the use of VirtualAlloc, WriteVirtualMemory, and ProtectVirtualMemory, thus evading detection mechanisms \nthat relied on API call sequences and heuristics. The RWX injection utilises API call sequences: LoadLibrary --> GetModuleInformation --> GetModuleHandleA --> RtlCopyMemory --> CreateThread.\nThe injected shellcode will open a message box and a notepad.\nRWX Process Injection, also known as MockingJay, was introduced to the security community by SecurityJoes.\nMore details can be found at https://www.securityjoes.com/post/process-mockingjay-echoing-rwx-in-userland-to-achieve-code-execution.\nThe original injector and idea were developed for game cheats, as visible at https://github.com/M-r-J-o-h-n/SWH-Injector. (requires elevation)"
  tactic: stealth
  technique:
    attack_id: T1055
    name: Process Injection
  platforms:
    windows:
      psh:
        command: |-
          powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgACIALgBcAG0AcwB5AHMALQAyAC4AMAAuAGQAbABsACIAKQAgAHsAZQB4AGkAdAAgADAAfQAgAGUAbABzAGUAIAB7AGUAeABpAHQAIAAxAH0ACgA=
          if ($LASTEXITCODE -ne 0) {
              powershell -NoProfile -EncodedCommand 
          }
          $address = (& "$.\searchVuln.exe" "$.\vuln_dll" | Out-String | Select-String -Pattern "VirtualAddress: (\w+)").Matches.Groups[1].Value
          & ".\RWXinjectionLocal.exe" ".\msys-2.0.dll" $address
        cleanup: |-
          Get-Process -Name Notepad -ErrorAction SilentlyContinue | Stop-Process -Force
        payloads:
        - RWXinjectionLocal.exe
        - msys-2.0.dll
        - searchVuln.exe
        - vuln_dll
